<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHOPYSPACE | ASSET DETAILS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Barlow+Condensed:wght@700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --blue-primary: #00d2ff;
            --blue-dark: #0056ff;
            --yellow-accent: #ffb800;
            --yellow-bright: #ffe600;
            --bg-dark: #050a12;
            --bg-card: #0e1621;
            --text-white: #ffffff;
            --grad-blue: linear-gradient(90deg, #00d2ff 0%, #0056ff 100%);
            --grad-yellow: linear-gradient(90deg, #ffb800 0%, #ffe600 100%);
            --success: #00ff88;
            --font-impact: 'Barlow Condensed', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        ::-webkit-scrollbar { display: none; }
        
        body {
            margin: 0; background-color: var(--bg-dark); color: var(--text-white);
            font-family: 'Rajdhani', sans-serif; min-height: 100vh; overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #102a4d 0%, var(--bg-dark) 70%);
        }

        /* --- NAVEGACIÓN --- */
        nav {
            background: rgba(0, 0, 0, 0.85); border-bottom: 2px solid var(--blue-primary);
            padding: 0 20px; display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000; height: 70px;
        }
        .logo-img { height: 40px; cursor: pointer; filter: drop-shadow(0 0 8px var(--blue-primary)); }
        .nav-right { display: flex; align-items: center; gap: 12px; }

        .back-btn {
            background: rgba(255,255,255,0.05); color: white; text-decoration: none;
            font-family: var(--font-impact); padding: 8px 12px; font-weight: 800;
            text-transform: uppercase; font-size: 0.8rem; border: 1px solid rgba(0, 210, 255, 0.3);
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }

        #chat-btn {
            display: none; background: rgba(0, 210, 255, 0.1); border: 1px solid var(--blue-primary);
            color: var(--blue-primary); padding: 6px 10px; border-radius: 4px; align-items: center;
            gap: 5px; text-decoration: none; font-family: var(--font-impact); font-size: 0.85rem;
        }

        /* --- CONTENIDO PRINCIPAL --- */
        .wrapper { max-width: 1000px; margin: 20px auto; padding: 0 15px; }

        .main-card {
            display: grid; grid-template-columns: 1fr 1.2fr; background: var(--bg-card);
            border-radius: 15px; border: 1px solid #1a2635; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .image-side { background: #000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .image-side img { width: 100%; border-radius: 8px; object-fit: contain; max-height: 400px; }

        .info-side { padding: 30px; display: flex; flex-direction: column; }
        .category-tag {
            background: var(--grad-blue); padding: 3px 12px; font-family: 'Orbitron';
            font-size: 0.6rem; clip-path: polygon(0 0, 100% 0, 85% 100%, 0 100%);
            margin-bottom: 10px; width: fit-content; color: white;
        }

        h1 { font-family: var(--font-impact); font-size: 2.5rem; margin: 0; text-transform: uppercase; font-style: italic; color: #fff; }

        /* BINANCE STYLE PRICE BOX */
        .price-binance {
            background: #000; border-left: 4px solid var(--yellow-accent);
            padding: 15px; margin: 20px 0; border-radius: 4px;
        }
        .price-label { font-family: var(--font-mono); font-size: 0.7rem; color: #555; display: block; margin-bottom: 5px; }
        .price-val { font-family: var(--font-mono); font-size: 2rem; color: var(--yellow-bright); font-weight: 900; }

        .item-desc { color: #8899af; font-size: 0.95rem; line-height: 1.5; margin-bottom: 20px; border-top: 1px solid #1a2635; padding-top: 15px; }

        .specs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .spec-item { background: rgba(0,0,0,0.3); padding: 10px; border: 1px solid #1a2635; }
        .spec-item label { display: block; font-size: 0.6rem; color: var(--blue-primary); text-transform: uppercase; margin-bottom: 4px; }
        .spec-item span { font-family: 'Orbitron'; font-size: 0.85rem; }

        .action-btn {
            width: 100%; background: var(--grad-yellow); border: none; padding: 18px;
            font-family: var(--font-impact); font-size: 1.4rem; font-weight: 800;
            cursor: pointer; text-transform: uppercase; clip-path: polygon(4% 0, 100% 0, 96% 100%, 0 100%);
        }

        /* --- SECCIÓN GRÁFICO --- */
        .market-analysis {
            margin-top: 20px; background: var(--bg-card); border-radius: 15px;
            border: 1px solid #1a2635; padding: 20px;
        }
        .chart-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .live-status { display: flex; align-items: center; gap: 8px; font-family: 'Orbitron'; font-size: 0.7rem; color: var(--blue-primary); }
        .dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; box-shadow: 0 0 8px var(--success); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        
        .chart-container { height: 250px; width: 100%; }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .main-card { grid-template-columns: 1fr; }
            h1 { font-size: 1.8rem; }
            .info-side { padding: 20px; }
        }
    </style>
</head>
<body>

<nav>
    <img src="img/Shopy.png" class="logo-img" onclick="window.location.href='https://irathiens.org/ShopySpace'">
    <div class="nav-right">
        <a href="Chats.html" id="chat-btn">CHATS</a>
        <a href="https://irathiens.org/ShopySpace" class="back-btn">MARKET</a>
    </div>
</nav>

<div class="wrapper">
    <div class="main-card">
        <div class="image-side">
            <img id="item-img" src="" alt="Loading...">
        </div>
        <div class="info-side">
            <span class="category-tag" id="item-cat">IDENTIFYING...</span>
            <h1 id="item-name">---</h1>
            
            <div class="price-binance">
                <span class="price-label">CURRENT MARKET VALUE</span>
                <span class="price-val" id="item-price">0 aUEC</span>
            </div>

            <div class="item-desc" id="item-desc">Accessing UEE Data Network...</div>

            <div class="specs-grid">
                <div class="spec-item">
                    <label>Location</label>
                    <span id="item-loc">---</span>
                </div>
                <div class="spec-item">
                    <label>Network Status</label>
                    <span id="item-status" style="color: var(--success);">ENCRYPTED</span>
                </div>
            </div>

            <button class="action-btn" onclick="openChat()">CONTACT SELLER</button>
        </div>
    </div>

    <div class="market-analysis">
        <div class="chart-header">
            <div class="live-status"><div class="dot"></div> LIVE MARKET TRACKER</div>
            <div style="font-family: var(--font-mono); font-size: 0.6rem; color: #444;">STANTON_V_DATA_LINK</div>
        </div>
        <div class="chart-container">
            <canvas id="marketChart"></canvas>
        </div>
    </div>
</div>

<script>
    const SB_URL = 'https://dfizvgagofsctgwzksgd.supabase.co';
    const SB_KEY = 'sb_publishable_3iByg_zBXp4C-SCtfeIiDw_NeyfB3wR';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    window.onload = () => {
        loadItem();
        checkAuth();
    };

    async function checkAuth() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (session) document.getElementById('chat-btn').style.display = 'flex';
    }

    async function loadItem() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (!id) return;

        const { data, error } = await _supabase.from('marketplace_items').select('*').eq('id', id).single();
        
        if (data) {
            document.getElementById('item-name').innerText = data.item_name.toUpperCase();
            document.getElementById('item-price').innerText = parseInt(data.price_auec).toLocaleString() + " aUEC";
            document.getElementById('item-img').src = data.image_1;
            document.getElementById('item-cat').innerText = (data.category || 'ASSET').toUpperCase();
            document.getElementById('item-loc').innerText = (data.location || 'UNKNOWN').toUpperCase();
            document.getElementById('item-desc').innerText = data.description || 'No additional manifest details available.';
            
            // Generar Gráfico
            initChart(data.price_auec);
        }
    }

    function initChart(price) {
        const ctx = document.getElementById('marketChart').getContext('2d');
        const p = parseInt(price);
        
        // Simulación de fluctuación histórica
        const dataPoints = [p*0.92, p*0.95, p*0.93, p*0.98, p*1.04, p*0.99, p];

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['6D', '5D', '4D', '3D', '2D', '1D', 'NOW'],
                datasets: [{
                    data: dataPoints,
                    borderColor: '#00d2ff',
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.4,
                    fill: true,
                    backgroundColor: (context) => {
                        const gradient = context.chart.ctx.createLinearGradient(0, 0, 0, 250);
                        gradient.addColorStop(0, 'rgba(0, 210, 255, 0.2)');
                        gradient.addColorStop(1, 'rgba(0, 210, 255, 0)');
                        return gradient;
                    }
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false }, ticks: { color: '#444', font: { size: 10 } } },
                    y: { grid: { color: '#1a2635' }, ticks: { color: '#444', font: { size: 10 } } }
                }
            }
        });
    }

    async function openChat() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session) { window.location.href = 'https://www.irathiens.org/login'; return; }

        const params = new URLSearchParams(window.location.search);
        const itemId = params.get('id');

        const { data: itemData } = await _supabase.from('marketplace_items').select('seller_id, item_name').eq('id', itemId).single();

        if (itemData && itemData.seller_id) {
            localStorage.setItem('pending_contact', JSON.stringify({
                id: itemData.seller_id,
                name: "Seller: " + itemData.item_name
            }));
            window.location.href = 'Chats.html';
        } else {
            alert("This item has no seller linked.");
        }
    }
</script>

</body>
</html>
