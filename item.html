<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHOPYSPACE | ASSET DETAILS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --blue-primary: #00d2ff;
            --blue-dark: #0056ff;
            --yellow-accent: #ffb800;
            --yellow-bright: #ffe600;
            --bg-dark: #050a12;
            --bg-card: #0e1621;
            --text-white: #ffffff;
            --grad-blue: linear-gradient(90deg, #00d2ff 0%, #0056ff 100%);
            --grad-yellow: linear-gradient(90deg, #ffb800 0%, #ffe600 100%);
            --success: #00ff88;
        }

        /* Scrollbar Hidden */
        ::-webkit-scrollbar { display: none; }
        
        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: 'Rajdhani', sans-serif;
            background-image: radial-gradient(circle at 50% 0%, #102a4d 0%, var(--bg-dark) 70%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- NAVIGATION --- */
        nav {
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 4px solid;
            border-image: var(--grad-blue) 1;
            padding: 5px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-img {
            height: 55px;
            cursor: pointer;
            filter: drop-shadow(0 0 8px var(--blue-primary));
            transition: 0.3s;
        }

        .back-btn {
            background: var(--grad-blue);
            color: white;
            text-decoration: none;
            font-family: 'Barlow Condensed', sans-serif;
            padding: 8px 15px;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        /* --- CONTENT --- */
        .wrapper { max-width: 1100px; margin: 30px auto; padding: 0 15px; }

        .main-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--bg-card);
            border-radius: 0 30px 0 30px;
            border-left: 5px solid var(--blue-primary);
            border-right: 5px solid var(--yellow-accent);
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .image-container {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            border-bottom: 4px solid var(--blue-primary);
        }

        .image-container img {
            width: 100%;
            border-radius: 10px;
            object-fit: contain;
            max-height: 450px;
        }

        .info-panel { padding: 30px; display: flex; flex-direction: column; }

        .category-tag {
            background: var(--grad-blue);
            padding: 4px 15px;
            font-family: 'Orbitron';
            font-size: 0.65rem;
            clip-path: polygon(0 0, 100% 0, 85% 100%, 0 100%);
            margin-bottom: 10px;
            width: fit-content;
        }

        h1 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 3rem;
            margin: 0;
            line-height: 0.9;
            text-transform: uppercase;
            font-style: italic;
        }

        .price-box {
            font-family: 'Orbitron';
            font-size: 2.2rem;
            color: var(--yellow-bright);
            margin: 15px 0;
        }

        .item-desc {
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 3px solid var(--blue-primary);
            font-size: 0.95rem;
            color: #ccc;
        }

        .specs-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .spec-box { background: #162130; padding: 10px; border-bottom: 2px solid var(--blue-dark); }
        .spec-label { font-size: 0.6rem; color: var(--blue-primary); text-transform: uppercase; font-weight: bold; }
        .spec-val { display: block; font-size: 1rem; font-family: 'Orbitron'; }

        .buy-btn {
            width: 100%;
            background: var(--grad-yellow);
            border: none;
            padding: 18px;
            font-family: 'Barlow Condensed';
            font-size: 1.6rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
            transition: 0.2s;
            margin-top: auto;
        }

        /* --- CHAT SYSTEM (MOBILE PERFECT) --- */
        #chat-window {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 360px;
            height: 500px;
            background: var(--bg-card);
            border: 2px solid var(--blue-primary);
            border-radius: 15px;
            flex-direction: column;
            z-index: 10001;
            box-shadow: 0 0 40px #000;
            overflow: hidden;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .chat-header {
            background: var(--grad-blue);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Orbitron';
            font-size: 0.8rem;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(0,0,0,0.4);
        }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 85%;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .msg-sent { background: var(--blue-dark); align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-received { background: #1a2635; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #333; }
        .msg-info { font-size: 0.6rem; color: var(--yellow-accent); display: block; font-family: 'Orbitron'; margin-bottom: 3px; }

        .chat-input-area {
            padding: 12px;
            background: #050a12;
            display: flex;
            gap: 8px;
            border-top: 1px solid #222;
        }

        .chat-input-area input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid #333;
            color: white;
            padding: 10px;
            border-radius: 6px;
            outline: none;
        }

        .chat-send-btn { background: var(--blue-primary); border: none; padding: 0 15px; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; }

        /* Mobile Viewport Fix */
        @media (max-width: 650px) {
            .main-card { grid-template-columns: 1fr; }
            h1 { font-size: 2.2rem; }
            #chat-window {
                width: 100%;
                height: 100%;
                bottom: 0;
                right: 0;
                border-radius: 0;
                border: none;
            }
            .chat-input-area { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
        }

        footer { text-align: center; padding: 40px; color: #444; font-family: 'Orbitron'; font-size: 0.7rem; }
    </style>
</head>
<body>

<nav>
    <img src="img/Shopy.png" alt="SHOPYSPACE" class="logo-img" onclick="window.location.href='https://irathiens.org/ShopySpace'">
    <a href="https://irathiens.org/ShopySpace" class="back-btn">RETURN TO MARKET</a>
</nav>

<div class="wrapper">
    <div class="main-card">
        <div class="image-container">
            <img id="item-img" src="" alt="Loading asset...">
        </div>

        <div class="info-panel">
            <span class="category-tag" id="item-cat">LOADING...</span>
            <h1 id="item-name">ASSET NAME</h1>
            <div class="price-box" id="item-price">0 aUEC</div>
            
            <div class="item-desc" id="item-desc">Establishing secure link to UEE manifest...</div>

            <div class="specs-list">
                <div class="spec-box">
                    <span class="spec-label">Location</span>
                    <span class="spec-val" id="item-loc">---</span>
                </div>
                <div class="spec-box">
                    <span class="spec-label">Status</span>
                    <span class="spec-val" id="item-status" style="color: var(--success);">STABLE</span>
                </div>
            </div>

            <button class="buy-btn" onclick="openChat()">CONTACT SELLER</button>
        </div>
    </div>
</div>

<div id="chat-window">
    <div class="chat-header">
        <span>ENCRYPTED COMMS</span>
        <div style="display:flex; gap:15px; align-items:center;">
            <span style="color:red; font-size:0.7rem; cursor:pointer;" onclick="closeChat()">BLOCK</span>
            <span style="cursor:pointer; font-size:1.2rem;" onclick="closeChat()">×</span>
        </div>
    </div>
    <div class="chat-messages" id="chat-box"></div>
    <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Type message..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button class="chat-send-btn" onclick="sendMessage()">SEND</button>
    </div>
</div>

<footer>
    SHOPYSPACE NETWORK &copy; 2956 | STANTON HUB
</footer>

<script>
    const SB_URL = 'https://dfizvgagofsctgwzksgd.supabase.co';
    const SB_KEY = 'sb_publishable_3iByg_zBXp4C-SCtfeIiDw_NeyfB3wR';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    // Identidad del usuario
    let myId = localStorage.getItem('chat_uid') || 'U-' + Math.floor(Math.random()*9000);
    let myName = localStorage.getItem('chat_uname') || 'Citizen_' + Math.floor(Math.random()*999);
    localStorage.setItem('chat_uid', myId);
    localStorage.setItem('chat_uname', myName);

    async function loadItem() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (!id) return;

        const { data } = await _supabase.from('marketplace_items').select('*').eq('id', id).single();
        if (data) {
            document.getElementById('item-name').innerText = data.item_name.toUpperCase();
            document.getElementById('item-price').innerText = parseInt(data.price_auec).toLocaleString() + " aUEC";
            document.getElementById('item-img').src = data.image_1 || '';
            document.getElementById('item-cat').innerText = (data.category || 'ASSET').toUpperCase();
            document.getElementById('item-loc').innerText = (data.location || 'UNKNOWN').toUpperCase();
            document.getElementById('item-desc').innerText = data.description || 'No additional data.';
        }
    }

    // --- CHAT FUNCTIONS ---
    function openChat() {
        const win = document.getElementById('chat-window');
        win.style.display = 'flex';
        if (window.innerWidth < 650) document.body.style.overflow = 'hidden';
        
        loadMessages();
        
        // Suscribirse a mensajes nuevos
        _supabase.channel('public:mensajes').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensajes' }, payload => {
            appendMessage(payload.new);
        }).subscribe();
    }

    function closeChat() {
        document.getElementById('chat-window').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    async function loadMessages() {
        const { data } = await _supabase.from('mensajes').select('*').order('created_at', { ascending: true }).limit(40);
        const box = document.getElementById('chat-box');
        box.innerHTML = '';
        if (data) data.forEach(msg => appendMessage(msg));
    }

    function appendMessage(msg) {
        const box = document.getElementById('chat-box');
        const isMe = msg.user_id === myId;
        const div = document.createElement('div');
        div.className = `msg-bubble ${isMe ? 'msg-sent' : 'msg-received'}`;
        div.innerHTML = `<span class="msg-info">${msg.user_name}</span>${msg.content}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;

        const { error } = await _supabase.from('mensajes').insert([{
            user_id: myId,
            user_name: myName,
            content: text
        }]);

        if (!error) input.value = '';
    }

    window.onload = loadItem;
</script>

</body>
</html>
