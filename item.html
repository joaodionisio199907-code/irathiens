<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHOPYSPACE | ASSET DETAILS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --blue-primary: #00d2ff;
            --blue-dark: #0056ff;
            --yellow-accent: #ffb800;
            --yellow-bright: #ffe600;
            --bg-dark: #050a12;
            --bg-card: #0e1621;
            --text-white: #ffffff;
            --grad-blue: linear-gradient(90deg, #00d2ff 0%, #0056ff 100%);
            --grad-yellow: linear-gradient(90deg, #ffb800 0%, #ffe600 100%);
            --success: #00ff88;
            --font-impact: 'Barlow Condensed', sans-serif;
        }

        ::-webkit-scrollbar { display: none; }
        
        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: 'Rajdhani', sans-serif;
            background-image: radial-gradient(circle at 50% 0%, #102a4d 0%, var(--bg-dark) 70%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- NAVIGATION --- */
        nav {
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 4px solid;
            border-image: var(--grad-blue) 1;
            padding: 5px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 70px;
            box-sizing: border-box;
        }

        .logo-img {
            height: 45px;
            cursor: pointer;
            filter: drop-shadow(0 0 8px var(--blue-primary));
            transition: 0.3s;
        }

        .nav-right { display: flex; align-items: center; gap: 15px; }

        .back-btn {
            background: rgba(255,255,255,0.05);
            color: white;
            text-decoration: none;
            font-family: var(--font-impact);
            padding: 8px 15px;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.9rem;
            border: 1px solid rgba(0, 210, 255, 0.3);
        }

        /* BOTÓN DE CHATS */
        #chat-btn {
            display: none; 
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid var(--blue-primary);
            color: var(--blue-primary);
            padding: 6px 12px;
            border-radius: 4px;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            font-family: var(--font-impact);
            font-size: 0.85rem;
            transition: 0.3s;
            position: relative;
            font-style: italic;
        }
        .chat-icon { width: 16px; height: 16px; fill: currentColor; }
        #chat-btn::after {
            content: ''; position: absolute; top: 4px; right: 4px;
            width: 5px; height: 5px; background: var(--yellow-bright);
            border-radius: 50%; box-shadow: 0 0 8px var(--yellow-bright);
        }

        /* --- CONTENT --- */
        .wrapper { max-width: 1100px; margin: 30px auto; padding: 0 15px; }

        .main-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--bg-card);
            border-radius: 0 30px 0 30px;
            border-left: 5px solid var(--blue-primary);
            border-right: 5px solid var(--yellow-accent);
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .image-container {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            border-bottom: 4px solid var(--blue-primary);
        }

        .image-container img {
            width: 100%;
            border-radius: 10px;
            object-fit: contain;
            max-height: 450px;
        }

        .info-panel { padding: 30px; display: flex; flex-direction: column; }

        .category-tag {
            background: var(--grad-blue);
            padding: 4px 15px;
            font-family: 'Orbitron';
            font-size: 0.65rem;
            clip-path: polygon(0 0, 100% 0, 85% 100%, 0 100%);
            margin-bottom: 10px;
            width: fit-content;
        }

        h1 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 3rem;
            margin: 0;
            line-height: 0.9;
            text-transform: uppercase;
            font-style: italic;
        }

        .price-box {
            font-family: 'Orbitron';
            font-size: 2.2rem;
            color: var(--yellow-bright);
            margin: 15px 0;
        }

        .item-desc {
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 3px solid var(--blue-primary);
            font-size: 0.95rem;
            color: #ccc;
        }

        .specs-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .spec-box { background: #162130; padding: 10px; border-bottom: 2px solid var(--blue-dark); }
        .spec-label { font-size: 0.6rem; color: var(--blue-primary); text-transform: uppercase; font-weight: bold; }
        .spec-val { display: block; font-size: 1rem; font-family: 'Orbitron'; }

        .buy-btn {
            width: 100%;
            background: var(--grad-yellow);
            border: none;
            padding: 18px;
            font-family: 'Barlow Condensed';
            font-size: 1.6rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
            transition: 0.2s;
            margin-top: auto;
        }

        /* Mobile specific fixes */
        @media (max-width: 650px) {
            .main-card { grid-template-columns: 1fr; }
            h1 { font-size: 2.2rem; }
            #chat-btn span { display: none; }
            .info-panel { padding: 20px; }
        }

        footer { text-align: center; padding: 40px; color: #444; font-family: 'Orbitron'; font-size: 0.7rem; }
    </style>
</head>
<body>

<nav>
    <img src="img/Shopy.png" alt="SHOPYSPACE" class="logo-img" onclick="window.location.href='https://irathiens.org/ShopySpace'">
    
    <div class="nav-right">
        <a href="Chats.html" id="chat-btn">
            <svg class="chat-icon" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
            <span>CHATS</span>
        </a>
        <a href="https://irathiens.org/ShopySpace" class="back-btn">RETURN TO MARKET</a>
    </div>
</nav>

<div class="wrapper">
    <div class="main-card">
        <div class="image-container">
            <img id="item-img" src="" alt="Loading asset...">
        </div>

        <div class="info-panel">
            <span class="category-tag" id="item-cat">LOADING...</span>
            <h1 id="item-name">ASSET NAME</h1>
            <div class="price-box" id="item-price">0 aUEC</div>
            
            <div class="item-desc" id="item-desc">Establishing secure link to UEE manifest...</div>

            <div class="specs-list">
                <div class="spec-box">
                    <span class="spec-label">Location</span>
                    <span class="spec-val" id="item-loc">---</span>
                </div>
                <div class="spec-box">
                    <span class="spec-label">Status</span>
                    <span class="spec-val" id="item-status" style="color: var(--success);">STABLE</span>
                </div>
            </div>

            <button class="buy-btn" onclick="openChat()">CONTACT SELLER</button>
        </div>
    </div>
</div>

<footer>
    SHOPYSPACE NETWORK &copy; 2956 | STANTON HUB
</footer>

<script>
    const SB_URL = 'https://dfizvgagofsctgwzksgd.supabase.co';
    const SB_KEY = 'sb_publishable_3iByg_zBXp4C-SCtfeIiDw_NeyfB3wR';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    async function checkAuth() {
        const { data: { session } } = await _supabase.auth.getSession();
        const chatBtn = document.getElementById('chat-btn');
        if (session) {
            chatBtn.style.display = 'flex';
        } else {
            chatBtn.style.display = 'none';
        }
    }

    async function loadItem() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (!id) return;

        const { data } = await _supabase.from('marketplace_items').select('*').eq('id', id).single();
        if (data) {
            document.getElementById('item-name').innerText = data.item_name.toUpperCase();
            document.getElementById('item-price').innerText = parseInt(data.price_auec).toLocaleString() + " aUEC";
            document.getElementById('item-img').src = data.image_1 || '';
            document.getElementById('item-cat').innerText = (data.category || 'ASSET').toUpperCase();
            document.getElementById('item-loc').innerText = (data.location || 'UNKNOWN').toUpperCase();
            document.getElementById('item-desc').innerText = data.description || 'No additional data.';
        }
    }

    // MODIFICADO: Prepara el contacto y redirige a la página completa de Chats
    async function openChat() {
        const { data: { session } } = await _supabase.auth.getSession();
        
        if (!session) {
            window.location.href = 'login.html'; 
            return;
        }

        const params = new URLSearchParams(window.location.search);
        const itemId = params.get('id');

        // Buscamos quién es el vendedor de este ítem
        const { data: itemData } = await _supabase
            .from('marketplace_items')
            .select('user_id, seller_name') 
            .eq('id', itemId)
            .single();

        if (itemData && itemData.user_id) {
            // Guardamos la intención de contactar para que Chats.html la recoja
            const pendingContact = {
                id: itemData.user_id,
                name: itemData.seller_name || 'Seller'
            };
            localStorage.setItem('pending_contact', JSON.stringify(pendingContact));
            
            // Redirigimos a la página de chats
            window.location.href = 'Chats.html';
        } else {
            alert("Unable to find seller ID for this asset.");
        }
    }

    window.onload = () => {
        loadItem();
        checkAuth();
    };
</script>
</body>
</html>
