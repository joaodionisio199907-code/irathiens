<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHOPYSPACE | CHATS </title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&family=Barlow+Condensed:wght@700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --blue-light: #00d2ff;
            --blue-dark: #0056ff;
            --yellow-accent: #ffb800;
            --bg-deep: #050a12;
            --bg-card: #0e1621;
            --text-white: #ffffff;
            --font-main: 'Rajdhani', sans-serif;
            --font-logo: 'Orbitron', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        ::-webkit-scrollbar { display: none; }
        
        body { 
            margin: 0; background-color: var(--bg-deep); color: var(--text-white);
            font-family: var(--font-main); height: 100vh; display: flex; flex-direction: column;
            background-image: radial-gradient(circle at 50% 100%, #102a4d 0%, var(--bg-deep) 100%);
        }

        /* --- HEADER --- */
        header {
            background: rgba(0, 0, 0, 0.9); border-bottom: 2px solid var(--blue-light);
            padding: 0 20px; display: flex; justify-content: space-between; align-items: center;
            height: 70px; flex-shrink: 0;
        }

        .logo-section { display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .logo-img { max-height: 40px; filter: drop-shadow(0 0 5px var(--blue-light)); }
        .hub-title { font-family: var(--font-logo); font-size: 1rem; letter-spacing: 2px; color: var(--blue-light); }

        .back-link { 
            color: var(--yellow-accent); text-decoration: none; font-family: 'Barlow Condensed'; 
            font-weight: 800; text-transform: uppercase; font-style: italic; border: 1px solid var(--yellow-accent);
            padding: 5px 15px; transition: 0.3s;
        }
        .back-link:hover { background: var(--yellow-accent); color: #000; }

        /* --- MAIN LAYOUT --- */
        .comms-container {
            flex: 1; display: flex; overflow: hidden; max-width: 1200px; margin: 0 auto; width: 100%;
        }

        /* Lado Izquierdo: Lista de Contactos (Opcional para futuro, ahora historial) */
        .contacts-panel {
            width: 300px; border-right: 1px solid #1a2635; background: rgba(0,0,0,0.3);
            display: flex; flex-direction: column;
        }

        .panel-header { padding: 20px; font-family: var(--font-logo); font-size: 0.7rem; color: #55667a; border-bottom: 1px solid #1a2635; }

        /* Area de Mensajes Principal */
        .chat-main { flex: 1; display: flex; flex-direction: column; background: rgba(14, 22, 33, 0.7); }

        .messages-display {
            flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px;
            scroll-behavior: smooth;
        }

        /* --- BURBUJAS DE MENSAJE --- */
        .msg-row { display: flex; flex-direction: column; max-width: 80%; }
        .msg-row.me { align-self: flex-end; align-items: flex-end; }
        .msg-row.them { align-self: flex-start; align-items: flex-start; }

        .msg-user { font-family: var(--font-mono); font-size: 0.65rem; color: var(--blue-light); margin-bottom: 4px; }
        .msg-content { 
            padding: 12px 18px; border-radius: 4px; font-size: 0.95rem; line-height: 1.4;
            position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .me .msg-content { background: var(--blue-dark); color: white; border-right: 3px solid var(--blue-light); }
        .them .msg-content { background: #1a2635; color: #ccc; border-left: 3px solid var(--yellow-accent); }

        .msg-time { font-size: 0.6rem; color: #445566; margin-top: 4px; }

        /* --- INPUT AREA --- */
        .input-bar {
            padding: 20px; background: #050a12; border-top: 1px solid #1a2635;
            display: flex; gap: 10px; align-items: center;
        }

        .input-bar input {
            flex: 1; background: #0e1621; border: 1px solid #1a2635; padding: 15px;
            color: white; border-radius: 5px; outline: none; font-family: var(--font-main);
            transition: 0.3s;
        }
        .input-bar input:focus { border-color: var(--blue-light); box-shadow: 0 0 10px rgba(0,210,255,0.2); }

        .send-btn {
            background: var(--blue-light); border: none; width: 50px; height: 50px;
            border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }
        .send-btn:hover { transform: scale(1.05); background: var(--text-white); }
        .send-btn svg { width: 24px; height: 24px; fill: #050a12; }

        /* --- MOBILE --- */
        @media (max-width: 768px) {
            .contacts-panel { display: none; }
            .msg-row { max-width: 90%; }
            .input-bar { padding: 10px; padding-bottom: 30px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo-section" onclick="window.location.href='index.html'">
        <img src="img/Shopy.png" alt="Logo" class="logo-img">
        <span class="hub-title">COMMS HUB</span>
    </div>
    <a href="index.html" class="back-link">EXIT TERMINAL</a>
</header>

<div class="comms-container">
    <aside class="contacts-panel">
        <div class="panel-header">ACTIVE CHANNELS</div>
        <div style="padding: 20px; color: var(--blue-light); font-size: 0.8rem; font-family: var(--font-mono);">
            > BROADCAST CHANNEL #GENERAL<br>
            > STATUS: ENCRYPTED<br>
            > LOCATION: STANTON_SYSTEM
        </div>
    </aside>

    <main class="chat-main">
        <div class="messages-display" id="chat-flow">
            </div>

        <div class="input-bar">
            <input type="text" id="msg-input" placeholder="Transmit encrypted message..." onkeypress="if(event.key==='Enter') pushMessage()">
            <button class="send-btn" onclick="pushMessage()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </main>
</div>

<script>
    // Configuración Supabase (Mismas credenciales)
    const SB_URL = 'https://dfizvgagofsctgwzksgd.supabase.co';
    const SB_KEY = 'sb_publishable_3iByg_zBXp4C-SCtfeIiDw_NeyfB3wR';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    // Identidad del usuario (Mismo que en la otra página)
    const myId = localStorage.getItem('chat_uid') || 'U-' + Math.floor(Math.random()*9000);
    const myName = localStorage.getItem('chat_uname') || 'Citizen_' + Math.floor(Math.random()*999);
    
    // Guardar por si acaso es la primera vez que entra aquí
    localStorage.setItem('chat_uid', myId);
    localStorage.setItem('chat_uname', myName);

    window.onload = () => {
        fetchMessages();
        subscribeToChannel();
    };

    async function fetchMessages() {
        const { data, error } = await _supabase
            .from('mensajes')
            .select('*')
            .order('created_at', { ascending: true })
            .limit(50);

        if (data) {
            const flow = document.getElementById('chat-flow');
            flow.innerHTML = '';
            data.forEach(m => renderMessage(m));
            scrollBottom();
        }
    }

    function subscribeToChannel() {
        _supabase
            .channel('public:mensajes')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensajes' }, payload => {
                renderMessage(payload.new);
                scrollBottom();
            })
            .subscribe();
    }

    function renderMessage(msg) {
        const flow = document.getElementById('chat-flow');
        const isMe = msg.user_id === myId;
        
        const div = document.createElement('div');
        div.className = `msg-row ${isMe ? 'me' : 'them'}`;
        
        const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        div.innerHTML = `
            <span class="msg-user">${isMe ? 'YOU' : msg.user_name}</span>
            <div class="msg-content">${msg.content}</div>
            <span class="msg-time">${time}</span>
        `;
        
        flow.appendChild(div);
    }

    async function pushMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text) return;

        const { error } = await _supabase.from('mensajes').insert([{
            user_id: myId,
            user_name: myName,
            content: text
        }]);

        if (!error) {
            input.value = '';
        }
    }

    function scrollBottom() {
        const flow = document.getElementById('chat-flow');
        flow.scrollTop = flow.scrollHeight;
    }
</script>

</body>
</html>
