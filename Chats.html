<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHOPYSPACE | ENCRYPTED COMMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --blue-primary: #00d2ff;
            --blue-dark: #0056ff;
            --yellow-accent: #ffb800;
            --bg-deep: #050a12;
            --bg-card: #0e1621;
            --text-white: #ffffff;
            --border-color: #1a2635;
            --grad-blue: linear-gradient(90deg, #00d2ff 0%, #0056ff 100%);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: var(--blue-primary); }

        body {
            margin: 0; background-color: var(--bg-deep); color: var(--text-white);
            font-family: 'Rajdhani', sans-serif; height: 100dvh; display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* --- NAV --- */
        nav {
            background: #000; border-bottom: 2px solid var(--blue-primary);
            padding: 5px 15px; display: flex; justify-content: space-between; align-items: center;
            height: 55px; z-index: 1001;
        }
        .logo-img { height: 25px; filter: drop-shadow(0 0 5px var(--blue-primary)); cursor: pointer; }
        
        .id-badge { 
            background: rgba(0, 210, 255, 0.1); border: 1px solid var(--blue-primary);
            padding: 4px 8px; border-radius: 4px; font-family: 'Orbitron'; font-size: 0.55rem;
            color: var(--blue-primary); cursor: pointer; display: flex; align-items: center; gap: 5px;
        }

        /* --- LAYOUT --- */
        .chat-container { display: flex; flex: 1; overflow: hidden; position: relative; }

        /* --- SIDEBAR --- */
        .sidebar { 
            width: 300px; background: var(--bg-card); border-right: 1px solid var(--border-color); 
            display: flex; flex-direction: column; transition: all 0.3s ease;
        }

        .sidebar-header { padding: 15px; }
        .sidebar-label { font-family: 'Orbitron'; font-size: 0.6rem; color: #444; margin: 15px 0 8px; display: block; letter-spacing: 2px; }
        
        .add-friend-btn { 
            width: 100%; background: var(--grad-blue); color: white; border: none; padding: 12px;
            font-family: 'Orbitron'; font-size: 0.7rem; cursor: pointer; font-weight: bold;
            clip-path: polygon(4% 0, 100% 0, 96% 100%, 0 100%);
        }

        .contact-list { flex: 1; overflow-y: auto; }
        .contact-item { 
            padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.03); 
            cursor: pointer; position: relative;
        }
        .contact-item.active { background: rgba(0, 210, 255, 0.08); border-left: 3px solid var(--blue-primary); }
        .contact-name { display: block; font-family: 'Orbitron'; font-size: 0.75rem; color: var(--blue-primary); }
        .contact-status { font-size: 0.6rem; color: #555; }

        /* --- CHAT AREA --- */
        .chat-main { 
            flex: 1; display: flex; flex-direction: column; 
            background: radial-gradient(circle at center, #0e1621 0%, #050a12 100%);
            position: relative;
        }

        .chat-top-bar { 
            padding: 10px 15px; background: rgba(0,0,0,0.8); border-bottom: 1px solid var(--border-color); 
            display: flex; align-items: center; gap: 10px;
        }
        .back-btn { display: none; background: none; border: 1px solid var(--blue-primary); color: var(--blue-primary); padding: 4px 8px; border-radius: 4px; font-family: 'Orbitron'; cursor: pointer; }

        .messages-area { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { max-width: 85%; padding: 10px 12px; border-radius: 10px; font-size: 0.9rem; line-height: 1.3; }
        .msg.sent { align-self: flex-end; background: var(--blue-dark); color: white; border-bottom-right-radius: 2px; }
        .msg.received { align-self: flex-start; background: #1a2635; border: 1px solid #222; border-bottom-left-radius: 2px; }
        .msg-info { font-size: 0.5rem; color: var(--yellow-accent); margin-bottom: 4px; font-family: 'Orbitron'; display: block; opacity: 0.8; }

        /* --- INPUT --- */
        .input-container { padding: 10px; background: var(--bg-card); border-top: 1px solid var(--border-color); }
        .input-wrapper { display: flex; gap: 6px; background: #000; border: 1px solid #333; padding: 4px; border-radius: 8px; align-items: center; }
        .input-wrapper input { flex: 1; background: transparent; border: none; color: white; padding: 10px; outline: none; font-size: 0.9rem; }
        .send-btn { background: var(--grad-blue); border: none; padding: 10px 18px; color: white; font-family: 'Orbitron'; font-size: 0.7rem; border-radius: 6px; font-weight: bold; }

        /* --- MOBILE ADAPTATION --- */
        @media (max-width: 768px) {
            .sidebar { 
                position: absolute; width: 100%; height: 100%; z-index: 1000;
                left: 0;
            }
            .sidebar.hidden { left: -100%; }
            .back-btn { display: block; }
            .msg { max-width: 90%; }
        }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; padding: 15px; }
        .modal-content { background: var(--bg-card); width: 100%; max-width: 400px; border: 1px solid var(--blue-primary); border-radius: 8px; }
        .modal-header { background: var(--grad-blue); padding: 12px; font-family: 'Orbitron'; font-size: 0.7rem; display: flex; justify-content: space-between; }
        .modal-body { padding: 20px; }
        .modal-input { width: 100%; background: #000; border: 1px solid #333; padding: 12px; color: white; margin-bottom: 10px; border-radius: 4px; }
    </style>
</head>
<body>

<nav>
    <img src="img/Shopy.png" class="logo-img" onclick="window.location.href='https://irathiens.org/ShopySpace'">
    <div id="copy-my-id" class="id-badge" onclick="copyMyID()">
        <span id="my-name-display">...</span>
        <span style="opacity:0.5; font-size: 0.4rem;">[COPY ID]</span>
    </div>
</nav>

<div class="chat-container">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-label">NETWORK BROADCAST</span>
            <div class="contact-item active" id="global-item" onclick="selectContact('Global Hub', null, this)">
                <span class="contact-name"># BROADCAST_HUB</span>
                <span class="contact-status">Public Unencrypted Frequency</span>
            </div>
            <span class="sidebar-label">PRIVATE ENCRYPTED LINKS</span>
            <button class="add-friend-btn" onclick="openModal()">+ LINK NEW CITIZEN</button>
        </div>
        <div class="contact-list" id="contact-list"></div>
    </aside>

    <main class="chat-main">
        <div class="chat-top-bar">
            <button class="back-btn" onclick="showSidebar()"> < </button>
            <span id="current-chat-name" style="font-family: 'Orbitron'; color: var(--blue-primary); font-size: 0.8rem;">GLOBAL HUB</span>
        </div>
        <div class="messages-area" id="messages-area"></div>
        <div class="input-container">
            <div class="input-wrapper">
                <input type="text" id="chat-input" placeholder="Enter secure message..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="send-btn" onclick="sendMessage()">SEND</button>
            </div>
        </div>
    </main>
</div>

<div id="modal-add" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header"><span>ESTABLISH LINK</span><span onclick="closeModal()" style="cursor:pointer">X</span></div>
        <div class="modal-body">
            <input type="text" id="friend-uuid" class="modal-input" placeholder="Paste Citizen UUID...">
            <input type="text" id="friend-name" class="modal-input" placeholder="Enter Call-sign...">
            <button class="add-friend-btn" onclick="confirmAddFriend()">SYNC CHANNEL</button>
        </div>
    </div>
</div>

<script>
    const SB_URL = 'https://dfizvgagofsctgwzksgd.supabase.co';
    const SB_KEY = 'sb_publishable_3iByg_zBXp4C-SCtfeIiDw_NeyfB3wR';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let myId, myName, currentTarget = 'Global Hub', targetUserId = null;

    async function init() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session) { window.location.href = 'login.html'; return; }

        myId = session.user.id;
        myName = session.user.user_metadata.full_name || session.user.email.split('@')[0];
        document.getElementById('my-name-display').innerText = myName.toUpperCase();
        
        loadSavedContacts();

        // LÓGICA DE PERSISTENCIA AL VENIR DESDE PRODUCTO
        const pending = localStorage.getItem('pending_contact');
        if (pending) {
            const contact = JSON.parse(pending);
            autoCreateContact(contact.name, contact.id);
            const el = document.getElementById(`contact-${contact.id}`);
            selectContact(contact.name, contact.id, el);
            localStorage.removeItem('pending_contact');
        } else {
            loadMessages();
        }

        _supabase.channel('main_room')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensajes' }, payload => {
                const m = payload.new;
                if (m.channel === currentTarget) appendMessage(m);
                else if (m.receiver_id === myId) {
                    autoCreateContact(m.user_name, m.user_id);
                }
            }).subscribe();
    }

    function copyMyID() {
        navigator.clipboard.writeText(myId);
        alert("ID COPIED: " + myId);
    }

    function getChannelID(id1, id2) {
        return [id1, id2].sort().join("--");
    }

    function loadSavedContacts() {
        const saved = localStorage.getItem('shopy_contacts_' + myId);
        if (saved) {
            const contacts = JSON.parse(saved);
            contacts.forEach(c => renderContactUI(c.name, c.id));
        }
    }

    function saveContact(name, id) {
        let contacts = JSON.parse(localStorage.getItem('shopy_contacts_' + myId) || '[]');
        if (!contacts.find(c => c.id === id)) {
            contacts.push({ name, id });
            localStorage.setItem('shopy_contacts_' + myId, JSON.stringify(contacts));
        }
    }

    function renderContactUI(name, id) {
        const list = document.getElementById('contact-list');
        if (!document.getElementById(`contact-${id}`)) {
            const div = document.createElement('div');
            div.className = 'contact-item';
            div.id = `contact-${id}`;
            div.onclick = () => selectContact(name, id, div);
            div.innerHTML = `<span class="contact-name">${name}</span><span class="contact-status">● P2P ENCRYPTED</span>`;
            list.prepend(div);
        }
    }

    function autoCreateContact(name, id) {
        if (id === myId) return;
        renderContactUI(name, id);
        saveContact(name, id);
    }

    function selectContact(name, id, el) {
        currentTarget = id ? getChannelID(myId, id) : 'Global Hub';
        targetUserId = id;
        document.getElementById('current-chat-name').innerText = name.toUpperCase();
        document.querySelectorAll('.contact-item').forEach(i => i.classList.remove('active'));
        if (el) el.classList.add('active');
        if (window.innerWidth <= 768) document.getElementById('sidebar').classList.add('hidden');
        loadMessages();
    }

    function showSidebar() { document.getElementById('sidebar').classList.remove('hidden'); }

    async function loadMessages() {
        const box = document.getElementById('messages-area');
        box.innerHTML = '';
        let query = _supabase.from('mensajes').select('*').eq('channel', currentTarget);
        if (targetUserId) query = query.or(`user_id.eq.${myId},receiver_id.eq.${myId}`);
        const { data } = await query.order('created_at', { ascending: true });
        if (data) data.forEach(m => appendMessage(m));
    }

    function appendMessage(m) {
        const box = document.getElementById('messages-area');
        const isMe = m.user_id === myId;
        const div = document.createElement('div');
        div.className = `msg ${isMe ? 'sent' : 'received'}`;
        div.innerHTML = `<span class="msg-info">${m.user_name}</span>${m.content}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;
        const { error } = await _supabase.from('mensajes').insert([{
            user_id: myId, user_name: myName, content: text, 
            channel: currentTarget, receiver_id: targetUserId
        }]);
        if (!error) input.value = '';
    }

    function openModal() { document.getElementById('modal-add').style.display = 'flex'; }
    function closeModal() { document.getElementById('modal-add').style.display = 'none'; }
    function confirmAddFriend() {
        const id = document.getElementById('friend-uuid').value.trim();
        const name = document.getElementById('friend-name').value.trim();
        if (id && name) { autoCreateContact(name, id); closeModal(); }
    }

    init();
</script>
</body>
</html>
