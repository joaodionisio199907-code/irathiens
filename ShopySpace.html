<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCS CORP | MARKET & COMMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&family=JetBrains+Mono:wght@300&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0a0c0f;
            --bg-card: #14181d;
            --accent: #c49a5c;
            --accent-dim: rgba(196, 154, 92, 0.2);
            --ui-blue: #00f2ff;
            --text-main: #e0e0e0;
            --font-hud: 'Orbitron', sans-serif;
        }

        body { margin: 0; background-color: var(--bg-dark); color: var(--text-main); font-family: 'Rajdhani', sans-serif; }

        /* --- NAVEGACIÓN --- */
        nav { background: #000; border-bottom: 2px solid var(--accent); padding: 10px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .nav-links a { color: #fff; text-decoration: none; font-family: var(--font-hud); font-size: 0.7rem; margin-left: 20px; cursor: pointer; opacity: 0.7; }
        .nav-links a.active { color: var(--accent); opacity: 1; }

        .marketplace-wrapper { display: grid; grid-template-columns: 260px 1fr; gap: 20px; max-width: 1600px; margin: 20px auto; padding: 0 20px; }

        /* --- SIDEBAR & GRID --- */
        .sidebar { background: var(--bg-card); border: 1px solid var(--accent-dim); padding: 20px; height: calc(100vh - 120px); position: sticky; top: 80px; }
        .category-title { font-family: var(--font-hud); font-size: 0.75rem; color: var(--accent); margin-bottom: 15px; border-bottom: 1px solid var(--accent-dim); padding-bottom: 5px; }
        .cat-item { display: block; padding: 8px 0; color: #aaa; text-decoration: none; cursor: pointer; }
        .cat-item:hover, .cat-item.active { color: var(--accent); }

        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .item-card { background: var(--bg-card); border: 1px solid #2a2f35; cursor: pointer; transition: 0.3s; }
        .item-card:hover { border-color: var(--accent); transform: translateY(-3px); }
        .item-card img { width: 100%; height: 160px; object-fit: cover; }
        .item-card-info { padding: 12px; }
        .item-card h3 { font-family: var(--font-hud); font-size: 0.75rem; color: var(--accent); margin: 0; }
        .price { color: var(--ui-blue); font-family: 'JetBrains Mono'; font-weight: bold; }

        /* --- CHAT SYSTEM (Overlay) --- */
        .chat-overlay {
            position: fixed; bottom: 20px; right: 20px; width: 350px; height: 450px;
            background: var(--bg-dark); border: 1px solid var(--accent);
            display: none; flex-direction: column; z-index: 3000; box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .chat-header { background: var(--accent); color: black; padding: 10px; font-family: var(--font-hud); font-size: 0.7rem; display: flex; justify-content: space-between; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; font-size: 0.9rem; }
        .msg { padding: 8px 12px; border-radius: 4px; max-width: 80%; word-wrap: break-word; }
        .msg.me { background: var(--accent-dim); align-self: flex-end; border-right: 3px solid var(--accent); }
        .msg.them { background: #1a1f26; align-self: flex-start; border-left: 3px solid var(--ui-blue); }
        .chat-input-area { padding: 10px; border-top: 1px solid #333; display: flex; gap: 5px; }
        .chat-input { flex: 1; background: #000; border: 1px solid #444; color: white; padding: 8px; outline: none; }

        /* --- MODAL DETALLES --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .details-box { background: var(--bg-dark); border: 1px solid var(--accent); width: 90%; max-width: 800px; display: grid; grid-template-columns: 1fr 1fr; }
        .details-content { padding: 30px; }

        .tag-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 10px; cursor: pointer; font-family: var(--font-hud); font-size: 0.7rem; }
        .tag-btn:hover { background: var(--accent); color: black; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

<nav>
    <div style="font-family: var(--font-hud); color: var(--accent);">UCS_MARKET_TERMINAL</div>
    <div class="nav-links">
        <a onclick="showTab('market')" id="link-market" class="active">MARKETPLACE</a>
        <a onclick="showTab('sell')" id="link-sell">VENDER</a>
    </div>
</nav>

<div class="marketplace-wrapper">
    <aside class="sidebar">
        <div class="category-title">MANIFIESTO</div>
        <a class="cat-item active" onclick="fetchMarket()">Todos los Items</a>
        <a class="cat-item" onclick="filterCat('Armor')">Armaduras</a>
        <a class="cat-item" onclick="filterCat('Weapons')">Armas</a>
        <a class="cat-item" onclick="filterCat('Ships')">Naves</a>
    </aside>

    <main>
        <section id="market" class="tab-content active">
            <div id="market-grid" class="market-grid"></div>
        </section>
        <section id="sell" class="tab-content">
            <p>Panel de publicación activo...</p>
        </section>
    </main>
</div>

<div class="modal-overlay" id="modal">
    <div class="details-box">
        <div class="details-img"><img id="m-img" style="width:100%;"></div>
        <div class="details-content">
            <h2 id="m-title" style="color:var(--accent); font-family:var(--font-hud);"></h2>
            <div id="m-price" style="color:var(--ui-blue); font-size:1.5rem; margin-bottom:20px;"></div>
            <p>Inicie una línea de comunicación segura con el vendedor para finalizar la transferencia de aUEC.</p>
            <button class="tag-btn" style="width:100%; border-color:var(--ui-blue); color:var(--ui-blue);" id="btn-contact">CONTACTAR VENDEDOR</button>
            <button class="tag-btn" style="width:100%; margin-top:10px;" onclick="closeM()">CERRAR</button>
        </div>
    </div>
</div>

<div class="chat-overlay" id="chat-panel">
    <div class="chat-header">
        <span>SPECTRUM_COMMS_v4</span>
        <span onclick="closeChat()" style="cursor:pointer;">[X]</span>
    </div>
    <div class="chat-messages" id="chat-msgs"></div>
    <div class="chat-input-area">
        <input type="text" id="chat-input" class="chat-input" placeholder="Enviar mensaje...">
        <button class="tag-btn" onclick="sendMsg()">ENVIAR</button>
    </div>
</div>

<script>
    const SB_URL = 'https://dfizvgagofsctgwzksgd.supabase.co';
    const SB_KEY = 'sb_publishable_3iByg_zBXp4C-SCtfeIiDw_NeyfB3wR';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let currentItem = null;
    let currentUser = null;

    window.onload = async () => {
        const { data: { session } } = await _supabase.auth.getSession();
        currentUser = session?.user;
        fetchMarket();
    };

    async function fetchMarket() {
        const { data } = await _supabase.from('marketplace_items').select('*').order('created_at', {ascending: false});
        renderGrid(data);
    }

    function renderGrid(data) {
        const grid = document.getElementById('market-grid');
        grid.innerHTML = "";
        data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'item-card';
            div.onclick = () => openDetails(item);
            div.innerHTML = `<img src="${item.image_1}"><div class="item-card-info"><h3>${item.item_name}</h3><div class="price">${item.price_auec} aUEC</div></div>`;
            grid.appendChild(div);
        });
    }

    function openDetails(item) {
        currentItem = item;
        document.getElementById('m-title').innerText = item.item_name;
        document.getElementById('m-price').innerText = item.price_auec + " aUEC";
        document.getElementById('m-img').src = item.image_1;
        document.getElementById('modal').style.display = 'flex';
        
        document.getElementById('btn-contact').onclick = () => initChat(item);
    }

    function closeM() { document.getElementById('modal').style.display = 'none'; }

    // --- LÓGICA DE CHAT ---
    async function initChat(item) {
        if(!currentUser) return alert("Inicia sesión para chatear");
        if(currentUser.id === item.seller_id) return alert("Es tu propio item");

        closeM();
        document.getElementById('chat-panel').style.display = 'flex';
        loadMessages(item.id);

        // Suscribirse a mensajes nuevos en tiempo real
        _supabase
            .channel('any')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'marketplace_chats' }, payload => {
                if(payload.new.item_id === item.id) addMsgToUI(payload.new);
            })
            .subscribe();
    }

    async function loadMessages(itemId) {
        const { data } = await _supabase.from('marketplace_chats')
            .select('*').eq('item_id', itemId).order('created_at', {ascending: true});
        
        const container = document.getElementById('chat-msgs');
        container.innerHTML = "";
        data?.forEach(addMsgToUI);
    }

    function addMsgToUI(msg) {
        const container = document.getElementById('chat-msgs');
        const div = document.createElement('div');
        div.className = `msg ${msg.sender_id === currentUser.id ? 'me' : 'them'}`;
        div.innerText = msg.message;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    async function sendMsg() {
        const input = document.getElementById('chat-input');
        if(!input.value.trim()) return;

        const payload = {
            item_id: currentItem.id,
            buyer_id: currentUser.id,
            seller_id: currentItem.seller_id,
            sender_id: currentUser.id,
            message: input.value
        };

        const { error } = await _supabase.from('marketplace_chats').insert([payload]);
        if(!error) input.value = "";
    }

    function closeChat() { document.getElementById('chat-panel').style.display = 'none'; }
    function showTab(t) {
        document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
        document.getElementById(t).classList.add('active');
    }
</script>
</body>
</html>
