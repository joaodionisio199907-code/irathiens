<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOPYSPACE | STAR CITIZEN MARKET</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Barlow+Condensed:wght@700;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --blue-light: #00d2ff;
            --blue-dark: #0056ff;
            --yellow-accent: #ffb800;
            --yellow-bright: #ffe600;
            --bg-deep: #050a12;
            --bg-card: #0e1621;
            --text-white: #ffffff;
            --grad-blue: linear-gradient(90deg, #00d2ff 0%, #0056ff 100%);
            --font-main: 'Rajdhani', sans-serif;
            --font-logo: 'Orbitron', sans-serif;
            --font-impact: 'Barlow Condensed', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        body {
            margin: 0; background-color: var(--bg-deep); color: var(--text-white);
            font-family: var(--font-main); overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #102a4d 0%, var(--bg-deep) 80%);
            min-height: 100vh;
        }

        /* --- NAV --- */
        nav {
            background: rgba(0, 0, 0, 0.95); border-bottom: 3px solid; border-image: var(--grad-blue) 1;
            padding: 0 40px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(15px); height: 90px;
        }

        .logo-wrapper { height: 100%; display: flex; align-items: center; cursor: pointer; }
        .logo-img { 
            max-height: 75px; /* Tamaño aumentado */
            filter: drop-shadow(0 0 12px var(--blue-light)); 
            transition: 0.3s;
        }
        .logo-img:hover { transform: scale(1.05); filter: drop-shadow(0 0 20px var(--blue-light)); }

        .nav-controls { display: flex; align-items: center; gap: 25px; }
        .nav-links { display: flex; gap: 25px; }
        .nav-links a { 
            color: #fff; text-decoration: none; font-family: var(--font-impact); font-size: 1.3rem; 
            cursor: pointer; transition: 0.3s; text-transform: uppercase; font-style: italic; letter-spacing: 1px;
        }
        .nav-links a.active { color: var(--yellow-accent); border-bottom: 3px solid var(--yellow-accent); }

        .lang-selector {
            background: #000; border: 1px solid var(--blue-light); color: var(--blue-light);
            padding: 8px; font-weight: bold; cursor: pointer; font-family: var(--font-logo);
        }

        /* --- LAYOUT --- */
        .marketplace-wrapper {
            display: grid; grid-template-columns: 280px 1fr; gap: 30px;
            max-width: 1600px; margin: 30px auto; padding: 0 20px;
        }

        .sidebar {
            background: var(--bg-card); padding: 25px; border-radius: 0 20px 0 20px;
            border-left: 4px solid var(--blue-light); height: fit-content; position: sticky; top: 120px;
        }
        .cat-item {
            display: block; padding: 12px 15px; color: #8899af; text-decoration: none;
            font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.3s;
            clip-path: polygon(0 0, 100% 0, 90% 100%, 0 100%); margin-bottom: 8px;
        }
        .cat-item:hover { background: rgba(0, 210, 255, 0.1); color: #fff; padding-left: 20px; }
        .cat-item.active { background: var(--grad-blue); color: white; }

        /* --- MARKET GRID --- */
        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .item-card {
            background: var(--bg-card); border: 1px solid #1a2635; transition: 0.4s;
            cursor: pointer; border-radius: 0 15px 0 15px; overflow: hidden; position: relative;
        }
        .item-card:hover { transform: translateY(-10px); border-color: var(--yellow-accent); box-shadow: 0 0 20px rgba(0,210,255,0.2); }
        .item-card img { width: 100%; height: 200px; object-fit: cover; }
        .item-card-info { padding: 15px; background: linear-gradient(to top, #000, transparent); }
        .item-card h3 { margin: 0; font-family: var(--font-logo); font-size: 0.85rem; color: var(--blue-light); letter-spacing: 1px; }
        .price-tag { color: var(--yellow-bright); font-family: var(--font-mono); font-weight: bold; font-size: 1.3rem; margin-top: 8px; }

        /* --- MODAL DETALLES --- */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); display: none; justify-content: center; 
            align-items: center; z-index: 2000; backdrop-filter: blur(10px); 
        }
        .modal-content { 
            background: var(--bg-card); border: 2px solid var(--blue-light); 
            width: 90%; max-width: 1000px; display: grid; grid-template-columns: 1fr 1fr; 
            position: relative; border-radius: 0 30px 0 30px; overflow: hidden;
        }
        .modal-close { position: absolute; top: 20px; right: 20px; color: var(--yellow-accent); cursor: pointer; font-family: var(--font-logo); font-size: 1.5rem; z-index: 10; }
        .modal-img-side { background: #000; display: flex; align-items: center; justify-content: center; }
        .modal-info-side { padding: 40px; display: flex; flex-direction: column; gap: 20px; }

        /* --- BOTONES Y FORMS --- */
        .search-bar {
            width: 100%; background: #000; border: 2px solid #1a2635; padding: 15px;
            color: white; font-size: 1.1rem; border-radius: 5px; margin-bottom: 20px; box-sizing: border-box;
        }
        .action-btn {
            background: linear-gradient(90deg, #ffb800, #ffe600); border: none; padding: 18px;
            font-family: var(--font-impact); font-size: 1.3rem; font-weight: 900;
            cursor: pointer; text-transform: uppercase; width: 100%; font-style: italic;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
        }
    </style>
</head>
<body>

<nav>
    <div class="logo-wrapper" onclick="location.reload()">
        <img src="img/Shopy.png" alt="SHOPYSPACE" class="logo-img">
    </div>
    <div class="nav-controls">
        <div class="nav-links">
            <a onclick="showTab('market')" id="link-market" class="active" data-i18n="nav_market">MARKETPLACE</a>
            <a onclick="showTab('sell')" id="link-sell" data-i18n="nav_sell">PUBLISH ITEM</a>
        </div>
        <select class="lang-selector" onchange="changeLang(this.value)">
            <option value="en">EN</option>
            <option value="es">ES</option>
            <option value="zh">ZH</option>
            <option value="ja">JA</option>
            <option value="ru">RU</option>
        </select>
    </div>
</nav>

<div class="marketplace-wrapper">
    <aside class="sidebar">
        <div style="font-family: var(--font-logo); font-size: 0.7rem; color: var(--blue-light); margin-bottom: 15px;" data-i18n="side_title">SYSTEM SECTORS</div>
        <a class="cat-item active" onclick="filterByCategory('all', this)" data-i18n="cat_all">ALL ITEMS</a>
        <a class="cat-item" onclick="filterByCategory('Armor', this)" data-i18n="cat_armor">ARMOR</a>
        <a class="cat-item" onclick="filterByCategory('Weapons', this)" data-i18n="cat_weapons">WEAPONS</a>
        <a class="cat-item" onclick="filterByCategory('Ships', this)" data-i18n="cat_ships">SHIPS</a>
        <a class="cat-item" onclick="filterByCategory('Medical', this)" data-i18n="cat_medical">MEDICAL</a>
    </aside>

    <main>
        <section id="market">
            <input type="text" id="main-search" class="search-bar" data-i18n-placeholder="search_placeholder" oninput="handleGlobalSearch()">
            <div id="market-grid" class="market-grid"></div>
        </section>

        <section id="sell" style="display:none;">
            <div style="max-width: 600px; margin: auto; background: var(--bg-card); padding: 40px; border-radius: 0 20px 0 20px; border: 1px solid #1a2635;">
                <h2 style="font-family: var(--font-impact); color: var(--yellow-accent); font-style: italic; font-size: 2rem;" data-i18n="sell_title">NEW MANIFEST ENTRY</h2>
                
                <label data-i18n="ph_name" style="color:var(--blue-light); font-family:var(--font-logo); font-size:0.7rem;">ITEM NAME</label>
                <input type="text" id="item-name" class="search-bar" placeholder="e.g. ADP-Core Armor">

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label style="color:var(--blue-light); font-family:var(--font-logo); font-size:0.7rem;">CATEGORY</label>
                        <select id="item-cat" class="search-bar">
                            <option value="Armor">Armor</option>
                            <option value="Weapons">Weapons</option>
                            <option value="Ships">Ships</option>
                            <option value="Medical">Medical</option>
                        </select>
                    </div>
                    <div>
                        <label style="color:var(--blue-light); font-family:var(--font-logo); font-size:0.7rem;">LOCATION</label>
                        <input type="text" id="item-location" class="search-bar" placeholder="GrimHEX, Orison...">
                    </div>
                </div>

                <label style="color:var(--blue-light); font-family:var(--font-logo); font-size:0.7rem;">PRICE (aUEC)</label>
                <input type="number" id="item-price" class="search-bar" placeholder="0">

                <div id="img-preview" onclick="document.getElementById('file-input').click()" style="width:100%; height:150px; border:2px dashed #333; margin-bottom:20px; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden;">
                    <span style="color:#444">CLICK TO UPLOAD SCAN</span>
                </div>
                <input type="file" id="file-input" hidden onchange="processImg(this)">

                <button class="action-btn" onclick="uploadToNet()" data-i18n="btn_upload">TRANSMIT TO GALAXY NET</button>
            </div>
        </section>
    </main>
</div>

<div class="modal-overlay" id="item-modal">
    <div class="modal-content">
        <div class="modal-close" onclick="closeModal()">[ X ]</div>
        <div class="modal-img-side">
            <img id="m-img" style="width:100%; height:100%; object-fit: contain;">
        </div>
        <div class="modal-info-side">
            <h2 id="m-title" style="font-family: var(--font-logo); color: var(--blue-light); margin:0;"></h2>
            <div id="m-price" style="font-family: var(--font-mono); color: var(--yellow-bright); font-size: 2.5rem; font-weight: bold;"></div>
            <div style="border-top: 1px solid #333; padding-top: 20px;">
                <p style="margin:5px 0;"><strong style="color:var(--blue-light)">SECTOR:</strong> <span id="m-cat"></span></p>
                <p style="margin:5px 0;"><strong style="color:var(--blue-light)">LOCATION:</strong> <span id="m-loc"></span></p>
            </div>
            <button class="action-btn" style="margin-top: auto;">CONTACT SELLER</button>
        </div>
    </div>
</div>

<script>
    const SB_URL = 'https://dfizvgagofsctgwzksgd.supabase.co';
    const SB_KEY = 'sb_publishable_3iByg_zBXp4C-SCtfeIiDw_NeyfB3wR';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let allItems = [];
    let uploadedImgBase64 = null;

    const i18n = {
        en: { nav_market: "MARKETPLACE", nav_sell: "PUBLISH ITEM", side_title: "NETWORK SECTORS", cat_all: "ALL ITEMS", cat_armor: "ARMOR", cat_weapons: "WEAPONS", cat_ships: "SHIPS", cat_medical: "MEDICAL", search_placeholder: "SEARCH BY NAME OR LOCATION...", sell_title: "NEW MANIFEST ENTRY", ph_name: "ITEM NAME...", btn_upload: "TRANSMIT TO GALAXY NET" },
        es: { nav_market: "MERCADO", nav_sell: "PUBLICAR ITEM", side_title: "SECTORES DE RED", cat_all: "TODO EL BOTÍN", cat_armor: "ARMADURAS", cat_weapons: "ARMAMENTO", cat_ships: "NAVES", cat_medical: "MÉDICO", search_placeholder: "BUSCAR POR NOMBRE O LUGAR...", sell_title: "NUEVO MANIFIESTO", ph_name: "NOMBRE DEL ITEM...", btn_upload: "TRANSMITIR A LA RED" },
        zh: { nav_market: "市场", nav_sell: "发布物品", side_title: "网络部门", cat_all: "所有物品", cat_armor: "护甲", cat_weapons: "武器", cat_ships: "飞船", cat_medical: "医疗", search_placeholder: "搜索...", sell_title: "新清单", ph_name: "名称", btn_upload: "传输" },
        ja: { nav_market: "マーケット", nav_sell: "出品", side_title: "セクター", cat_all: "全アイテム", cat_armor: "アーマー", cat_weapons: "武器", cat_ships: "シップ", cat_medical: "医療", search_placeholder: "検索...", sell_title: "新規登録", ph_name: "アイテム名", btn_upload: "送信" },
        ru: { nav_market: "РЫНОК", nav_sell: "ПРОДАТЬ", side_title: "СЕКТОРЫ", cat_all: "ВСЕ", cat_armor: "БРОНЯ", cat_weapons: "ОРУЖИЕ", cat_ships: "КОРАБЛИ", cat_medical: "МЕДИЦИНА", search_placeholder: "ПОИСК...", sell_title: "НОВЫЙ МАНИФЕСТ", ph_name: "НАЗВАНИЕ", btn_upload: "ПЕРЕДАТЬ" }
    };

    window.onload = () => {
        fetchMarket();
        changeLang('en');
    };

    async function fetchMarket() {
        const { data, error } = await _supabase.from('marketplace_items').select('*').order('created_at', {ascending: false});
        if (!error) { allItems = data; renderItems(data); }
    }

    function renderItems(list) {
        const grid = document.getElementById('market-grid');
        grid.innerHTML = "";
        list.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.onclick = () => openDetails(item); // AQUÍ SE ACTIVA EL CLIC
            card.innerHTML = `
                <img src="${item.image_1 || 'https://via.placeholder.com/400x200?text=NO+SIGNAL'}">
                <div class="item-card-info">
                    <h3>${item.item_name.toUpperCase()}</h3>
                    <div style="font-size:0.7rem; color:#666; font-family:var(--font-mono)">LOC: ${(item.location || 'UNKNOWN').toUpperCase()}</div>
                    <div class="price-tag">${parseInt(item.price_auec).toLocaleString()} aUEC</div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function openDetails(item) {
        document.getElementById('m-title').innerText = item.item_name.toUpperCase();
        document.getElementById('m-price').innerText = parseInt(item.price_auec).toLocaleString() + " aUEC";
        document.getElementById('m-img').src = item.image_1 || '';
        document.getElementById('m-cat').innerText = (item.category || 'GENERAL').toUpperCase();
        document.getElementById('m-loc').innerText = (item.location || 'UNKNOWN').toUpperCase();
        document.getElementById('item-modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('item-modal').style.display = 'none'; }

    function showTab(t) {
        document.getElementById('market').style.display = (t === 'market') ? 'block' : 'none';
        document.getElementById('sell').style.display = (t === 'sell') ? 'block' : 'none';
        document.getElementById('link-market').classList.toggle('active', t === 'market');
        document.getElementById('link-sell').classList.toggle('active', t === 'sell');
    }

    function changeLang(lang) {
        document.querySelectorAll('[data-i18n]').forEach(el => { el.innerText = i18n[lang][el.getAttribute('data-i18n')]; });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = i18n[lang][el.getAttribute('data-i18n-placeholder')]; });
    }

    function processImg(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            uploadedImgBase64 = e.target.result;
            document.getElementById('img-preview').innerHTML = `<img src="${e.target.result}" style="height:100%">`;
        };
        reader.readAsDataURL(input.files[0]);
    }

    async function uploadToNet() {
        const payload = {
            item_name: document.getElementById('item-name').value,
            category: document.getElementById('item-cat').value,
            location: document.getElementById('item-location').value,
            price_auec: document.getElementById('item-price').value,
            image_1: uploadedImgBase64,
            status: 'available'
        };
        const { error } = await _supabase.from('marketplace_items').insert([payload]);
        if(error) alert("FAILED: " + error.message);
        else { alert("TRANSMISSION SUCCESSFUL"); location.reload(); }
    }

    function handleGlobalSearch() {
        const q = document.getElementById('main-search').value.toLowerCase();
        renderItems(allItems.filter(i => i.item_name.toLowerCase().includes(q) || (i.location && i.location.toLowerCase().includes(q))));
    }

    function filterByCategory(cat, el) {
        document.querySelectorAll('.cat-item').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        renderItems(cat === 'all' ? allItems : allItems.filter(i => i.category === cat));
    }
</script>

</body>
</html>
