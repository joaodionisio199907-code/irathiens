<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHOPYSPACE | GALAXY MARKET</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Barlow+Condensed:wght@700;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --blue-light: #00d2ff;
            --blue-dark: #0056ff;
            --yellow-accent: #ffb800;
            --bg-deep: #050a12;
            --bg-card: #0e1621;
            --text-white: #ffffff;
            --font-main: 'Rajdhani', sans-serif;
            --font-logo: 'Orbitron', sans-serif;
            --font-impact: 'Barlow Condensed', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        ::-webkit-scrollbar { display: none; }
        body { margin: 0; background-color: var(--bg-deep); color: var(--text-white); font-family: var(--font-main); overflow-x: hidden; background-image: radial-gradient(circle at 50% 0%, #102a4d 0%, var(--bg-deep) 80%); min-height: 100vh; -webkit-tap-highlight-color: transparent; }

        /* --- NAVEGACIÓN --- */
        nav { background: rgba(0, 0, 0, 0.95); border-bottom: 2px solid var(--blue-light); padding: 0 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; height: 70px; backdrop-filter: blur(10px); }
        .logo-img { max-height: 70px; cursor: pointer; filter: drop-shadow(0 0 5px var(--blue-light)); }
        .nav-links { display: flex; gap: 8px; }
        .nav-links a { color: #fff; text-decoration: none; font-family: var(--font-impact); font-size: 0.75rem; cursor: pointer; padding: 6px 10px; border-radius: 4px; text-transform: uppercase; font-style: italic; }
        .nav-links a.active { color: var(--blue-light); border-bottom: 2px solid var(--blue-light); }

        /* --- SUB-NAVBAR (DINÁMICA) --- */
        .sub-nav { display: none; gap: 10px; padding: 10px 0; overflow-x: auto; border-bottom: 1px solid rgba(0, 210, 255, 0.1); margin-bottom: 15px; }
        .sub-item { background: rgba(255,255,255,0.05); color: #8899af; padding: 5px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; cursor: pointer; white-space: nowrap; border: 1px solid transparent; text-transform: uppercase; }
        .sub-item.active { border-color: var(--blue-light); color: var(--blue-light); background: rgba(0, 210, 255, 0.05); }

        /* --- ESTRUCTURA --- */
        .main-container { max-width: 1200px; margin: 15px auto; padding: 0 15px; display: flex; gap: 20px; align-items: flex-start; }
        .sidebar { width: 180px; flex-shrink: 0; background: var(--bg-card); padding: 15px; border-radius: 0 15px 0 15px; border-left: 4px solid var(--blue-light); }
        .cat-item { display: block; padding: 12px; color: #8899af; cursor: pointer; font-weight: 700; margin-bottom: 5px; border-radius: 4px; transition: 0.2s; text-transform: uppercase; font-size: 0.85rem; }
        .cat-item.active { background: linear-gradient(90deg, #00d2ff, #0056ff); color: white; }
        .cat-medals { color: var(--yellow-accent); border: 1px solid rgba(255, 184, 0, 0.2); margin-top: 10px; }

        .content-area { flex-grow: 1; width: 100%; }

        /* --- MARKET GRID --- */
        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        .item-card { background: var(--bg-card); border-radius: 0 12px 0 12px; overflow: hidden; border: 1px solid #1a2635; position: relative; cursor: pointer; transition: 0.3s; }
        .item-card:hover { border-color: var(--blue-light); transform: translateY(-3px); }
        .item-card img { width: 100%; height: 140px; object-fit: cover; }
        .item-card-info { padding: 10px; }
        .item-card-info h3 { margin: 0; font-size: 0.75rem; color: var(--blue-light); font-family: var(--font-logo); height: 2.4em; overflow: hidden; }
        .item-card.is-medal { border: 1px solid var(--yellow-accent); }

        /* --- SELL SECTION --- */
        .sell-wrapper { width: 100%; display: none; justify-content: center; padding: 10px 0; }
        #publish-container { background: var(--bg-card); padding: 30px; border-radius: 20px; border: 1px solid rgba(0, 210, 255, 0.2); width: 100%; max-width: 480px; box-shadow: 0 10px 50px rgba(0,0,0,0.8); }
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-size: 0.65rem; color: var(--blue-light); font-family: var(--font-mono); margin-bottom: 5px; text-transform: uppercase; }
        .input-field { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid #1a2635; padding: 12px; color: white; border-radius: 8px; box-sizing: border-box; font-family: var(--font-main); font-size: 1rem; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .sidebar { width: 100%; display: flex; overflow-x: auto; padding: 10px; border-radius: 0; border-left: none; border-bottom: 1px solid var(--blue-light); margin: 0 -15px 15px -15px; }
            .cat-item { white-space: nowrap; padding: 8px 15px; font-size: 0.8rem; }
            .market-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<nav>
    <img src="img/Shopy.png" class="logo-img" onclick="showTab('market')">
    <div class="nav-links">
        <a onclick="showTab('market')" id="link-market" class="active">MARKET</a>
        <a onclick="showTab('sell')" id="link-sell">SELL</a>
        <a onclick="showTab('my-items')" id="link-my-items" style="display:none;">MY ASSETS</a>
        <a href="Chats.html" id="chat-btn" style="display:none;">CHATS</a>
    </div>
</nav>

<div class="main-container">
    <aside class="sidebar" id="sidebar-filter">
        <a class="cat-item active" onclick="selectMainCategory('all', this)">ALL</a>
        <a class="cat-item" onclick="selectMainCategory('Armor', this)">ARMOR</a>
        <a class="cat-item" onclick="selectMainCategory('Weapons', this)">WEAPONS</a>
        <a class="cat-item" onclick="selectMainCategory('Ships', this)">SHIPS</a>
        <a class="cat-item" onclick="selectMainCategory('Components', this)">COMPONENTS</a>
        <a class="cat-item" onclick="selectMainCategory('Medical', this)">MEDICAL</a>
        <a class="cat-item cat-medals" onclick="selectMainCategory('Medals', this)">🎖️ MEDALS</a>
    </aside>

    <div class="content-area">
        <section id="market-section">
            <input type="text" id="main-search" class="input-field" placeholder="SEARCH GALAXY ASSETS..." oninput="handleGlobalSearch()" style="margin-bottom: 10px;">
            
            <div id="sub-nav" class="sub-nav"></div>

            <div id="market-grid" class="market-grid"></div>
        </section>

        <section id="sell-section" class="sell-wrapper">
            <div id="publish-container">
                <h2 style="text-align:center; color: var(--blue-light); font-family: var(--font-impact); margin-top:0; letter-spacing: 2px;">DATA UPLOAD</h2>
                <div class="form-group">
                    <label class="form-label">Asset Designation</label>
                    <input type="text" id="item-name" class="input-field" placeholder="Name">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;" class="form-group">
                    <div>
                        <label class="form-label">Category</label>
                        <select id="item-cat" class="input-field" onchange="updateSubCatSelect()">
                            <option value="Armor">ARMOR</option>
                            <option value="Weapons">WEAPONS</option>
                            <option value="Ships">SHIPS</option>
                            <option value="Components">COMPONENTS</option>
                            <option value="Medical">MEDICAL</option>
                            <option value="Medals">MEDALS</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label">Sub-Category</label>
                        <select id="item-subcat" class="input-field">
                            </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Price (aUEC)</label>
                    <input type="number" id="item-price" class="input-field" placeholder="0">
                </div>
                <div class="form-group">
                    <label class="form-label">Location</label>
                    <input type="text" id="item-location" class="input-field" placeholder="Station">
                </div>
                <div id="img-preview">NO VISUAL DATA</div>
                <button class="input-field" style="margin-bottom:10px; cursor:pointer; background: #1a2635;" onclick="document.getElementById('file-input').click()">UPLOAD VISUAL</button>
                <input type="file" id="file-input" hidden onchange="processImg(this)">
                <button class="btn-main" onclick="uploadToNet()">CONFIRM BROADCAST</button>
            </div>
        </section>
    </div>
</div>

<script>
    const SB_URL = 'https://dfizvgagofsctgwzksgd.supabase.co';
    const SB_KEY = 'sb_publishable_3iByg_zBXp4C-SCtfeIiDw_NeyfB3wR';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let allItems = [];
    let currentUser = null;
    let selectedMainCat = 'all';
    let uploadedImgBase64 = null;

    // DEFINICIÓN DE SUB-CATEGORÍAS
    const SUB_DATA = {
        'Armor': ['Helmet', 'Core', 'Arms', 'Legs', 'Backpack', 'Undersuit', 'Clothes'],
        'Components': ['Power Plant', 'Cooler', 'Quantum Drive', 'Shield Gen', 'Weapons Mount'],
        'Ships': ['Light Fighter', 'Medium Fighter', 'Heavy Fighter', 'Industrial', 'Transport'],
        'Weapons': ['Pistol', 'SMG', 'Rifle', 'Sniper', 'Shotgun', 'Special']
    };

    async function fetchMarket() {
        const { data } = await _supabase.from('marketplace_items').select('*').order('created_at', {ascending: false});
        if (data) { allItems = data; renderGrid(allItems); }
    }

    // Navegación Principal
    function selectMainCategory(cat, el) {
        selectedMainCat = cat;
        document.querySelectorAll('.cat-item').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        
        const subNav = document.getElementById('sub-nav');
        subNav.innerHTML = '';
        
        if (SUB_DATA[cat]) {
            subNav.style.display = 'flex';
            // Opción "All [Category]"
            const btnAll = document.createElement('div');
            btnAll.className = 'sub-item active';
            btnAll.innerText = 'ALL ' + cat;
            btnAll.onclick = () => filterBySub('all', btnAll);
            subNav.appendChild(btnAll);

            SUB_DATA[cat].forEach(sub => {
                const btn = document.createElement('div');
                btn.className = 'sub-item';
                btn.innerText = sub;
                btn.onclick = () => filterBySub(sub, btn);
                subNav.appendChild(btn);
            });
        } else {
            subNav.style.display = 'none';
        }

        const list = (cat === 'all') ? allItems : allItems.filter(i => i.category === cat);
        renderGrid(list);
    }

    function filterBySub(sub, el) {
        document.querySelectorAll('.sub-item').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        
        let list = allItems.filter(i => i.category === selectedMainCat);
        if (sub !== 'all') {
            // Asumimos que guardamos la subcategoría en una columna llamada 'sub_category'
            list = list.filter(i => i.sub_category === sub);
        }
        renderGrid(list);
    }

    function renderGrid(list) {
        const grid = document.getElementById('market-grid');
        grid.innerHTML = "";
        list.forEach(item => {
            const card = document.createElement('div');
            card.className = `item-card ${item.category === 'Medals' ? 'is-medal' : ''}`;
            card.innerHTML = `
                <img src="${item.image_1 || ''}">
                <div class="item-card-info">
                    <span style="font-size:0.6rem; color:#555;">${item.sub_category || ''}</span>
                    <h3>${item.item_name.toUpperCase()}</h3>
                    <div style="color:var(--yellow-accent); font-weight:bold;">${parseInt(item.price_auec).toLocaleString()} aUEC</div>
                </div>`;
            grid.appendChild(card);
        });
    }

    // Lógica del Formulario de Subida
    function updateSubCatSelect() {
        const cat = document.getElementById('item-cat').value;
        const subSelect = document.getElementById('item-subcat');
        subSelect.innerHTML = '';
        if (SUB_DATA[cat]) {
            SUB_DATA[cat].forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub; opt.innerText = sub.toUpperCase();
                subSelect.appendChild(opt);
            });
        } else {
            const opt = document.createElement('option');
            opt.value = ''; opt.innerText = 'N/A';
            subSelect.appendChild(opt);
        }
    }

    async function uploadToNet() {
        if(!currentUser) return alert("LOGIN REQUIRED");
        const payload = {
            item_name: document.getElementById('item-name').value,
            category: document.getElementById('item-cat').value,
            sub_category: document.getElementById('item-subcat').value,
            location: document.getElementById('item-location').value,
            price_auec: document.getElementById('item-price').value,
            image_1: uploadedImgBase64,
            seller_id: currentUser.id
        };
        const { error } = await _supabase.from('marketplace_items').insert([payload]);
        if (!error) { alert("BROADCAST SUCCESS"); location.reload(); }
    }

    // Inicialización y funciones de ayuda (processImg, showTab, checkAuth igual que antes)
    function showTab(t) {
        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
        if(document.getElementById('link-'+t)) document.getElementById('link-'+t).classList.add('active');
        document.getElementById('market-section').style.display = (t === 'market') ? 'block' : 'none';
        document.getElementById('sell-section').style.display = (t === 'sell') ? 'flex' : 'none';
        document.getElementById('sidebar-filter').style.display = (t === 'market') ? 'block' : 'none';
    }

    function processImg(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                uploadedImgBase64 = e.target.result;
                document.getElementById('img-preview').innerHTML = `<img src="${uploadedImgBase64}">`;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function checkAuth() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (session) {
            currentUser = session.user;
            document.getElementById('link-my-items').style.display = 'inline-block';
            document.getElementById('chat-btn').style.display = 'inline-block';
        }
    }

    window.onload = () => { fetchMarket(); checkAuth(); updateSubCatSelect(); };
</script>
</body>
</html>
