<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHOPYSPACE | GALAXY MARKET</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Barlow+Condensed:wght@700;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --blue-light: #00d2ff;
            --blue-dark: #0056ff;
            --yellow-accent: #ffb800;
            --yellow-bright: #ffe600;
            --bg-deep: #050a12;
            --bg-card: #0e1621;
            --text-white: #ffffff;
            --grad-blue: linear-gradient(90deg, #00d2ff 0%, #0056ff 100%);
            --font-main: 'Rajdhani', sans-serif;
            --font-logo: 'Orbitron', sans-serif;
            --font-impact: 'Barlow Condensed', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        ::-webkit-scrollbar { display: none; }
        
        body { 
            margin: 0; background-color: var(--bg-deep); color: var(--text-white);
            font-family: var(--font-main); overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #102a4d 0%, var(--bg-deep) 80%);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- NAVEGACIÓN --- */
        nav {
            background: rgba(0, 0, 0, 0.95); border-bottom: 2px solid var(--blue-light);
            padding: 0 15px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(15px); height: 70px;
        }

        .logo-wrapper { height: 100%; display: flex; align-items: center; cursor: pointer; }
        .logo-img { max-height: 45px; filter: drop-shadow(0 0 8px var(--blue-light)); }

        .nav-controls { display: flex; align-items: center; }
        .nav-links { display: flex; gap: 8px; align-items: center; }
        .nav-links a { 
            color: #fff; text-decoration: none; font-family: var(--font-impact); font-size: 1rem; 
            cursor: pointer; transition: 0.3s; text-transform: uppercase; font-style: italic;
            padding: 5px 8px;
        }
        .nav-links a.active { color: var(--yellow-accent); border-bottom: 2px solid var(--yellow-accent); }

        #chat-btn {
            display: none; 
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid var(--blue-light);
            color: var(--blue-light);
            padding: 6px 10px;
            border-radius: 4px;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            font-family: var(--font-impact);
            font-size: 0.85rem;
            transition: 0.3s;
            position: relative;
        }
        .chat-icon { width: 16px; height: 16px; fill: currentColor; }
        
        #chat-btn::after {
            content: ''; position: absolute; top: 4px; right: 4px;
            width: 5px; height: 5px; background: var(--yellow-bright);
            border-radius: 50%; box-shadow: 0 0 8px var(--yellow-bright);
        }

        /* --- MARKETPLACE WRAPPER --- */
        .marketplace-wrapper {
            max-width: 1400px; margin: 10px auto; padding: 0 15px;
            display: grid; grid-template-columns: 200px 1fr; gap: 20px;
        }

        .sidebar {
            background: var(--bg-card); padding: 15px; border-radius: 0 15px 0 15px;
            border-left: 4px solid var(--blue-light); height: fit-content;
            position: sticky; top: 90px;
        }

        .cat-item {
            display: block; padding: 12px; color: #8899af; text-decoration: none;
            font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: 0.2s;
            margin-bottom: 5px; border-radius: 4px;
        }
        .cat-item.active { background: var(--grad-blue); color: white; clip-path: polygon(0 0, 100% 0, 95% 100%, 0 100%); }

        .market-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; 
        }

        .item-card {
            background: var(--bg-card); border: 1px solid #1a2635; border-radius: 0 12px 0 12px;
            overflow: hidden; display: flex; flex-direction: column; cursor: pointer;
            transition: transform 0.2s;
        }
        .item-card:active { transform: scale(0.98); }
        .item-card img { width: 100%; height: 150px; object-fit: cover; border-bottom: 1px solid #1a2635; }
        .item-card-info { padding: 12px; }
        .item-card-info h3 { margin: 0; font-size: 0.8rem; color: var(--blue-light); font-family: var(--font-logo); line-height: 1.2; height: 2em; overflow: hidden; }
        .price-tag { color: var(--yellow-bright); font-family: var(--font-mono); font-weight: bold; font-size: 1rem; margin-top: 8px; }

        /* SECCIÓN RECLUTAMIENTO */
        .seller-recruitment {
            display: flex; flex-direction: column; 
            background: linear-gradient(135deg, #0e1621 0%, #050a12 100%);
            border: 1px solid #1a2635; border-radius: 15px;
            overflow: hidden; margin-bottom: 30px; border-left: 4px solid var(--yellow-accent);
        }
        .recruitment-img { width: 100%; height: 200px; object-fit: cover; }
        .recruitment-text { padding: 25px; text-align: center; }
        .recruitment-text h2 { font-family: var(--font-impact); font-size: 1.8rem; color: var(--yellow-accent); margin: 0 0 10px 0; }
        .recruitment-text p { font-size: 1rem; color: #ccc; line-height: 1.4; margin-bottom: 20px; }

        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); display: none; justify-content: center; 
            align-items: center; z-index: 2000; padding: 10px; box-sizing: border-box;
        }
        .modal-content { 
            background: var(--bg-card); border: 1px solid var(--blue-light); 
            width: 100%; max-width: 500px; border-radius: 15px; overflow-y: auto;
            max-height: 90vh;
        }
        .modal-img-side img { width: 100%; height: auto; display: block; }
        .modal-info-side { padding: 20px; }

        .search-bar { 
            width: 100%; background: rgba(0,0,0,0.5); border: 1px solid #1a2635; 
            padding: 14px; color: white; margin-bottom: 15px; border-radius: 8px; 
            box-sizing: border-box; font-family: var(--font-main); font-size: 1rem;
        }
        
        .action-btn {
            background: var(--grad-blue); border: none; padding: 15px; color: #fff;
            font-family: var(--font-impact); font-size: 1.1rem; cursor: pointer;
            text-transform: uppercase; font-style: italic; clip-path: polygon(4% 0, 100% 0, 96% 100%, 0 100%);
            width: 100%; text-decoration: none; display: inline-block; text-align: center; margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            nav { height: 65px; }
            .logo-img { max-height: 35px; }
            #chat-btn span { display: none; }
            .marketplace-wrapper { grid-template-columns: 1fr; margin-top: 5px; }
            .sidebar { 
                position: sticky; top: 65px; z-index: 900; display: flex; 
                overflow-x: auto; padding: 10px; gap: 8px; border-left: none; 
                border-bottom: 1px solid var(--blue-light); background: var(--bg-deep);
                border-radius: 0; margin: 0 -15px 15px -15px; scrollbar-width: none;
            }
            .cat-item { white-space: nowrap; padding: 8px 15px; margin-bottom: 0; background: #0e1621; border: 1px solid #1a2635; }
            .market-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .item-card img { height: 120px; }
            .modal-content { width: 95%; }
            .modal-info-side h2 { font-size: 1.1rem; }
            .recruitment-img { height: 150px; }
        }
    </style>
</head>
<body>

<nav>
    <div class="logo-wrapper" onclick="location.reload()">
        <img src="img/Shopy.png" alt="SHOPYSPACE" class="logo-img">
    </div>
    
    <div class="nav-controls">
        <div class="nav-links">
            <a onclick="showTab('market')" id="link-market" class="active">MARKET</a>
            <a onclick="showTab('sell')" id="link-sell">SELL</a>
            <a href="Chats.html" id="chat-btn">
                <svg class="chat-icon" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
                <span>CHATS</span>
            </a>
        </div>
    </div>
</nav>

<div class="marketplace-wrapper">
    <aside class="sidebar">
        <a class="cat-item active" onclick="filterByCategory('all', this)">ALL</a>
        <a class="cat-item" onclick="filterByCategory('Armor', this)">ARMOR</a>
        <a class="cat-item" onclick="filterByCategory('Weapons', this)">WEAPONS</a>
        <a class="cat-item" onclick="filterByCategory('Ships', this)">SHIPS</a>
        <a class="cat-item" onclick="filterByCategory('Medical', this)">MEDICAL</a>
    </aside>

    <main>
        <section id="market">
            <input type="text" id="main-search" class="search-bar" placeholder="SEARCH ASSET..." oninput="handleGlobalSearch()">
            <div id="market-grid" class="market-grid"></div>
        </section>

        <section id="sell" style="display:none;">
            <div class="seller-recruitment" id="recruitment-banner">
                <img src="https://images.unsplash.com/photo-1614728263952-84ea256f9679?auto=format&fit=crop&q=80&w=800" class="recruitment-img" alt="Trader">
                <div class="recruitment-text">
                    <h2>SELL ​​YOUR ITEMS ON SHOPYSPACE</h2>
                    <p>To sell on our system, you need to be registered</p>
                    <a href="https://www.irathiens.org/login" class="action-btn" style="background: var(--yellow-accent); color: #000; clip-path:none; border-radius:5px;">REGISTER AS SELLER</a>
                </div>
            </div>

            <div style="background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid #1a2635;">
                <h2 style="color: var(--blue-light); font-family: var(--font-impact); margin:0 0 15px 0;">NEW MANIFEST</h2>
                <input type="text" id="item-name" class="search-bar" placeholder="ITEM NAME">
                <select id="item-cat" class="search-bar">
                    <option value="Armor">ARMOR</option>
                    <option value="Weapons">WEAPONS</option>
                    <option value="Ships">SHIPS</option>
                    <option value="Medical">MEDICAL</option>
                </select>
                <input type="text" id="item-location" class="search-bar" placeholder="LOCATION">
                <input type="number" id="item-price" class="search-bar" placeholder="PRICE aUEC">
                <button class="action-btn" onclick="document.getElementById('file-input').click()" style="background:#1a2635;">SELECT IMAGE</button>
                <input type="file" id="file-input" hidden onchange="processImg(this)">
                <div id="img-preview" style="text-align:center; margin-bottom: 10px;"></div>
                <button class="action-btn" onclick="uploadToNet()" style="background:var(--yellow-accent); color:#000;">PUBLISH ASSET</button>
            </div>
        </section>
    </main>
</div>

<div class="modal-overlay" id="item-modal" onclick="if(event.target == this) closeModal()">
    <div class="modal-content">
        <div class="modal-img-side"><img id="m-img" src=""></div>
        <div class="modal-info-side">
            <h2 id="m-title" style="margin:0; font-family: var(--font-logo); color: var(--blue-light);"></h2>
            <div id="m-price" style="font-size: 1.6rem; color: var(--yellow-bright); font-family: var(--font-mono); margin: 10px 0;"></div>
            <div style="font-size: 0.85rem; border-top: 1px solid #333; padding-top: 10px; color: #aaa; margin-bottom:20px;">
                <p>SECTOR: <span id="m-cat" style="color:#fff"></span> | LOCATION: <span id="m-loc" style="color:#fff"></span></p>
            </div>
            <button class="action-btn" id="m-btn">OPEN DETAILS</button>
            <button class="action-btn" onclick="closeModal()" style="background:transparent; border:1px solid #444; clip-path:none;">CLOSE</button>
        </div>
    </div>
</div>

<script>
    const SB_URL = 'https://dfizvgagofsctgwzksgd.supabase.co';
    const SB_KEY = 'sb_publishable_3iByg_zBXp4C-SCtfeIiDw_NeyfB3wR';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let allItems = [];
    let uploadedImgBase64 = null;

    window.onload = () => {
        fetchMarket();
        checkAuth();
    };

    async function checkAuth() {
        const { data: { session } } = await _supabase.auth.getSession();
        const chatBtn = document.getElementById('chat-btn');
        const recruitmentBanner = document.getElementById('recruitment-banner');
        
        if (session) {
            chatBtn.style.display = 'flex';
            if(recruitmentBanner) recruitmentBanner.style.display = 'none'; // OCULTAR REGISTRO SI ESTÁ LOGUEADO
        } else {
            chatBtn.style.display = 'none';
            if(recruitmentBanner) recruitmentBanner.style.display = 'flex'; // MOSTRAR REGISTRO SI NO HAY SESIÓN
        }
    }

    async function fetchMarket() {
        const { data, error } = await _supabase.from('marketplace_items').select('*').order('created_at', {ascending: false});
        if (!error) { allItems = data; renderItems(data); }
    }

    function renderItems(list) {
        const grid = document.getElementById('market-grid');
        grid.innerHTML = "";
        list.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.onclick = () => openDetails(item);
            card.innerHTML = `
                <img src="${item.image_1 || 'https://via.placeholder.com/400x200'}" loading="lazy">
                <div class="item-card-info">
                    <h3>${item.item_name.toUpperCase()}</h3>
                    <div class="price-tag">${parseInt(item.price_auec).toLocaleString()} aUEC</div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function openDetails(item) {
        document.getElementById('m-title').innerText = item.item_name.toUpperCase();
        document.getElementById('m-price').innerText = parseInt(item.price_auec).toLocaleString() + " aUEC";
        document.getElementById('m-img').src = item.image_1 || '';
        document.getElementById('m-cat').innerText = (item.category || 'ASSET').toUpperCase();
        document.getElementById('m-loc').innerText = (item.location || 'UNKNOWN').toUpperCase();
        document.getElementById('m-btn').onclick = () => { window.location.href = `item.html?id=${item.id}`; };
        document.getElementById('item-modal').style.display = 'flex';
        document.body.style.overflow = 'hidden'; 
    }

    function closeModal() { document.getElementById('item-modal').style.display = 'none'; document.body.style.overflow = 'auto'; }

    function showTab(t) {
        document.getElementById('market').style.display = (t === 'market') ? 'block' : 'none';
        document.getElementById('sell').style.display = (t === 'sell') ? 'block' : 'none';
        document.getElementById('link-market').classList.toggle('active', t === 'market');
        document.getElementById('link-sell').classList.toggle('active', t === 'sell');
        window.scrollTo(0,0);
    }

    function processImg(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            uploadedImgBase64 = e.target.result;
            document.getElementById('img-preview').innerHTML = `<img src="${e.target.result}" style="width:100px; height:100px; object-fit:cover; border:2px solid var(--blue-light); border-radius:8px;">`;
        };
        reader.readAsDataURL(input.files[0]);
    }

    async function uploadToNet() {
        if(!uploadedImgBase64) return alert("Select image");
        const payload = {
            item_name: document.getElementById('item-name').value,
            category: document.getElementById('item-cat').value,
            location: document.getElementById('item-location').value,
            price_auec: document.getElementById('item-price').value,
            image_1: uploadedImgBase64,
            status: 'available'
        };
        const { error } = await _supabase.from('marketplace_items').insert([payload]);
        if(error) alert("Error"); else location.reload();
    }

    function handleGlobalSearch() {
        const q = document.getElementById('main-search').value.toLowerCase();
        renderItems(allItems.filter(i => i.item_name.toLowerCase().includes(q)));
    }

    function filterByCategory(cat, el) {
        document.querySelectorAll('.cat-item').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        renderItems(cat === 'all' ? allItems : allItems.filter(i => i.category === cat));
    }
</script>
</body>
</html>
