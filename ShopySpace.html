<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCS CORP | TERMINAL V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&family=JetBrains+Mono:wght@300&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #05070a;
            --accent: #c49a5c;
            --accent-dim: rgba(196, 154, 92, 0.2);
            --ui-blue: #00f2ff;
            --danger: #ff3e3e;
            --text: #e0e0e0;
            --font-hud: 'Orbitron', sans-serif;
        }

        body {
            margin: 0; background-color: var(--bg-dark); color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            background-image: radial-gradient(circle at 2px 2px, var(--accent-dim) 1px, transparent 0);
            background-size: 30px 30px;
        }

        nav {
            background: rgba(0, 0, 0, 0.9); border-bottom: 2px solid var(--accent);
            padding: 15px 40px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000;
        }

        .nav-links a { color: #fff; text-decoration: none; font-family: var(--font-hud); font-size: 0.7rem; margin-left: 20px; cursor: pointer; }
        .nav-links a.active { color: var(--accent); text-shadow: 0 0 10px var(--accent); }

        .main-container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }

        /* --- FORM PANEL --- */
        .card-panel { background: rgba(10, 12, 15, 0.95); border: 1px solid var(--accent-dim); padding: 30px; clip-path: polygon(0 0, 95% 0, 100% 5%, 100% 100%, 5% 100%, 0 95%); }
        
        input, select { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: #fff; margin-bottom: 15px; font-family: 'JetBrains Mono'; }

        /* --- PHOTO UPLOADER CON X --- */
        .file-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .file-box { 
            border: 2px dashed var(--accent-dim); height: 150px; position: relative;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            background: rgba(0,0,0,0.3);
        }
        .file-box:hover { border-color: var(--accent); }
        .file-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        /* La X para borrar */
        .remove-btn {
            position: absolute; top: 5px; right: 5px; background: var(--danger);
            color: white; border: none; width: 25px; height: 25px; cursor: pointer;
            display: none; z-index: 10; font-weight: bold; font-family: var(--font-hud);
            clip-path: polygon(20% 0%, 0% 20%, 30% 50%, 0% 80%, 20% 100%, 50% 70%, 80% 100%, 100% 80%, 70% 50%, 100% 20%, 80% 0%, 50% 30%);
        }

        .btn-primary { width: 100%; background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 15px; font-family: var(--font-hud); cursor: pointer; font-weight: bold; }
        .btn-primary:hover { background: var(--accent); color: #000; }

        /* --- MODAL --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: #0a0d12; border: 1px solid var(--accent); width: 90%; max-width: 700px; padding: 25px; }
        .verify-imgs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .verify-imgs img { width: 100%; height: 120px; object-fit: cover; border: 1px solid #333; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

<nav>
    <div style="font-family: var(--font-hud); color: var(--accent);">UCS_ORBITAL_V2</div>
    <div class="nav-links">
        <a onclick="showTab('market')" id="link-market" class="active">MERCADO</a>
        <a onclick="showTab('sell')" id="link-sell">VENDER</a>
    </section>
</nav>

<div class="main-container">
    <section id="market" class="tab-content active">
        <div id="market-items" class="file-grid"></div>
    </section>

    <section id="sell" class="tab-content">
        <div class="card-panel" style="max-width: 600px; margin: auto;">
            <h2 style="font-family: var(--font-hud); color: var(--accent); font-size: 1rem;">NUEVO_MANIFIESTO</h2>
            
            <input type="text" id="item-name" placeholder="NOMBRE DEL OBJETO">
            <input type="number" id="item-price" placeholder="PRECIO aUEC">
            
            <div class="file-grid">
                <div class="file-box" id="box-1">
                    <button class="remove-btn" id="rm-1" onclick="removeImg(1, event)">X</button>
                    <span id="txt-1" onclick="document.getElementById('file-1').click()">+ FOTO 1</span>
                    <img id="img-1">
                    <input type="file" id="file-1" hidden accept="image/*" onchange="previewImg(this, 1)">
                </div>
                <div class="file-box" id="box-2">
                    <button class="remove-btn" id="rm-2" onclick="removeImg(2, event)">X</button>
                    <span id="txt-2" onclick="document.getElementById('file-2').click()">+ FOTO 2</span>
                    <img id="img-2">
                    <input type="file" id="file-2" hidden accept="image/*" onchange="previewImg(this, 2)">
                </div>
            </div>

            <button class="btn-primary" onclick="openVerify()">ANALIZAR DATOS</button>
        </div>
    </section>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--accent); padding-bottom:10px; margin-bottom:15px;">
            <span style="font-family:var(--font-hud); color:var(--accent)">VERIFICACIÓN_DE_CARGA</span>
            <span onclick="closeModal()" style="cursor:pointer; color:var(--danger)">[ CERRAR ]</span>
        </div>
        
        <p>OBJETO: <span id="v-name" style="color:white">--</span></p>
        <p>PRECIO: <span id="v-price" style="color:var(--ui-blue)">--</span></p>

        <div class="verify-imgs">
            <img id="v-img-1" src="">
            <img id="v-img-2" src="">
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:20px;">
            <button class="btn-primary" style="border-color:var(--danger); color:var(--danger)" onclick="closeModal()">CANCELAR</button>
            <button class="btn-primary" id="confirm-upload-btn" onclick="finalUpload()">CONFIRMAR SUBIDA</button>
        </div>
    </div>
</div>

<script>
    const SB_URL = 'https://dfizvgagofsctgwzksgd.supabase.co';
    const SB_KEY = 'sb_publishable_3iByg_zBXp4C-SCtfeIiDw_NeyfB3wR';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let imagesBase64 = [null, null];

    function showTab(t) {
        document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
        document.getElementById(t).classList.add('active');
    }

    // --- PREVISUALIZAR Y QUITAR ---
    function previewImg(input, n) {
        const file = input.files[0];
        if (file && file.size < 10*1024*1024) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.getElementById('img-'+n);
                img.src = e.target.result;
                img.style.display = 'block';
                document.getElementById('txt-'+n).style.display = 'none';
                document.getElementById('rm-'+n).style.display = 'block';
                imagesBase64[n-1] = e.target.result;
            };
            reader.readAsDataURL(file);
        } else {
            alert("Archivo demasiado grande (Máximo 10MB)");
        }
    }

    function removeImg(n, e) {
        e.stopPropagation();
        document.getElementById('img-'+n).style.display = 'none';
        document.getElementById('txt-'+n).style.display = 'block';
        document.getElementById('rm-'+n).style.display = 'none';
        document.getElementById('file-'+n).value = "";
        imagesBase64[n-1] = null;
    }

    // --- MODAL ---
    function openVerify() {
        const name = document.getElementById('item-name').value;
        const price = document.getElementById('item-price').value;
        if(!name || !price) return alert("Completa los campos");

        document.getElementById('v-name').innerText = name;
        document.getElementById('v-price').innerText = parseInt(price).toLocaleString() + " aUEC";
        document.getElementById('v-img-1').src = imagesBase64[0] || '';
        document.getElementById('v-img-2').src = imagesBase64[1] || '';
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    // --- SUBIDA REAL ---
    async function finalUpload() {
        const btn = document.getElementById('confirm-upload-btn');
        btn.innerText = "SUBIENDO...";
        btn.disabled = true;

        const { data: { session } } = await _supabase.auth.getSession();
        if (!session) {
            alert("No hay sesión activa. Por favor, logueate.");
            btn.disabled = false;
            return;
        }

        const payload = {
            seller_id: session.user.id,
            item_name: document.getElementById('item-name').value,
            price_auec: parseInt(document.getElementById('item-price').value),
            image_1: imagesBase64[0],
            image_2: imagesBase64[1],
            status: 'available'
        };

        const { error } = await _supabase.from('marketplace_items').insert([payload]);

        if (error) {
            console.error(error);
            alert("Error al subir: " + error.message);
            btn.disabled = false;
            btn.innerText = "CONFIRMAR SUBIDA";
        } else {
            alert("¡Subida con éxito!");
            location.reload();
        }
    }
</script>
</body>
</html>
