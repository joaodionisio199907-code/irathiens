<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHOPYSPACE | GALAXY MARKET</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Barlow+Condensed:wght@700;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --blue-light: #00d2ff;
            --blue-dark: #0056ff;
            --yellow-accent: #ffb800;
            --bg-deep: #050a12;
            --bg-card: #0e1621;
            --text-white: #ffffff;
            --font-main: 'Rajdhani', sans-serif;
            --font-impact: 'Barlow Condensed', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        ::-webkit-scrollbar { display: none; }
        
        body { 
            margin: 0; background-color: var(--bg-deep); color: var(--text-white);
            font-family: var(--font-main); overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #102a4d 0%, var(--bg-deep) 80%);
            min-height: 100vh;
        }

        /* NAVEGACIÓN */
        nav {
            background: rgba(0, 0, 0, 0.95); border-bottom: 2px solid var(--blue-light);
            padding: 0 15px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; height: 70px;
        }
        .logo-img { max-height: 70px; cursor: pointer; }
        .nav-links { display: flex; gap: 10px; }
        .nav-links a { 
            color: #fff; text-decoration: none; font-family: var(--font-impact); font-size: 0.8rem; 
            cursor: pointer; padding: 6px 12px; border-radius: 4px; text-transform: uppercase;
        }
        .nav-links a.active { color: var(--blue-light); border-bottom: 2px solid var(--blue-light); }
        #chat-btn { border: 1px solid var(--blue-light); background: rgba(0, 210, 255, 0.1); }

        /* CONTENEDOR FLEXIBLE */
        .main-container { 
            max-width: 1200px; margin: 20px auto; padding: 0 15px; 
            display: flex; gap: 25px; align-items: flex-start;
        }

        /* SIDEBAR (Solo en Market) */
        .sidebar { 
            width: 200px; flex-shrink: 0; background: var(--bg-card); padding: 15px; 
            border-radius: 0 15px 0 15px; border-left: 4px solid var(--blue-light);
        }
        .cat-item { 
            display: block; padding: 12px; color: #8899af; cursor: pointer; 
            font-weight: 700; margin-bottom: 5px; border-radius: 4px; 
        }
        .cat-item.active { background: linear-gradient(90deg, #00d2ff, #0056ff); color: white; }

        /* ÁREA DE CONTENIDO */
        .content-area { flex-grow: 1; width: 100%; }

        /* FORMULARIO SELL - ESTILO CORREGIDO */
        .sell-wrapper { 
            width: 100%; display: flex; justify-content: center; padding: 20px 0; 
        }
        #publish-container { 
            background: var(--bg-card); padding: 35px; border-radius: 20px; 
            border: 1px solid rgba(0, 210, 255, 0.3); width: 100%; max-width: 500px;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 0.7rem; color: var(--blue-light); font-family: var(--font-mono); margin-bottom: 8px; letter-spacing: 1px; }
        
        .input-field { 
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid #1a2635; 
            padding: 15px; color: white; border-radius: 10px; box-sizing: border-box; 
            font-family: var(--font-main); font-size: 1rem;
        }

        #img-preview { 
            width: 100%; height: 200px; background: rgba(0,0,0,0.5); border: 2px dashed #1a2635; 
            border-radius: 15px; display: flex; align-items: center; justify-content: center; 
            margin-bottom: 15px; overflow: hidden; font-family: var(--font-mono); color: #2a3a4d;
        }
        #img-preview img { width: 100%; height: 100%; object-fit: contain; }

        .btn-main { 
            background: var(--yellow-accent); color: #000; border: none; padding: 18px; 
            font-family: var(--font-impact); font-size: 1.2rem; cursor: pointer; width: 100%; 
            clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%); font-weight: 900;
        }

        /* MARKET GRID */
        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .item-card { background: var(--bg-card); border-radius: 0 12px 0 12px; overflow: hidden; border: 1px solid #1a2635; }
        .item-card img { width: 100%; height: 160px; object-fit: cover; }
        .item-card-info { padding: 12px; }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .sidebar { width: 100%; display: flex; overflow-x: auto; padding: 10px; border-left: none; border-bottom: 1px solid var(--blue-light); }
            .cat-item { white-space: nowrap; }
            #publish-container { padding: 20px; border: none; background: transparent; }
        }
    </style>
</head>
<body>

<nav>
    <img src="img/Shopy.png" class="logo-img" onclick="showTab('market')">
    <div class="nav-links">
        <a onclick="showTab('market')" id="link-market" class="active">MARKET</a>
        <a onclick="showTab('sell')" id="link-sell">SELL</a>
        <a onclick="showTab('my-items')" id="link-my-items" style="display:none;">MY ASSETS</a>
        <a href="Chats.html" id="chat-btn" style="display:none;">CHATS</a>
    </div>
</nav>

<div class="main-container">
    <aside class="sidebar" id="sidebar-filter">
        <a class="cat-item active" onclick="filterByCategory('all', this)">ALL</a>
        <a class="cat-item" onclick="filterByCategory('Armor', this)">ARMOR</a>
        <a class="cat-item" onclick="filterByCategory('Weapons', this)">WEAPONS</a>
        <a class="cat-item" onclick="filterByCategory('Ships', this)">SHIPS</a>
        <a class="cat-item" onclick="filterByCategory('Medical', this)">MEDICAL</a>
    </aside>

    <div class="content-area">
        <section id="market-section">
            <input type="text" id="main-search" class="input-field" placeholder="SEARCH ASSETS..." oninput="handleGlobalSearch()" style="margin-bottom: 20px;">
            <div id="market-grid" class="market-grid"></div>
        </section>

        <section id="sell-section" class="sell-wrapper" style="display:none;">
            <div id="publish-container">
                <h2 style="text-align:center; color: var(--blue-light); font-family: var(--font-impact); letter-spacing: 2px;">DATA UPLOAD</h2>
                
                <div class="form-group">
                    <label class="form-label">Asset Name</label>
                    <input type="text" id="item-name" class="input-field" placeholder="Name">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;" class="form-group">
                    <div>
                        <label class="form-label">Price (aUEC)</label>
                        <input type="number" id="item-price" class="input-field" placeholder="0">
                    </div>
                    <div>
                        <label class="form-label">Category</label>
                        <select id="item-cat" class="input-field">
                            <option value="Armor">ARMOR</option>
                            <option value="Weapons">WEAPONS</option>
                            <option value="Ships">SHIPS</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Location</label>
                    <input type="text" id="item-location" class="input-field" placeholder="Orison / Area18">
                </div>

                <div id="img-preview">NO IMAGE</div>
                
                <button class="input-field" style="margin-bottom:10px; cursor:pointer;" onclick="document.getElementById('file-input').click()">SELECT IMAGE</button>
                <input type="file" id="file-input" hidden onchange="processImg(this)">
                
                <button class="btn-main" onclick="uploadToNet()">PUBLISH</button>
            </div>
        </section>
    </div>
</div>

<script>
    const SB_URL = 'https://dfizvgagofsctgwzksgd.supabase.co';
    const SB_KEY = 'sb_publishable_3iByg_zBXp4C-SCtfeIiDw_NeyfB3wR';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let allItems = [];
    let currentUser = null;
    let uploadedImgBase64 = null;

    async function fetchMarket() {
        const { data } = await _supabase.from('marketplace_items').select('*').order('created_at', {ascending: false});
        if (data) { allItems = data; renderGrid(data); }
    }

    function renderGrid(list) {
        const grid = document.getElementById('market-grid');
        grid.innerHTML = list.map(item => `
            <div class="item-card">
                <img src="${item.image_1 || ''}">
                <div class="item-card-info">
                    <div style="color:var(--blue-light); font-size:0.8rem; font-family:Orbitron;">${item.item_name}</div>
                    <div style="color:var(--yellow-accent); font-weight:bold;">${parseInt(item.price_auec).toLocaleString()} aUEC</div>
                </div>
            </div>
        `).join('');
    }

    function showTab(t) {
        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
        document.getElementById('link-'+t).classList.add('active');

        const isMarket = (t === 'market' || t === 'my-items');
        document.getElementById('market-section').style.display = isMarket ? 'block' : 'none';
        document.getElementById('sell-section').style.display = (t === 'sell') ? 'flex' : 'none';
        document.getElementById('sidebar-filter').style.display = isMarket ? 'block' : 'none';
        
        if(t === 'my-items') {
            renderGrid(allItems.filter(i => i.seller_id === currentUser?.id));
        } else if(t === 'market') {
            renderGrid(allItems);
        }
    }

    async function checkAuth() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (session) {
            currentUser = session.user;
            document.getElementById('link-my-items').style.display = 'inline-block';
            document.getElementById('chat-btn').style.display = 'inline-block';
        }
    }

    function processImg(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                uploadedImgBase64 = e.target.result;
                document.getElementById('img-preview').innerHTML = `<img src="${uploadedImgBase64}">`;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    window.onload = () => { fetchMarket(); checkAuth(); };
</script>
</body>
</html>
