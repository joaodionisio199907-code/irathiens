<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHOPYSPACE | GALAXY MARKET</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Barlow+Condensed:wght@700;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --blue-light: #00d2ff;
            --blue-dark: #0056ff;
            --yellow-accent: #ffb800;
            --yellow-bright: #ffe600;
            --bg-deep: #050a12;
            --bg-card: #0e1621;
            --text-white: #ffffff;
            --grad-blue: linear-gradient(90deg, #00d2ff 0%, #0056ff 100%);
            --font-main: 'Rajdhani', sans-serif;
            --font-logo: 'Orbitron', sans-serif;
            --font-impact: 'Barlow Condensed', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --danger: #ff4d4d;
        }

        ::-webkit-scrollbar { display: none; }
        
        body { 
            margin: 0; background-color: var(--bg-deep); color: var(--text-white);
            font-family: var(--font-main); overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #102a4d 0%, var(--bg-deep) 80%);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        nav {
            background: rgba(0, 0, 0, 0.95); border-bottom: 2px solid var(--blue-light);
            padding: 0 15px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(15px); height: 70px;
        }

        .logo-wrapper { height: 100%; display: flex; align-items: center; cursor: pointer; }
        .logo-img { max-height: 90px; filter: drop-shadow(0 0 8px var(--blue-light)); }

        .nav-controls { display: flex; align-items: center; }
        .nav-links { display: flex; gap: 8px; align-items: center; }
        .nav-links a { 
            color: #fff; text-decoration: none; font-family: var(--font-impact); font-size: 0.9rem; 
            cursor: pointer; transition: 0.3s; text-transform: uppercase; font-style: italic;
            padding: 5px 8px;
        }
        .nav-links a.active { color: var(--yellow-accent); border-bottom: 2px solid var(--yellow-accent); }

        #chat-btn {
            display: none; background: rgba(0, 210, 255, 0.1); border: 1px solid var(--blue-light);
            color: var(--blue-light); padding: 6px 10px; border-radius: 4px; align-items: center;
            gap: 5px; text-decoration: none; font-family: var(--font-impact); font-size: 0.85rem;
            transition: 0.3s;
        }

        .marketplace-wrapper { max-width: 1400px; margin: 10px auto; padding: 0 15px; display: grid; grid-template-columns: 200px 1fr; gap: 20px; }

        .sidebar { background: var(--bg-card); padding: 15px; border-radius: 0 15px 0 15px; border-left: 4px solid var(--blue-light); height: fit-content; position: sticky; top: 90px; }

        .cat-item { display: block; padding: 12px; color: #8899af; text-decoration: none; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: 0.2s; margin-bottom: 5px; border-radius: 4px; }
        .cat-item.active { background: var(--grad-blue); color: white; clip-path: polygon(0 0, 100% 0, 95% 100%, 0 100%); }

        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 15px; }

        .item-card { background: var(--bg-card); border: 1px solid #1a2635; border-radius: 0 12px 0 12px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; position: relative; transition: transform 0.2s; }
        .item-card img { width: 100%; height: 150px; object-fit: cover; border-bottom: 1px solid #1a2635; }
        .item-card-info { padding: 12px; }
        .item-card-info h3 { margin: 0; font-size: 0.8rem; color: var(--blue-light); font-family: var(--font-logo); line-height: 1.2; height: 2.4em; overflow: hidden; }

        /* Controles de gestión */
        .mgmt-controls { position: absolute; top: 5px; right: 5px; display: flex; gap: 5px; z-index: 10; }
        .btn-mgmt { border: none; padding: 6px; border-radius: 4px; cursor: pointer; color: white; font-size: 12px; font-weight: bold; }
        .btn-del { background: var(--danger); }
        .btn-edit { background: var(--blue-dark); }

        /* Formulario de Venta Mejorado */
        #publish-container { background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid #1a2635; max-width: 600px; margin: 0 auto; }
        .search-bar { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid #1a2635; padding: 14px; color: white; margin-bottom: 12px; border-radius: 8px; box-sizing: border-box; font-family: var(--font-main); font-size: 1rem; }
        .action-btn { background: var(--grad-blue); border: none; padding: 15px; color: #fff; font-family: var(--font-impact); font-size: 1.1rem; cursor: pointer; text-transform: uppercase; font-style: italic; clip-path: polygon(4% 0, 100% 0, 96% 100%, 0 100%); width: 100%; margin-bottom: 10px; }
        
        #img-preview img { width: 100%; height: 200px; object-fit: contain; margin-bottom: 15px; border: 1px dashed var(--blue-light); border-radius: 8px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 10px; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--blue-light); width: 100%; max-width: 500px; border-radius: 15px; overflow-y: auto; max-height: 90vh; }

        @media (max-width: 768px) {
            .marketplace-wrapper { grid-template-columns: 1fr; margin-top: 0; }
            .sidebar { position: sticky; top: 70px; display: flex; overflow-x: auto; border-left: none; border-bottom: 1px solid var(--blue-light); background: var(--bg-deep); border-radius: 0; margin: 0 -15px 15px -15px; z-index: 900; padding: 10px; }
            .cat-item { white-space: nowrap; margin-bottom: 0; padding: 8px 15px; }
            .market-grid { grid-template-columns: repeat(2, 1fr); }
            #publish-container { margin: 10px; padding: 15px; }
        }
    </style>
</head>
<body>

<nav>
    <div class="logo-wrapper" onclick="location.reload()">
        <img src="img/Shopy.png" class="logo-img" onclick="window.location.href='https://www.irathiens.org/ShopySpaceStarCitizen'">
    </div>
    <div class="nav-controls">
        <div class="nav-links">
            <a onclick="showTab('market')" id="link-market" class="active">MARKET</a>
            <a onclick="showTab('sell')" id="link-sell">SELL</a>
            <a onclick="showTab('my-items')" id="link-my-items" style="display:none;">MY ASSETS</a>
            <a href="Chats.html" id="chat-btn">CHATS</a>
        </div>
    </div>
</nav>

<div class="marketplace-wrapper">
    <aside class="sidebar" id="sidebar-filter">
        <a class="cat-item active" onclick="filterByCategory('all', this)">ALL</a>
        <a class="cat-item" onclick="filterByCategory('Armor', this)">ARMOR</a>
        <a class="cat-item" onclick="filterByCategory('Weapons', this)">WEAPONS</a>
        <a class="cat-item" onclick="filterByCategory('Ships', this)">SHIPS</a>
        <a class="cat-item" onclick="filterByCategory('Medical', this)">MEDICAL</a>
    </aside>

    <main>
        <section id="market">
            <input type="text" id="main-search" class="search-bar" placeholder="SEARCH ASSET..." oninput="handleGlobalSearch()">
            <h2 id="view-title" style="display:none; color: var(--blue-light); font-family: var(--font-impact); margin-bottom: 15px; text-align: center;">YOUR INVENTORY</h2>
            <div id="market-grid" class="market-grid"></div>
        </section>

        <section id="sell" style="display:none;">
            <div id="publish-container">
                <h2 id="form-title" style="color: var(--blue-light); font-family: var(--font-impact); margin:0 0 15px 0;">NEW MANIFEST</h2>
                <input type="hidden" id="edit-item-id">
                
                <input type="text" id="item-name" class="search-bar" placeholder="ITEM NAME">
                <select id="item-cat" class="search-bar">
                    <option value="Armor">ARMOR</option>
                    <option value="Weapons">WEAPONS</option>
                    <option value="Ships">SHIPS</option>
                    <option value="Medical">MEDICAL</option>
                </select>
                <input type="text" id="item-location" class="search-bar" placeholder="LOCATION">
                <input type="number" id="item-price" class="search-bar" placeholder="PRICE aUEC">
                <textarea id="item-desc" class="search-bar" placeholder="ITEM DESCRIPTION" style="height: 80px;"></textarea>
                
                <div id="img-preview"></div>
                <button class="action-btn" onclick="document.getElementById('file-input').click()" style="background:#1a2635; font-size: 0.9rem;">CHANGE IMAGE</button>
                <input type="file" id="file-input" hidden onchange="processImg(this)">
                
                <button class="action-btn" id="btn-publish" onclick="uploadToNet()" style="background:var(--yellow-accent); color:#000;">PUBLISH ASSET</button>
                <button class="action-btn" id="btn-cancel-edit" onclick="resetForm(); showTab('my-items');" style="display:none; background:transparent; border:1px solid #444; clip-path:none;">CANCEL</button>
            </div>
        </section>
    </main>
</div>

<div class="modal-overlay" id="item-modal" onclick="if(event.target == this) closeModal()">
    <div class="modal-content">
        <div class="modal-img-side"><img id="m-img" src="" style="width: 100%"></div>
        <div class="modal-info-side" style="padding: 20px;">
            <h2 id="m-title" style="margin:0; font-family: var(--font-logo); color: var(--blue-light);"></h2>
            <div id="m-price" style="font-size: 1.5rem; color: var(--yellow-bright); margin: 10px 0;"></div>
            <p style="font-size: 0.8rem; color: #8899af;">LOCATION: <span id="m-loc" style="color:white"></span></p>
            <button class="action-btn" id="m-btn">OPEN DETAILS</button>
            <button class="action-btn" onclick="closeModal()" style="background:transparent; border:1px solid #444; clip-path:none;">CLOSE</button>
        </div>
    </div>
</div>

<script>
    const SB_URL = 'https://dfizvgagofsctgwzksgd.supabase.co';
    const SB_KEY = 'sb_publishable_3iByg_zBXp4C-SCtfeIiDw_NeyfB3wR';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let allItems = [];
    let currentUser = null;
    let currentTab = 'market';
    let uploadedImgBase64 = null;

    async function fetchMarket() {
        const { data, error } = await _supabase.from('marketplace_items').select(`*, item_likes (id), item_reviews (rating)`).order('created_at', {ascending: false});
        if (!error) { 
            allItems = data.map(item => {
                const totalRating = item.item_reviews?.reduce((acc, r) => acc + r.rating, 0) || 0;
                const avg = item.item_reviews?.length ? (totalRating / item.item_reviews.length).toFixed(1) : 0;
                return { ...item, likes_count: item.item_likes?.length || 0, avg_rating: avg };
            });
            updateView();
        }
    }

    function updateView() {
        if (currentTab === 'my-items') {
            renderItems(allItems.filter(i => i.seller_id === currentUser?.id));
        } else {
            renderItems(allItems);
        }
    }

    function renderItems(list) {
        const grid = document.getElementById('market-grid');
        grid.innerHTML = "";
        list.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.onclick = () => openDetails(item);
            
            let mgmt = "";
            if(currentTab === 'my-items' && currentUser && item.seller_id === currentUser.id) {
                mgmt = `
                    <div class="mgmt-controls">
                        <button class="btn-mgmt btn-edit" onclick="event.stopPropagation(); prepareEdit('${item.id}')">EDIT</button>
                        <button class="btn-mgmt btn-del" onclick="event.stopPropagation(); deleteAsset('${item.id}')">DEL</button>
                    </div>`;
            }

            card.innerHTML = `
                ${mgmt}
                <img src="${item.image_1 || 'https://via.placeholder.com/400x200'}" loading="lazy">
                <div class="item-card-info">
                    <h3>${item.item_name.toUpperCase()}</h3>
                    <div class="price-tag">${parseInt(item.price_auec).toLocaleString()} aUEC</div>
                </div>`;
            grid.appendChild(card);
        });
    }

    // GESTIÓN DE IMAGEN
    function processImg(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                uploadedImgBase64 = e.target.result;
                document.getElementById('img-preview').innerHTML = `<img src="${uploadedImgBase64}">`;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // EDITAR
    function prepareEdit(id) {
        const item = allItems.find(i => i.id === id);
        if (!item) return;

        document.getElementById('edit-item-id').value = item.id;
        document.getElementById('item-name').value = item.item_name;
        document.getElementById('item-cat').value = item.category;
        document.getElementById('item-location').value = item.location;
        document.getElementById('item-price').value = item.price_auec;
        document.getElementById('item-desc').value = item.description || "";
        
        uploadedImgBase64 = item.image_1;
        document.getElementById('img-preview').innerHTML = `<img src="${item.image_1 || ''}">`;

        document.getElementById('form-title').innerText = "UPDATE ASSET";
        document.getElementById('btn-publish').innerText = "SAVE CHANGES";
        document.getElementById('btn-publish').style.background = "var(--blue-light)";
        document.getElementById('btn-cancel-edit').style.display = "block";

        showTab('sell');
    }

    function resetForm() {
        document.getElementById('edit-item-id').value = "";
        document.getElementById('item-name').value = "";
        document.getElementById('item-price').value = "";
        document.getElementById('item-location').value = "";
        document.getElementById('item-desc').value = "";
        document.getElementById('img-preview').innerHTML = "";
        uploadedImgBase64 = null;
        document.getElementById('form-title').innerText = "NEW MANIFEST";
        document.getElementById('btn-publish').innerText = "PUBLISH ASSET";
        document.getElementById('btn-publish').style.background = "var(--yellow-accent)";
        document.getElementById('btn-cancel-edit').style.display = "none";
    }

    async function uploadToNet() {
        if(!currentUser) return alert("LOG IN REQUIRED");
        const editId = document.getElementById('edit-item-id').value;
        const payload = {
            item_name: document.getElementById('item-name').value,
            category: document.getElementById('item-cat').value,
            location: document.getElementById('item-location').value,
            price_auec: document.getElementById('item-price').value,
            description: document.getElementById('item-desc').value,
            image_1: uploadedImgBase64,
            seller_id: currentUser.id
        };

        let res;
        if (editId) {
            res = await _supabase.from('marketplace_items').update(payload).eq('id', editId);
        } else {
            res = await _supabase.from('marketplace_items').insert([payload]);
        }

        if (!res.error) {
            alert(editId ? "MANIFEST UPDATED" : "ASSET PUBLISHED");
            resetForm();
            await fetchMarket();
            showTab(editId ? 'my-items' : 'market');
        } else {
            alert("ERROR: " + res.error.message);
        }
    }

    async function deleteAsset(id) {
        if (confirm("TERMINATE THIS LISTING?")) {
            const { error } = await _supabase.from('marketplace_items').delete().eq('id', id);
            if (!error) { fetchMarket(); }
        }
    }

    function showTab(t) {
        currentTab = t;
        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
        document.getElementById('market').style.display = (t === 'market' || t === 'my-items') ? 'block' : 'none';
        document.getElementById('sell').style.display = (t === 'sell') ? 'block' : 'none';
        document.getElementById('sidebar-filter').style.display = (t === 'market') ? 'block' : 'none';
        document.getElementById('main-search').style.display = (t === 'market') ? 'block' : 'none';
        document.getElementById('view-title').style.display = (t === 'my-items') ? 'block' : 'none';

        if (t === 'market') document.getElementById('link-market').classList.add('active');
        if (t === 'sell') document.getElementById('link-sell').classList.add('active');
        if (t === 'my-items') document.getElementById('link-my-items').classList.add('active');
        updateView();
    }

    async function checkAuth() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (session) {
            currentUser = session.user;
            document.getElementById('chat-btn').style.display = 'flex';
            document.getElementById('link-my-items').style.display = 'inline-block';
        }
    }

    function handleGlobalSearch() {
        const q = document.getElementById('main-search').value.toLowerCase();
        renderItems(allItems.filter(i => i.item_name.toLowerCase().includes(q)));
    }

    function filterByCategory(cat, el) {
        document.querySelectorAll('.cat-item').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        renderItems(cat === 'all' ? allItems : allItems.filter(i => i.category === cat));
    }

    function openDetails(item) {
        document.getElementById('m-title').innerText = item.item_name;
        document.getElementById('m-price').innerText = parseInt(item.price_auec).toLocaleString() + " aUEC";
        document.getElementById('m-img').src = item.image_1 || '';
        document.getElementById('m-loc').innerText = item.location;
        document.getElementById('item-modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('item-modal').style.display = 'none'; }

    window.onload = () => { fetchMarket(); checkAuth(); };
</script>
</body>
</html>
