<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHOPYSPACE | GALAXY MARKET</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Barlow+Condensed:wght@700;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --blue-light: #00d2ff;
            --blue-dark: #0056ff;
            --yellow-accent: #ffb800;
            --yellow-bright: #ffe600;
            --bg-deep: #050a12;
            --bg-card: #0e1621;
            --text-white: #ffffff;
            --grad-blue: linear-gradient(90deg, #00d2ff 0%, #0056ff 100%);
            --font-main: 'Rajdhani', sans-serif;
            --font-impact: 'Barlow Condensed', sans-serif;
            --danger: #ff4d4d;
        }

        ::-webkit-scrollbar { display: none; }
        body { margin: 0; background-color: var(--bg-deep); color: var(--text-white); font-family: var(--font-main); overflow-x: hidden; min-height: 100vh; }

        nav {
            background: rgba(0, 0, 0, 0.95); border-bottom: 2px solid var(--blue-light);
            padding: 0 15px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; height: 70px;
        }

        .nav-links { display: flex; gap: 10px; align-items: center; }
        .nav-links a { color: #fff; text-decoration: none; font-family: var(--font-impact); font-size: 0.9rem; cursor: pointer; padding: 6px 12px; border-radius: 4px; text-transform: uppercase; }
        
        /* Estilo resaltado para MY ASSETS */
        #link-my-items.active { 
            background: rgba(255, 184, 0, 0.15); 
            color: var(--yellow-bright); 
            border: 1px solid var(--yellow-accent);
            box-shadow: 0 0 10px rgba(255, 184, 0, 0.3);
        }
        .nav-links a.active:not(#link-my-items) { color: var(--blue-light); border-bottom: 2px solid var(--blue-light); }

        .marketplace-wrapper { max-width: 1400px; margin: 15px auto; padding: 0 15px; display: grid; grid-template-columns: 200px 1fr; gap: 20px; }

        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }

        .item-card { background: var(--bg-card); border: 1px solid #1a2635; border-radius: 0 12px 0 12px; overflow: hidden; position: relative; transition: 0.3s; cursor: pointer; }
        .item-card img { width: 100%; height: 140px; object-fit: cover; }
        .item-card-info { padding: 10px; }
        .item-card-info h3 { margin: 0; font-size: 0.8rem; color: var(--blue-light); height: 2.4em; overflow: hidden; }

        /* Controles de Gestión */
        .mgmt-layer { position: absolute; top: 5px; right: 5px; display: flex; gap: 5px; z-index: 100; }
        .btn-mgmt { border: none; padding: 6px 10px; border-radius: 4px; color: white; font-size: 10px; font-weight: bold; cursor: pointer; }
        .btn-edit { background: var(--blue-dark); box-shadow: 0 0 8px rgba(0, 86, 255, 0.5); }
        .btn-del { background: var(--danger); box-shadow: 0 0 8px rgba(255, 77, 77, 0.5); }

        #publish-container { background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--blue-light); max-width: 500px; margin: 0 auto; }
        .search-bar { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid #1a2635; padding: 12px; color: white; margin-bottom: 10px; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        .action-btn { background: var(--grad-blue); border: none; padding: 14px; color: #fff; font-family: var(--font-impact); font-size: 1.1rem; cursor: pointer; width: 100%; margin-bottom: 8px; clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%); }
        
        #img-preview img { width: 100%; height: 180px; object-fit: contain; margin-bottom: 10px; border: 1px dashed var(--blue-light); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--blue-light); width: 90%; max-width: 400px; border-radius: 15px; overflow: hidden; padding: 20px; }

        @media (max-width: 768px) {
            .marketplace-wrapper { grid-template-columns: 1fr; }
            .market-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<nav>
    <div class="logo-wrapper" onclick="window.location.reload()">
        <img src="img/Shopy.png" style="max-height: 80px;">
    </div>
    <div class="nav-links">
        <a onclick="showTab('market')" id="link-market" class="active">MARKET</a>
        <a onclick="showTab('sell')" id="link-sell">SELL</a>
        <a onclick="showTab('my-items')" id="link-my-items" style="display:none;">MY ASSETS</a>
    </div>
</nav>

<div class="marketplace-wrapper">
    <main style="grid-column: 1 / -1;">
        <section id="market">
            <input type="text" id="main-search" class="search-bar" placeholder="SEARCH ASSET..." oninput="handleSearch()">
            <div id="market-grid" class="market-grid"></div>
        </section>

        <section id="sell" style="display:none;">
            <div id="publish-container">
                <h2 id="form-title" style="color: var(--blue-light); margin-top:0;">NEW MANIFEST</h2>
                <input type="hidden" id="edit-item-id">
                <input type="text" id="item-name" class="search-bar" placeholder="ITEM NAME">
                <input type="text" id="item-location" class="search-bar" placeholder="LOCATION">
                <input type="number" id="item-price" class="search-bar" placeholder="PRICE aUEC">
                <textarea id="item-desc" class="search-bar" placeholder="DESCRIPTION" style="height: 60px;"></textarea>
                
                <div id="img-preview"></div>
                <button class="action-btn" onclick="document.getElementById('file-input').click()" style="background:#1a2635; font-size: 0.8rem;">SELECT IMAGE</button>
                <input type="file" id="file-input" hidden onchange="processImg(this)">
                
                <button class="action-btn" id="btn-publish" onclick="uploadToNet()" style="background:var(--yellow-accent); color:#000;">PUBLISH</button>
                <button class="action-btn" id="btn-cancel" onclick="resetForm(); showTab('my-items')" style="display:none; background:transparent; border:1px solid #444;">CANCEL</button>
            </div>
        </section>
    </main>
</div>

<div class="modal-overlay" id="item-modal" onclick="if(event.target == this) closeModal()">
    <div class="modal-content">
        <h2 id="m-title" style="color: var(--blue-light); margin:0;"></h2>
        <p id="m-price" style="color: var(--yellow-bright); font-size: 1.4rem;"></p>
        <button class="action-btn" id="m-btn">OPEN DETAILS</button>
        <button class="action-btn" onclick="closeModal()" style="background:transparent; border:1px solid #444;">CLOSE</button>
    </div>
</div>

<script>
    const SB_URL = 'https://dfizvgagofsctgwzksgd.supabase.co';
    const SB_KEY = 'sb_publishable_3iByg_zBXp4C-SCtfeIiDw_NeyfB3wR';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let allItems = [];
    let currentUser = null;
    let currentTab = 'market';
    let uploadedImgBase64 = null;

    async function fetchMarket() {
        const { data, error } = await _supabase.from('marketplace_items').select('*').order('created_at', {ascending: false});
        if (!error) { allItems = data; render(); }
    }

    function render(list = null) {
        const grid = document.getElementById('market-grid');
        grid.innerHTML = "";
        const itemsToRender = list || (currentTab === 'my-items' ? allItems.filter(i => i.seller_id === currentUser?.id) : allItems);

        itemsToRender.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            
            // CONTROLES DE GESTIÓN (Aislados)
            let mgmt = "";
            if(currentTab === 'my-items' && currentUser && item.seller_id === currentUser.id) {
                mgmt = `
                    <div class="mgmt-layer">
                        <button class="btn-mgmt btn-edit" data-id="${item.id}">EDIT</button>
                        <button class="btn-mgmt btn-del" data-id="${item.id}">DEL</button>
                    </div>`;
            }

            card.innerHTML = `
                ${mgmt}
                <img src="${item.image_1 || ''}">
                <div class="item-card-info">
                    <h3>${item.item_name}</h3>
                    <div style="color: var(--yellow-bright); font-weight: bold;">${parseInt(item.price_auec).toLocaleString()} aUEC</div>
                </div>`;

            // EVENTOS DE CLIC (IMPORTANTE)
            card.addEventListener('click', (e) => {
                const editBtn = e.target.closest('.btn-edit');
                const delBtn = e.target.closest('.btn-del');

                if (editBtn) {
                    const id = editBtn.getAttribute('data-id');
                    handleEdit(id);
                } else if (delBtn) {
                    const id = delBtn.getAttribute('data-id');
                    handleDelete(id);
                } else {
                    openDetails(item);
                }
            });

            grid.appendChild(card);
        });
    }

    // FUNCIÓN DE EDICIÓN (RE-ESTRUCTURADA)
    function handleEdit(id) {
        const item = allItems.find(i => i.id === id);
        if (!item) return;

        // Forzar limpieza y carga
        document.getElementById('edit-item-id').value = item.id;
        document.getElementById('item-name').value = item.item_name;
        document.getElementById('item-location').value = item.location || "";
        document.getElementById('item-price').value = item.price_auec;
        document.getElementById('item-desc').value = item.description || "";
        
        uploadedImgBase64 = item.image_1;
        document.getElementById('img-preview').innerHTML = item.image_1 ? `<img src="${item.image_1}">` : "";

        // UI
        document.getElementById('form-title').innerText = "UPDATE ASSET";
        document.getElementById('btn-publish').innerText = "SAVE CHANGES";
        document.getElementById('btn-publish').style.background = "var(--blue-light)";
        document.getElementById('btn-cancel').style.display = "block";

        showTab('sell');
    }

    async function handleDelete(id) {
        if (confirm("DELETE THIS ASSET?")) {
            const { error } = await _supabase.from('marketplace_items').delete().eq('id', id);
            if (!error) fetchMarket();
        }
    }

    async function uploadToNet() {
        if(!currentUser) return;
        const editId = document.getElementById('edit-item-id').value;
        const payload = {
            item_name: document.getElementById('item-name').value,
            location: document.getElementById('item-location').value,
            price_auec: document.getElementById('item-price').value,
            description: document.getElementById('item-desc').value,
            image_1: uploadedImgBase64,
            seller_id: currentUser.id
        };

        let res;
        if (editId) {
            res = await _supabase.from('marketplace_items').update(payload).eq('id', editId);
        } else {
            res = await _supabase.from('marketplace_items').insert([payload]);
        }

        if (!res.error) {
            alert("SUCCESS");
            resetForm();
            await fetchMarket();
            showTab(editId ? 'my-items' : 'market');
        }
    }

    function showTab(t) {
        currentTab = t;
        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
        document.getElementById('link-' + t).classList.add('active');
        
        document.getElementById('market').style.display = (t === 'market' || t === 'my-items') ? 'block' : 'none';
        document.getElementById('sell').style.display = (t === 'sell') ? 'block' : 'none';
        render();
    }

    function resetForm() {
        document.getElementById('edit-item-id').value = "";
        document.getElementById('item-name').value = "";
        document.getElementById('item-price').value = "";
        document.getElementById('img-preview').innerHTML = "";
        document.getElementById('form-title').innerText = "NEW MANIFEST";
        document.getElementById('btn-publish').innerText = "PUBLISH";
        document.getElementById('btn-publish').style.background = "var(--yellow-accent)";
        document.getElementById('btn-cancel').style.display = "none";
        uploadedImgBase64 = null;
    }

    function processImg(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                uploadedImgBase64 = e.target.result;
                document.getElementById('img-preview').innerHTML = `<img src="${uploadedImgBase64}">`;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function openDetails(item) {
        document.getElementById('m-title').innerText = item.item_name;
        document.getElementById('m-price').innerText = parseInt(item.price_auec).toLocaleString() + " aUEC";
        document.getElementById('m-btn').onclick = () => window.location.href = `item.html?id=${item.id}`;
        document.getElementById('item-modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('item-modal').style.display = 'none'; }

    async function checkAuth() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (session) {
            currentUser = session.user;
            document.getElementById('link-my-items').style.display = 'inline-block';
        }
    }

    window.onload = () => { fetchMarket(); checkAuth(); };
</script>
</body>
</html>
