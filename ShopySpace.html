<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHOPYSPACE | GALAXY MARKET</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Barlow+Condensed:wght@700;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --blue-light: #00d2ff;
            --blue-dark: #0056ff;
            --yellow-accent: #ffb800;
            --yellow-bright: #ffe600;
            --bg-deep: #050a12;
            --bg-card: #0e1621;
            --text-white: #ffffff;
            --grad-blue: linear-gradient(90deg, #00d2ff 0%, #0056ff 100%);
            --font-main: 'Rajdhani', sans-serif;
            --font-logo: 'Orbitron', sans-serif;
            --font-impact: 'Barlow Condensed', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        /* Ocultar barras de scroll globalmente */
        ::-webkit-scrollbar { display: none; }
        body { 
            -ms-overflow-style: none; scrollbar-width: none; 
            margin: 0; background-color: var(--bg-deep); color: var(--text-white);
            font-family: var(--font-main); overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #102a4d 0%, var(--bg-deep) 80%);
            min-height: 100vh;
        }

        /* --- NAVEGACIÓN --- */
        nav {
            background: rgba(0, 0, 0, 0.9); border-bottom: 2px solid var(--blue-light);
            padding: 0 40px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(15px); height: 110px;
        }

        .logo-wrapper { height: 100%; display: flex; align-items: center; cursor: pointer; }
        .logo-img { 
            max-height: 95px; 
            filter: drop-shadow(0 0 10px var(--blue-light)); 
            transition: 0.3s;
        }

        .nav-controls { display: flex; align-items: center; gap: 20px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { 
            color: #fff; text-decoration: none; font-family: var(--font-impact); font-size: 1.2rem; 
            cursor: pointer; transition: 0.3s; text-transform: uppercase; font-style: italic;
        }
        .nav-links a.active { color: var(--yellow-accent); border-bottom: 2px solid var(--yellow-accent); }

        /* --- CUERPO --- */
        .marketplace-wrapper {
            display: grid; grid-template-columns: 250px 1fr; gap: 30px;
            max-width: 1400px; margin: 30px auto; padding: 0 20px;
        }

        .sidebar {
            background: var(--bg-card); padding: 20px; border-radius: 0 20px 0 20px;
            border-left: 4px solid var(--blue-light); height: fit-content; position: sticky; top: 140px;
        }

        .cat-item {
            display: block; padding: 12px; color: #8899af; text-decoration: none;
            font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.3s;
            clip-path: polygon(0 0, 100% 0, 90% 100%, 0 100%); margin-bottom: 5px;
        }
        .cat-item.active { background: var(--grad-blue); color: white; }

        /* --- GRID DE PRODUCTOS --- */
        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .item-card {
            background: var(--bg-card); border: 1px solid #1a2635; transition: 0.3s;
            cursor: pointer; border-radius: 0 15px 0 15px; overflow: hidden;
        }
        .item-card:hover { transform: translateY(-5px); border-color: var(--blue-light); }
        .item-card img { width: 100%; height: 180px; object-fit: cover; }
        .item-card-info { padding: 15px; }
        .price-tag { color: var(--yellow-bright); font-family: var(--font-mono); font-weight: bold; font-size: 1.2rem; }

        /* --- MODAL (DETALLES RÁPIDOS) --- */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.92); display: none; justify-content: center; 
            align-items: center; z-index: 2000; backdrop-filter: blur(10px);
        }
        .modal-content { 
            background: var(--bg-card); border: 2px solid var(--blue-light); 
            width: 95%; max-width: 800px; display: grid; grid-template-columns: 1fr 1fr; 
            position: relative; border-radius: 0 30px 0 30px; max-height: 90vh; overflow-y: auto;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .modal-content::-webkit-scrollbar { display: none; }

        .modal-img-side { background: #000; display: flex; align-items: center; justify-content: center; }
        .modal-img-side img { width: 100%; height: auto; }
        .modal-info-side { padding: 30px; display: flex; flex-direction: column; gap: 15px; }
        .modal-close { position: absolute; top: 15px; right: 20px; color: var(--yellow-accent); cursor: pointer; font-family: var(--font-logo); font-weight: bold; z-index: 10; }

        /* --- RESPONSIVE --- */
        @media (max-width: 850px) {
            nav { height: 90px; padding: 0 15px; }
            .logo-img { max-height: 65px; }
            .marketplace-wrapper { grid-template-columns: 1fr; }
            .sidebar { 
                position: sticky; top: 90px; z-index: 900; display: flex; 
                overflow-x: auto; padding: 10px; gap: 10px; border-left: none; 
                border-bottom: 2px solid var(--blue-light); background: var(--bg-deep);
            }
            .modal-content { grid-template-columns: 1fr; }
        }

        /* --- BOTONES / INPUTS --- */
        .search-bar { width: 100%; background: #000; border: 1px solid #1a2635; padding: 15px; color: white; margin-bottom: 20px; box-sizing: border-box; }
        .action-btn {
            background: var(--grad-blue); border: none; padding: 15px; color: #fff;
            font-family: var(--font-impact); font-size: 1.1rem; cursor: pointer;
            text-transform: uppercase; font-style: italic; clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
        }
    </style>
</head>
<body>

<nav>
    <div class="logo-wrapper" onclick="location.reload()">
        <img src="img/Shopy.png" alt="SHOPYSPACE" class="logo-img">
    </div>
    <div class="nav-controls">
        <div class="nav-links">
            <a onclick="showTab('market')" id="link-market" class="active">MARKET</a>
            <a onclick="showTab('sell')" id="link-sell">SELL</a>
        </div>
    </div>
</nav>

<div class="marketplace-wrapper">
    <aside class="sidebar">
        <a class="cat-item active" onclick="filterByCategory('all', this)">ALL</a>
        <a class="cat-item" onclick="filterByCategory('Armor', this)">ARMOR</a>
        <a class="cat-item" onclick="filterByCategory('Weapons', this)">WEAPONS</a>
        <a class="cat-item" onclick="filterByCategory('Ships', this)">SHIPS</a>
        <a class="cat-item" onclick="filterByCategory('Medical', this)">MEDICAL</a>
    </aside>

    <main>
        <section id="market">
            <input type="text" id="main-search" class="search-bar" placeholder="SEARCH SYSTEM..." oninput="handleGlobalSearch()">
            <div id="market-grid" class="market-grid"></div>
        </section>

        <section id="sell" style="display:none;">
            <div style="max-width: 500px; margin: auto; background: var(--bg-card); padding: 30px; border-radius: 0 20px 0 20px;">
                <h2 style="color: var(--yellow-accent); font-family: var(--font-impact);">NEW MANIFEST</h2>
                <input type="text" id="item-name" class="search-bar" placeholder="ITEM NAME">
                <select id="item-cat" class="search-bar">
                    <option value="Armor">ARMOR</option>
                    <option value="Weapons">WEAPONS</option>
                    <option value="Ships">SHIPS</option>
                    <option value="Medical">MEDICAL</option>
                </select>
                <input type="text" id="item-location" class="search-bar" placeholder="LOCATION">
                <input type="number" id="item-price" class="search-bar" placeholder="PRICE aUEC">
                <button class="action-btn" onclick="document.getElementById('file-input').click()" style="width:100%; background:#1a2635; margin-bottom:10px;">SELECT IMAGE</button>
                <input type="file" id="file-input" hidden onchange="processImg(this)">
                <div id="img-preview" style="text-align:center"></div>
                <button class="action-btn" onclick="uploadToNet()" style="background:var(--yellow-accent); color:#000; width:100%">PUBLISH</button>
            </div>
        </section>
    </main>
</div>

<div class="modal-overlay" id="item-modal" onclick="if(event.target == this) closeModal()">
    <div class="modal-content">
        <div class="modal-close" onclick="closeModal()">[X]</div>
        <div class="modal-img-side"><img id="m-img" src=""></div>
        <div class="modal-info-side">
            <h2 id="m-title" style="margin:0; font-family: var(--font-logo); color: var(--blue-light);"></h2>
            <div id="m-price" style="font-size: 2rem; color: var(--yellow-bright); font-family: var(--font-mono);"></div>
            <div style="font-size: 0.9rem; border-top: 1px solid #333; padding-top: 10px;">
                <p>SECTOR: <span id="m-cat" style="color:var(--blue-light)"></span></p>
                <p>LOCATION: <span id="m-loc" style="color:var(--blue-light)"></span></p>
            </div>
            <button class="action-btn" style="margin-top:auto">CONTACT SELLER</button>
        </div>
    </div>
</div>

<script>
    const SB_URL = 'https://dfizvgagofsctgwzksgd.supabase.co';
    const SB_KEY = 'sb_publishable_3iByg_zBXp4C-SCtfeIiDw_NeyfB3wR';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let allItems = [];
    let uploadedImgBase64 = null;

    window.onload = () => fetchMarket();

    async function fetchMarket() {
        const { data, error } = await _supabase.from('marketplace_items').select('*').order('created_at', {ascending: false});
        if (!error) { allItems = data; renderItems(data); }
    }

    function renderItems(list) {
        const grid = document.getElementById('market-grid');
        grid.innerHTML = "";
        list.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.onclick = () => openDetails(item);
            card.innerHTML = `
                <img src="${item.image_1 || 'https://via.placeholder.com/400x200'}">
                <div class="item-card-info">
                    <h3 style="margin:0; font-size:0.85rem; font-family:var(--font-logo); color:var(--blue-light)">${item.item_name.toUpperCase()}</h3>
                    <div class="price-tag">${parseInt(item.price_auec).toLocaleString()} aUEC</div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function openDetails(item) {
        document.getElementById('m-title').innerText = item.item_name.toUpperCase();
        document.getElementById('m-price').innerText = parseInt(item.price_auec).toLocaleString() + " aUEC";
        document.getElementById('m-img').src = item.image_1 || '';
        document.getElementById('m-cat').innerText = (item.category || 'GENERAL').toUpperCase();
        document.getElementById('m-loc').innerText = (item.location || 'UNKNOWN').toUpperCase();
        
        // ACCIÓN: Redirigir a la página de detalles individual
        const contactBtn = document.querySelector('#item-modal .action-btn');
        contactBtn.onclick = () => {
            window.location.href = `item.html?id=${item.id}`;
        };

        document.getElementById('item-modal').style.display = 'flex';
        document.body.style.overflow = 'hidden'; 
    }

    function closeModal() { 
        document.getElementById('item-modal').style.display = 'none'; 
        document.body.style.overflow = 'auto';
    }

    function showTab(t) {
        document.getElementById('market').style.display = (t === 'market') ? 'block' : 'none';
        document.getElementById('sell').style.display = (t === 'sell') ? 'block' : 'none';
        document.getElementById('link-market').classList.toggle('active', t === 'market');
        document.getElementById('link-sell').classList.toggle('active', t === 'sell');
    }

    function processImg(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            uploadedImgBase64 = e.target.result;
            document.getElementById('img-preview').innerHTML = `<img src="${e.target.result}" style="width:80px; height:80px; object-fit:cover; margin-top:10px; border:2px solid var(--blue-light)">`;
        };
        reader.readAsDataURL(input.files[0]);
    }

    async function uploadToNet() {
        if(!uploadedImgBase64) return alert("Select image");
        const payload = {
            item_name: document.getElementById('item-name').value,
            category: document.getElementById('item-cat').value,
            location: document.getElementById('item-location').value,
            price_auec: document.getElementById('item-price').value,
            image_1: uploadedImgBase64,
            status: 'available'
        };
        const { error } = await _supabase.from('marketplace_items').insert([payload]);
        if(error) alert("Error"); else location.reload();
    }

    function handleGlobalSearch() {
        const q = document.getElementById('main-search').value.toLowerCase();
        renderItems(allItems.filter(i => i.item_name.toLowerCase().includes(q)));
    }

    function filterByCategory(cat, el) {
        document.querySelectorAll('.cat-item').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        renderItems(cat === 'all' ? allItems : allItems.filter(i => i.category === cat));
    }
</script>
</body>
</html>
