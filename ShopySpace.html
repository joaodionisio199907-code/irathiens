<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOPYSPACE | STAR CITIZEN MARKET</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Barlow+Condensed:wght@700;900&family=Noto+Sans+JP:wght@700&family=Noto+Sans+SC:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --blue-light: #00d2ff;
            --blue-dark: #0056ff;
            --yellow-accent: #ffb800;
            --yellow-bright: #ffe600;
            --bg-deep: #050a12;
            --bg-card: #0e1621;
            --text-white: #ffffff;
            --grad-blue: linear-gradient(90deg, #00d2ff 0%, #0056ff 100%);
            --font-main: 'Rajdhani', 'Noto Sans JP', 'Noto Sans SC', sans-serif;
            --font-impact: 'Barlow Condensed', sans-serif;
        }

        body {
            margin: 0; background-color: var(--bg-deep); color: var(--text-white);
            font-family: var(--font-main); overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #102a4d 0%, var(--bg-deep) 80%);
        }

        /* --- NAVEGACIÓN CON LOGO --- */
        nav {
            background: rgba(0, 0, 0, 0.95);
            border-bottom: 3px solid;
            border-image: var(--grad-blue) 1;
            padding: 5px 40px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(15px);
            height: 70px; /* Altura fija para control del logo */
        }

        .logo-wrapper {
            height: 100%;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .logo-img {
            max-height: 55px; /* Ajusta según el tamaño de tu imagen */
            width: auto;
            filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.5)); /* Efecto de brillo sutil */
            transition: transform 0.3s ease;
        }

        .logo-img:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 12px rgba(0, 210, 255, 0.8));
        }

        .nav-controls { display: flex; align-items: center; gap: 30px; }
        
        .lang-selector {
            background: #000; border: 1px solid var(--blue-light); color: var(--blue-light);
            padding: 5px 10px; font-family: var(--font-main); font-weight: bold; 
            cursor: pointer; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }

        .nav-links { display: flex; gap: 25px; }

        .nav-links a { 
            color: #fff; text-decoration: none; font-family: var(--font-impact); 
            font-size: 1.2rem; cursor: pointer; transition: 0.3s; 
            text-transform: uppercase; font-style: italic; letter-spacing: 1px;
        }
        .nav-links a:hover { color: var(--blue-light); }
        .nav-links a.active { color: var(--yellow-accent); border-bottom: 2px solid var(--yellow-accent); }

        /* --- RESTO DEL DISEÑO --- */
        .marketplace-wrapper {
            display: grid; grid-template-columns: 280px 1fr; gap: 30px;
            max-width: 1600px; margin: 30px auto; padding: 0 20px;
        }

        .sidebar {
            background: var(--bg-card); padding: 25px; border-radius: 0 20px 0 20px;
            border-left: 4px solid var(--blue-light); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .cat-item {
            display: block; padding: 12px 15px; color: #8899af; text-decoration: none;
            font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.3s;
            clip-path: polygon(0 0, 100% 0, 90% 100%, 0 100%); margin-bottom: 8px;
        }
        .cat-item:hover { background: rgba(0, 210, 255, 0.1); color: #fff; padding-left: 20px; }
        .cat-item.active { background: var(--grad-blue); color: white; }

        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        
        .item-card {
            background: var(--bg-card); border: 1px solid #1a2635; transition: 0.4s;
            cursor: pointer; border-radius: 0 15px 0 15px; overflow: hidden;
            position: relative;
        }
        .item-card:hover { transform: translateY(-10px); border-color: var(--yellow-accent); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .item-card img { width: 100%; height: 200px; object-fit: cover; }
        .item-card-info { padding: 15px; background: linear-gradient(180deg, transparent 0%, #000 100%); }
        .price { color: var(--yellow-bright); font-weight: bold; font-size: 1.3rem; }

        .search-bar {
            width: 100%; background: #000; border: 2px solid #1a2635; padding: 15px;
            color: white; font-size: 1.1rem; border-radius: 5px; margin-bottom: 20px;
            box-sizing: border-box;
        }

        .action-btn {
            background: linear-gradient(90deg, #ffb800, #ffe600); border: none; padding: 15px 30px;
            font-family: var(--font-impact); font-size: 1.2rem; font-weight: 900;
            cursor: pointer; text-transform: uppercase; font-style: italic;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
        }
    </style>
</head>
<body>

<nav>
    <div class="logo-wrapper" onclick="location.reload()">
        <img src="img/Shopy.png" alt="SHOPYSPACE LOGO" class="logo-img">
    </div>

    <div class="nav-controls">
        <div class="nav-links">
            <a onclick="showTab('market')" id="link-market" class="active" data-i18n="nav_market">MARKETPLACE</a>
            <a onclick="showTab('sell')" id="link-sell" data-i18n="nav_sell">PUBLISH ITEM</a>
        </div>
        <select class="lang-selector" onchange="changeLang(this.value)">
            <option value="en">EN</option>
            <option value="es">ES</option>
            <option value="zh">ZH</option>
            <option value="ja">JA</option>
            <option value="ru">RU</option>
        </select>
    </div>
</nav>

<div class="marketplace-wrapper">
    <aside class="sidebar">
        <div style="font-family: 'Orbitron'; font-size: 0.7rem; color: var(--blue-light); margin-bottom: 15px; letter-spacing: 1px;" data-i18n="side_title">NETWORK SECTORS</div>
        <a class="cat-item active" onclick="filterByCategory('all', this)" data-i18n="cat_all">ALL ITEMS</a>
        <a class="cat-item" onclick="filterByCategory('Armor', this)" data-i18n="cat_armor">ARMOR SETS</a>
        <a class="cat-item" onclick="filterByCategory('Weapons', this)" data-i18n="cat_weapons">WEAPONS</a>
        <a class="cat-item" onclick="filterByCategory('Ships', this)" data-i18n="cat_ships">SHIPS</a>
        <a class="cat-item" onclick="filterByCategory('Medical', this)" data-i18n="cat_medical">MEDICAL</a>
    </aside>

    <main>
        <section id="market">
            <input type="text" id="main-search" class="search-bar" data-i18n-placeholder="search_placeholder" oninput="handleGlobalSearch()">
            <div id="market-grid" class="market-grid"></div>
        </section>

        <section id="sell" style="display:none;">
            <div style="max-width:600px; background:var(--bg-card); padding:40px; border-radius: 0 20px 0 20px; border: 1px solid #1a2635; margin: auto;">
                <h2 style="font-family:var(--font-impact); font-style:italic; color:var(--yellow-accent); font-size: 2rem;" data-i18n="sell_title">NEW MANIFEST ENTRY</h2>
                <div style="display: flex; flex-direction: column; gap: 15px;">
                    <input type="text" id="item-name" class="search-bar" data-i18n-placeholder="ph_name" style="margin:0">
                    <input type="number" id="item-price" class="search-bar" data-i18n-placeholder="ph_price" style="margin:0">
                    <button class="action-btn" style="width:100%; margin-top: 10px;" data-i18n="btn_upload">TRANSMIT TO GALAXY NET</button>
                </div>
            </div>
        </section>
    </main>
</div>

<script>
    const i18n = {
        en: {
            nav_market: "MARKETPLACE", nav_sell: "PUBLISH ITEM",
            side_title: "NETWORK SECTORS", cat_all: "ALL ITEMS",
            cat_armor: "ARMOR SETS", cat_weapons: "WEAPONS",
            cat_ships: "SHIPS", cat_medical: "MEDICAL",
            search_placeholder: "SEARCH BY NAME OR SECTOR...",
            sell_title: "NEW MANIFEST ENTRY", ph_name: "ITEM NAME...",
            ph_price: "PRICE (aUEC)...", btn_upload: "TRANSMIT TO GALAXY NET"
        },
        es: {
            nav_market: "MERCADO", nav_sell: "PUBLICAR ITEM",
            side_title: "SECTORES DE RED", cat_all: "TODO EL BOTÍN",
            cat_armor: "ARMADURAS", cat_weapons: "ARMAMENTO",
            cat_ships: "NAVES", cat_medical: "MÉDICO",
            search_placeholder: "BUSCAR POR NOMBRE O SECTOR...",
            sell_title: "NUEVO MANIFIESTO", ph_name: "NOMBRE DEL ITEM...",
            ph_price: "PRECIO (aUEC)...", btn_upload: "TRANSMITIR A LA RED"
        },
        zh: {
            nav_market: "市场", nav_sell: "发布物品",
            side_title: "网络部门", cat_all: "所有物品",
            cat_armor: "护甲套装", cat_weapons: "个人武器",
            cat_ships: "飞船", cat_medical: "医疗用品",
            search_placeholder: "按名称或扇区搜索...",
            sell_title: "新清单条目", ph_name: "物品名称...",
            ph_price: "价格 (aUEC)...", btn_upload: "传输到星系网络"
        },
        ja: {
            nav_market: "マーケット", nav_sell: "アイテムを出品",
            side_title: "ネットワークセクター", cat_all: "全アイテム",
            cat_armor: "アーマーセット", cat_weapons: "武器",
            cat_ships: "シップ", cat_medical: "医療品",
            search_placeholder: "名前またはセクターで検索...",
            sell_title: "新規マニフェスト入力", ph_name: "アイテム名...",
            ph_price: "価格 (aUEC)...", btn_upload: "銀河ネットワークに送信"
        },
        ru: {
            nav_market: "РЫНОК", nav_sell: "ОПУБЛИКОВАТЬ",
            side_title: "СЕТЕВЫЕ СЕКТОРЫ", cat_all: "ВСЕ ПРЕДМЕТЫ",
            cat_armor: "БРОНЯ", cat_weapons: "ОРУЖИЕ",
            cat_ships: "КОРАБЛИ", cat_medical: "МЕДИЦИНА",
            search_placeholder: "ПОИСК ПО ИМЕНИ ИЛИ СЕКТОРУ...",
            sell_title: "НОВАЯ ЗАПИСЬ В МАНИФЕСТЕ", ph_name: "НАЗВАНИЕ...",
            ph_price: "ЦЕНА (aUEC)...", btn_upload: "ПЕРЕДАТЬ В СЕТЬ ГАЛАКТИКИ"
        }
    };

    function changeLang(lang) {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            el.innerText = i18n[lang][el.getAttribute('data-i18n')];
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            el.placeholder = i18n[lang][el.getAttribute('data-i18n-placeholder')];
        });
        document.documentElement.lang = lang;
    }

    function showTab(t) {
        document.getElementById('market').style.display = (t === 'market') ? 'block' : 'none';
        document.getElementById('sell').style.display = (t === 'sell') ? 'block' : 'none';
        document.getElementById('link-market').classList.toggle('active', t === 'market');
        document.getElementById('link-sell').classList.toggle('active', t === 'sell');
    }

    // Inicializar en inglés por defecto
    window.onload = () => changeLang('en');
</script>

</body>
</html>
