<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHOPYSPACE | GALAXY MARKET</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Barlow+Condensed:wght@700;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --blue-light: #00d2ff;
            --blue-dark: #0056ff;
            --yellow-accent: #ffb800;
            --bg-deep: #050a12;
            --bg-card: rgba(14, 22, 33, 0.95);
            --text-white: #ffffff;
            --font-main: 'Rajdhani', sans-serif;
            --font-impact: 'Barlow Condensed', sans-serif;
        }

        /* Base Reset */
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
        ::-webkit-scrollbar { display: none; }
        
        body { 
            background-color: var(--bg-deep); color: var(--text-white); 
            font-family: var(--font-main); overflow-x: hidden; min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #102a4d 0%, var(--bg-deep) 100%);
        }

        /* --- VIDEOS (Solo PC) --- */
        .video-side-container { position: fixed; top: 70px; bottom: 0; width: calc((100vw - 1200px) / 2); z-index: -1; overflow: hidden; opacity: 0.3; display: none; }
        .side-video-element { width: 100%; height: 100%; object-fit: cover; }

        /* --- NAV --- */
        nav { 
            background: rgba(0, 0, 0, 0.95); border-bottom: 2px solid var(--blue-light); 
            padding: 0 15px; display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 1000; height: 70px; backdrop-filter: blur(10px); 
        }
        .logo-img { max-height: 100px; cursor: pointer; }
        .nav-links { display: flex; gap: 10px; }
        .nav-links a { color: #fff; text-decoration: none; font-family: var(--font-impact); font-size: 0.75rem; cursor: pointer; text-transform: uppercase; font-style: italic; }
        .nav-links a.active { color: var(--blue-light); border-bottom: 2px solid var(--blue-light); }

        /* --- ESTRUCTURA --- */
        .main-container { max-width: 1200px; margin: 0 auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }

        /* Sidebar adaptado para móvil por defecto (Scroll horizontal) */
        .sidebar { 
            width: 100%; display: flex; overflow-x: auto; background: var(--bg-card); 
            padding: 10px; border-bottom: 2px solid var(--blue-light); gap: 10px;
            scrollbar-width: none;
        }
        .cat-item { 
            white-space: nowrap; padding: 10px 18px; color: #8899af; cursor: pointer; 
            font-weight: 700; border-radius: 4px; text-transform: uppercase; font-size: 0.8rem; 
        }
        .cat-item.active { background: linear-gradient(90deg, #00d2ff, #0056ff); color: white; }

        .content-area { width: 100%; }

        /* --- MARKET --- */
        .sub-nav { display: none; gap: 8px; padding: 10px 0; overflow-x: auto; margin-bottom: 10px; }
        .sub-item { background: rgba(0, 210, 255, 0.1); color: var(--blue-light); padding: 8px 15px; border-radius: 4px; font-size: 0.65rem; font-weight: 700; border: 1px solid var(--blue-light); white-space: nowrap; }
        .sub-item.active { background: var(--blue-light); color: black; }

        .market-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
        }
        .item-card { background: var(--bg-card); border-radius: 0 12px 0 12px; border: 1px solid #1a2635; overflow: hidden; position: relative; }
        .item-card img { width: 100%; height: 120px; object-fit: cover; border-bottom: 1px solid #1a2635; }
        .item-card-info { padding: 10px; }
        .item-card-info h3 { margin: 0; font-size: 0.7rem; color: var(--blue-light); font-family: 'Orbitron'; height: 2.2em; overflow: hidden; }

        /* --- SELL --- */
        .sell-wrapper { width: 100%; display: none; justify-content: center; padding: 10px 0; }
        #publish-container { background: var(--bg-card); padding: 25px; border-radius: 15px; border: 1px solid var(--blue-light); width: 100%; max-width: 480px; }
        .input-field { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid #1a2635; padding: 12px; color: white; border-radius: 8px; margin-bottom: 12px; font-size: 1rem; }
        .btn-main { 
            background: var(--yellow-accent); color: #000; border: none; padding: 18px; 
            font-family: var(--font-impact); font-size: 1.1rem; cursor: pointer; width: 100%; 
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%); font-weight: 900; text-transform: uppercase; 
        }

        /* --- DESKTOP ADJUSTS --- */
        @media (min-width: 1024px) {
            .main-container { flex-direction: row; padding-top: 20px; }
            .sidebar { width: 200px; flex-direction: column; overflow: hidden; border-radius: 0 15px 0 15px; border-left: 4px solid var(--blue-light); border-bottom: none; }
            .market-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
            .video-side-container { display: block; }
            .left-video { left: 0; } .right-video { right: 0; }
        }
    </style>
</head>
<body>

<div class="video-side-container left-video"><video class="side-video-element" autoplay muted loop playsinline><source src="https://exitframe.com/assets/videos/sc_starfield_loop.mp4" type="video/mp4"></video></div>
<div class="video-side-container right-video"><video class="side-video-element" autoplay muted loop playsinline><source src="https://exitframe.com/assets/videos/sc_ui_loop.mp4" type="video/mp4"></video></div>

<nav>
    <img src="img/Shopy.png" class="logo-img" onclick="showTab('market')">
    <div class="nav-links">
        <a onclick="showTab('market')" id="link-market" class="active">MARKET</a>
        <a onclick="showTab('sell')" id="link-sell">SELL</a>
        <a onclick="showTab('my-items')" id="link-my-items" style="display:none;">MY ASSETS</a>
    </div>
</nav>

<div class="main-container">
    <aside class="sidebar" id="sidebar-filter">
        <div class="cat-item active" onclick="selectMainCategory('all', this)">ALL</div>
        <div class="cat-item" onclick="selectMainCategory('Armor', this)">ARMOR</div>
        <div class="cat-item" onclick="selectMainCategory('Weapons', this)">WEAPONS</div>
        <div class="cat-item" onclick="selectMainCategory('Ships', this)">SHIPS</div>
        <div class="cat-item" onclick="selectMainCategory('Components', this)">COMPONENTS</div>
        <div class="cat-item" onclick="selectMainCategory('Medical', this)">MEDICAL</div>
        <div class="cat-item" style="color:var(--yellow-accent)" onclick="selectMainCategory('Medals', this)">🎖️ MEDALS</div>
    </aside>

    <div class="content-area">
        <section id="market-section">
            <input type="text" id="main-search" class="input-field" placeholder="SEARCH items..." oninput="handleGlobalSearch()">
            <div id="sub-nav" class="sub-nav"></div>
            <h2 id="view-title" style="display:none; color: var(--yellow-accent); text-align: center; margin-bottom: 15px;">MY INVENTORY</h2>
            <div id="market-grid" class="market-grid"></div>
        </section>

        <section id="sell-section" class="sell-wrapper">
            <div id="publish-container">
                <h2 style="text-align:center; color: var(--blue-light); font-family: var(--font-impact); margin-bottom: 20px;">DATA UPLOAD</h2>
                <input type="text" id="item-name" class="input-field" placeholder="Asset Name">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <select id="item-cat" class="input-field" onchange="updateSubCatSelect()">
                        <option value="Armor">ARMOR</option>
                        <option value="Weapons">WEAPONS</option>
                        <option value="Ships">SHIPS</option>
                        <option value="Components">COMPONENTS</option>
                        <option value="Medical">MEDICAL</option>
                        <option value="Medals">MEDALS</option>
                    </select>
                    <select id="item-subcat" class="input-field"></select>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <input type="number" id="item-price" class="input-field" placeholder="aUEC Price">
                    <input type="text" id="item-location" class="input-field" placeholder="Location">
                </div>
                <textarea id="item-desc" class="input-field" style="height: 80px; resize: none;" placeholder="Manifest Details..."></textarea>
                <div id="img-preview" style="height: 150px; border: 1px dashed #333; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">NO IMAGE</div>
                <button class="input-field" style="background: #1a2635; cursor: pointer;" onclick="document.getElementById('file-input').click()">UPLOAD VISUAL</button>
                <input type="file" id="file-input" hidden onchange="processImg(this)">
                <button class="btn-main" onclick="uploadToNet()">CONFIRM BROADCAST</button>
            </div>
        </section>
    </div>
</div>

<script>
    const SB_URL = 'https://dfizvgagofsctgwzksgd.supabase.co';
    const SB_KEY = 'sb_publishable_3iByg_zBXp4C-SCtfeIiDw_NeyfB3wR';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let allItems = [];
    let currentUser = null;
    let currentTab = 'market';
    let selectedMainCat = 'all';
    let uploadedImgBase64 = null;

    const SUB_DATA = {
        'Armor': ['Helmet', 'Core', 'Arms', 'Legs', 'Backpack', 'Undersuit', 'Clothes'],
        'Components': ['Power Plant', 'Cooler', 'Quantum Drive', 'Shield Gen'],
        'Ships': ['Fighter', 'Industrial', 'Transport', 'Exploration'],
        'Weapons': ['Pistol', 'SMG', 'Rifle', 'Sniper', 'Shotgun'],
        'Medical': ['MedPen', 'ParaMed', 'Medical Bed'],
        'Medals': ['Combat', 'Service', 'Bravery']
    };

    async function fetchMarket() {
        const { data } = await _supabase.from('marketplace_items').select('*').order('created_at', {ascending: false});
        if (data) { allItems = data; renderGrid(allItems); }
    }

    function selectMainCategory(cat, el) {
        selectedMainCat = cat;
        document.querySelectorAll('.cat-item').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        const subNav = document.getElementById('sub-nav');
        subNav.innerHTML = '';
        if (SUB_DATA[cat]) {
            subNav.style.display = 'flex';
            const btnAll = document.createElement('div');
            btnAll.className = 'sub-item active'; btnAll.innerText = 'ALL ' + cat.toUpperCase();
            btnAll.onclick = () => filterBySub('all', btnAll);
            subNav.appendChild(btnAll);
            SUB_DATA[cat].forEach(sub => {
                const btn = document.createElement('div');
                btn.className = 'sub-item'; btn.innerText = sub.toUpperCase();
                btn.onclick = () => filterBySub(sub, btn);
                subNav.appendChild(btn);
            });
        } else { subNav.style.display = 'none'; }
        renderGrid(cat === 'all' ? allItems : allItems.filter(i => i.category === cat));
    }

    function filterBySub(sub, el) {
        document.querySelectorAll('.sub-item').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        let list = allItems.filter(i => i.category === selectedMainCat);
        if (sub !== 'all') list = list.filter(i => i.sub_category === sub);
        renderGrid(list);
    }

    function renderGrid(list) {
        const grid = document.getElementById('market-grid');
        grid.innerHTML = "";
        const displayList = (currentTab === 'my-items') ? list.filter(i => i.seller_id === currentUser?.id) : list;

        displayList.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            
            card.innerHTML = `
                ${(currentTab === 'my-items' && currentUser) ? `<button style="position:absolute;top:5px;right:5px;background:red;color:white;border:none;padding:5px;font-size:10px;z-index:10;cursor:pointer;" onclick="event.stopPropagation(); deleteAsset('${item.id}')">DEL</button>` : ''}
                <img src="${item.image_1 || ''}">
                <div class="item-card-info">
                    <span style="font-size:0.55rem; color:var(--blue-light); opacity:0.6;">${item.category} / ${item.sub_category || ''}</span>
                    <h3>${item.item_name.toUpperCase()}</h3>
                    <div style="color:var(--yellow-accent); font-weight:bold; font-size:0.85rem;">${parseInt(item.price_auec).toLocaleString()} aUEC</div>
                    <div style="margin-top:10px; text-align:center; background:var(--blue-light); color:black; font-size:0.6rem; font-weight:900; padding:8px; border-radius:2px; cursor:pointer;" onclick="goToDetails(${JSON.stringify(item).replace(/"/g, '&quot;')})">VIEW DETAILS</div>
                </div>`;
            grid.appendChild(card);
        });
    }

    function goToDetails(item) {
        localStorage.setItem('selectedItem', JSON.stringify(item));
        window.location.href = 'item.html';
    }

    async function deleteAsset(id) {
        if(!confirm("¿CONFIRM DATA PURGE?")) return;
        const { error } = await _supabase.from('marketplace_items').delete().eq('id', id);
        if(error) {
            alert("ERROR: " + error.message);
        } else {
            alert("ASSET REMOVED");
            fetchMarket();
        }
    }

    function updateSubCatSelect() {
        const cat = document.getElementById('item-cat').value;
        const subSelect = document.getElementById('item-subcat');
        subSelect.innerHTML = '';
        if (SUB_DATA[cat]) {
            SUB_DATA[cat].forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub; opt.innerText = sub.toUpperCase();
                subSelect.appendChild(opt);
            });
        }
    }

    async function uploadToNet() {
        if(!currentUser) {
            alert("⚠️ DEBES ESTAR LOGUEADO");
            return;
        }
        const name = document.getElementById('item-name').value;
        const price = document.getElementById('item-price').value;
        if(!name || !price) {
            alert("⚠️ NOMBRE Y PRECIO REQUERIDOS");
            return;
        }
        const payload = {
            item_name: name,
            category: document.getElementById('item-cat').value,
            sub_category: document.getElementById('item-subcat').value,
            location: document.getElementById('item-location').value,
            price_auec: parseInt(price),
            description: document.getElementById('item-desc').value,
            image_1: uploadedImgBase64,
            seller_id: currentUser.id
        };
        const { error } = await _supabase.from('marketplace_items').insert([payload]);
        if (error) {
            alert("❌ ERROR: " + error.message);
        } else {
            alert("🚀 TRANSMISIÓN COMPLETADA");
            location.reload();
        }
    }

    function showTab(t) {
        currentTab = t;
        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
        if(document.getElementById('link-'+t)) document.getElementById('link-'+t).classList.add('active');
        document.getElementById('market-section').style.display = (t === 'market' || t === 'my-items') ? 'block' : 'none';
        document.getElementById('sell-section').style.display = (t === 'sell') ? 'flex' : 'none';
        document.getElementById('sidebar-filter').style.display = (t === 'market') ? 'flex' : 'none';
        document.getElementById('view-title').style.display = (t === 'my-items') ? 'block' : 'none';
        renderGrid(allItems);
    }

    function processImg(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                uploadedImgBase64 = e.target.result;
                document.getElementById('img-preview').innerHTML = `<img src="${uploadedImgBase64}" style="width:100%;height:100%;object-fit:contain;">`;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function checkAuth() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (session) {
            currentUser = session.user;
            document.getElementById('link-my-items').style.display = 'inline-block';
        }
    }

    function handleGlobalSearch() {
        const term = document.getElementById('main-search').value.toLowerCase();
        const filtered = allItems.filter(i => 
            i.item_name.toLowerCase().includes(term) || 
            i.category.toLowerCase().includes(term) ||
            (i.sub_category && i.sub_category.toLowerCase().includes(term))
        );
        renderGrid(filtered);
    }

    window.onload = () => { fetchMarket(); checkAuth(); updateSubCatSelect(); };
</script>
</body>
</html>
