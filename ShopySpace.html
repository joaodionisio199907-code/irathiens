<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHOPYSPACE | GALAXY MARKET</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Barlow+Condensed:wght@700;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --blue-light: #00d2ff;
            --blue-dark: #0056ff;
            --yellow-accent: #ffb800;
            --yellow-bright: #ffe600;
            --bg-deep: #050a12;
            --bg-card: #0e1621;
            --text-white: #ffffff;
            --grad-blue: linear-gradient(90deg, #00d2ff 0%, #0056ff 100%);
            --font-main: 'Rajdhani', sans-serif;
            --font-logo: 'Orbitron', sans-serif;
            --font-impact: 'Barlow Condensed', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --danger: #ff4d4d;
        }

        ::-webkit-scrollbar { display: none; }
        
        body { 
            margin: 0; background-color: var(--bg-deep); color: var(--text-white);
            font-family: var(--font-main); overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #102a4d 0%, var(--bg-deep) 80%);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- NAVIGATION --- */
        nav {
            background: rgba(0, 0, 0, 0.95); border-bottom: 2px solid var(--blue-light);
            padding: 0 15px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(15px); height: 70px;
        }
        .logo-img { max-height: 80px; filter: drop-shadow(0 0 8px var(--blue-light)); cursor: pointer; }
        .nav-links { display: flex; gap: 8px; align-items: center; }
        .nav-links a { 
            color: #fff; text-decoration: none; font-family: var(--font-impact); font-size: 0.85rem; 
            cursor: pointer; transition: 0.3s; text-transform: uppercase; font-style: italic;
            padding: 6px 10px; border-radius: 4px;
        }
        #link-my-items.active { 
            background: rgba(255, 184, 0, 0.15); color: var(--yellow-bright); 
            border: 1px solid var(--yellow-accent); box-shadow: 0 0 15px rgba(255, 184, 0, 0.2);
        }
        .nav-links a.active:not(#link-my-items) { color: var(--blue-light); border-bottom: 2px solid var(--blue-light); }

        /* --- LAYOUT --- */
        .marketplace-wrapper { max-width: 1200px; margin: 10px auto; padding: 0 15px; display: grid; grid-template-columns: 180px 1fr; gap: 20px; }

        .sidebar { background: var(--bg-card); padding: 15px; border-radius: 0 15px 0 15px; border-left: 4px solid var(--blue-light); height: fit-content; position: sticky; top: 90px; }
        .cat-item { display: block; padding: 12px; color: #8899af; text-decoration: none; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: 0.2s; margin-bottom: 5px; border-radius: 4px; }
        .cat-item.active { background: var(--grad-blue); color: white; clip-path: polygon(0 0, 100% 0, 95% 100%, 0 100%); }

        /* --- GRID & CARDS --- */
        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        .item-card { background: var(--bg-card); border: 1px solid #1a2635; border-radius: 0 12px 0 12px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; position: relative; transition: 0.3s; }
        .item-card img { width: 100%; height: 140px; object-fit: cover; border-bottom: 1px solid #1a2635; }
        .item-card-info { padding: 10px; }
        .item-card-info h3 { margin: 0; font-size: 0.75rem; color: var(--blue-light); font-family: var(--font-logo); line-height: 1.2; height: 2.4em; overflow: hidden; }

        .mgmt-controls { position: absolute; top: 5px; right: 5px; z-index: 50; }
        .btn-del { 
            background: var(--danger); color: white; border: none; padding: 6px 10px; 
            border-radius: 4px; cursor: pointer; font-size: 10px; font-weight: 900;
            box-shadow: 0 2px 8px rgba(255, 77, 77, 0.4);
        }

        /* --- SELL SECTION REDESIGN --- */
        #publish-container { 
            background: var(--bg-card); padding: 20px; border-radius: 15px; 
            border: 1px solid rgba(0, 210, 255, 0.3); max-width: 500px; margin: 0 auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-size: 0.7rem; color: var(--blue-light); font-family: var(--font-mono); text-transform: uppercase; margin-bottom: 5px; margin-left: 5px; }
        .search-bar { 
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid #1a2635; 
            padding: 12px; color: white; border-radius: 8px; box-sizing: border-box; 
            font-family: var(--font-main); font-size: 0.95rem; transition: 0.3s;
        }
        .search-bar:focus { border-color: var(--blue-light); outline: none; background: rgba(0, 210, 255, 0.05); }
        
        #img-preview { width: 100%; min-height: 150px; background: rgba(0,0,0,0.2); border: 2px dashed #1a2635; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; overflow: hidden; }
        #img-preview img { width: 100%; height: 100%; object-fit: contain; }

        .action-btn { 
            background: var(--grad-blue); border: none; padding: 15px; color: #fff; 
            font-family: var(--font-impact); font-size: 1rem; cursor: pointer; 
            text-transform: uppercase; font-style: italic; width: 100%; 
            clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%); margin-bottom: 10px;
        }
        .btn-secondary { background: #1a2635; font-size: 0.8rem; clip-path: none; border-radius: 6px; }

        /* --- MODAL --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 15px; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--blue-light); width: 100%; max-width: 400px; border-radius: 20px; overflow: hidden; }

        /* --- MOBILE OPTIMIZATION --- */
        @media (max-width: 768px) {
            .marketplace-wrapper { grid-template-columns: 1fr; margin-top: 0; }
            .sidebar { 
                position: sticky; top: 70px; display: flex; overflow-x: auto; 
                border-left: none; border-bottom: 1px solid var(--blue-light); 
                background: var(--bg-deep); border-radius: 0; margin: 0 -15px 10px -15px; 
                padding: 10px; gap: 5px; z-index: 900;
            }
            .cat-item { white-space: nowrap; margin-bottom: 0; padding: 8px 15px; font-size: 0.75rem; }
            .market-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .logo-img { max-height: 60px; }
            #publish-container { padding: 15px; border: none; background: transparent; }
            .action-btn { padding: 18px; }
        }
    </style>
</head>
<body>

<nav>
    <div class="logo-wrapper" onclick="showTab('market')">
        <img src="img/Shopy.png" class="logo-img">
    </div>
    <div class="nav-links">
        <a onclick="showTab('market')" id="link-market" class="active">MARKET</a>
        <a onclick="showTab('sell')" id="link-sell">SELL</a>
        <a onclick="showTab('my-items')" id="link-my-items" style="display:none;">MY ASSETS</a>
    </div>
</nav>

<div class="marketplace-wrapper">
    <aside class="sidebar" id="sidebar-filter">
        <a class="cat-item active" onclick="filterByCategory('all', this)">ALL</a>
        <a class="cat-item" onclick="filterByCategory('Armor', this)">ARMOR</a>
        <a class="cat-item" onclick="filterByCategory('Weapons', this)">WEAPONS</a>
        <a class="cat-item" onclick="filterByCategory('Ships', this)">SHIPS</a>
        <a class="cat-item" onclick="filterByCategory('Medical', this)">MEDICAL</a>
    </aside>

    <main>
        <section id="market">
            <input type="text" id="main-search" class="search-bar" placeholder="SEARCH ASSET..." oninput="handleGlobalSearch()" style="margin-bottom:15px;">
            <h2 id="view-title" style="display:none; color: var(--yellow-accent); font-family: var(--font-impact); margin-bottom: 15px; text-align: center; letter-spacing: 2px; font-size: 1.2rem;">MANAGE YOUR INVENTORY</h2>
            <div id="market-grid" class="market-grid"></div>
        </section>

        <section id="sell" style="display:none;">
            <div id="publish-container">
                <h2 style="color: var(--blue-light); font-family: var(--font-impact); margin:0 0 20px 0; text-align: center; letter-spacing: 1px;">ASSET REGISTRATION</h2>
                
                <div class="form-group">
                    <label class="form-label">Item Name</label>
                    <input type="text" id="item-name" class="search-bar" placeholder="e.g. Aegis Titan">
                </div>

                <div class="form-group">
                    <label class="form-label">Classification</label>
                    <select id="item-cat" class="search-bar">
                        <option value="Armor">ARMOR</option>
                        <option value="Weapons">WEAPONS</option>
                        <option value="Ships">SHIPS</option>
                        <option value="Medical">MEDICAL</option>
                    </select>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label class="form-label">Price (aUEC)</label>
                        <input type="number" id="item-price" class="search-bar" placeholder="000">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Location</label>
                        <input type="text" id="item-location" class="search-bar" placeholder="New Babbage">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Technical Specs / Info</label>
                    <textarea id="item-desc" class="search-bar" placeholder="Details about the item..." style="height: 80px; resize: none;"></textarea>
                </div>
                
                <div id="img-preview">
                    <span style="color:#444; font-size: 0.8rem;">NO IMAGE SELECTED</span>
                </div>
                
                <button class="action-btn btn-secondary" onclick="document.getElementById('file-input').click()">UPLOAD VISUAL DATA</button>
                <input type="file" id="file-input" hidden onchange="processImg(this)">
                
                <button class="action-btn" id="btn-publish" onclick="uploadToNet()" style="background:var(--yellow-accent); color:#000; margin-top: 10px;">CONFIRM & PUBLISH</button>
            </div>
        </section>
    </main>
</div>

<div class="modal-overlay" id="item-modal" onclick="if(event.target == this) closeModal()">
    <div class="modal-content">
        <img id="m-img" src="" style="width: 100%; height: 180px; object-fit: cover; border-bottom: 2px solid var(--blue-light);">
        <div style="padding: 20px;">
            <h2 id="m-title" style="margin:0; font-family: var(--font-logo); color: var(--blue-light); font-size: 0.9rem;"></h2>
            <div id="m-price" style="font-size: 1.4rem; color: var(--yellow-bright); font-family: var(--font-mono); margin: 10px 0;"></div>
            <p style="font-size: 0.75rem; color: #8899af; margin-bottom: 20px;">SECTOR: <span id="m-loc" style="color:white"></span></p>
            <button class="action-btn" id="m-btn">VIEW FULL SPECS</button>
            <button class="action-btn" onclick="closeModal()" style="background:transparent; border:1px solid #444; clip-path:none; font-size: 0.8rem;">BACK TO MARKET</button>
        </div>
    </div>
</div>

<script>
    const SB_URL = 'https://dfizvgagofsctgwzksgd.supabase.co';
    const SB_KEY = 'sb_publishable_3iByg_zBXp4C-SCtfeIiDw_NeyfB3wR';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    let allItems = [];
    let currentUser = null;
    let currentTab = 'market';
    let uploadedImgBase64 = null;

    async function fetchMarket() {
        const { data, error } = await _supabase.from('marketplace_items').select('*').order('created_at', {ascending: false});
        if (!error) { 
            allItems = data;
            updateView();
        }
    }

    function updateView() {
        const grid = document.getElementById('market-grid');
        grid.innerHTML = "";
        
        const list = (currentTab === 'my-items') 
            ? allItems.filter(i => i.seller_id === currentUser?.id) 
            : allItems;

        list.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.onclick = (e) => { if(!e.target.closest('.mgmt-controls')) openDetails(item); };
            
            let mgmt = "";
            if(currentTab === 'my-items' && currentUser && item.seller_id === currentUser.id) {
                mgmt = `<div class="mgmt-controls"><button class="btn-del" onclick="deleteAsset('${item.id}')">DEL</button></div>`;
            }

            card.innerHTML = `
                ${mgmt}
                <img src="${item.image_1 || 'https://via.placeholder.com/400x200'}" loading="lazy">
                <div class="item-card-info">
                    <h3>${item.item_name.toUpperCase()}</h3>
                    <div style="color: var(--yellow-bright); font-family: var(--font-mono); font-weight: bold; font-size: 0.85rem; margin-top:5px;">${parseInt(item.price_auec).toLocaleString()} aUEC</div>
                </div>`;
            grid.appendChild(card);
        });
    }

    async function uploadToNet() {
        if(!currentUser) return alert("AUTH ERROR: LOG IN REQUIRED");
        
        const payload = {
            item_name: document.getElementById('item-name').value,
            category: document.getElementById('item-cat').value,
            location: document.getElementById('item-location').value,
            price_auec: document.getElementById('item-price').value,
            description: document.getElementById('item-desc').value,
            image_1: uploadedImgBase64,
            seller_id: currentUser.id
        };

        if(!payload.item_name || !payload.price_auec) return alert("NAME AND PRICE REQUIRED");

        const { error } = await _supabase.from('marketplace_items').insert([payload]);

        if (!error) {
            alert("ASSET PUBLISHED TO GALAXY MARKET");
            resetForm();
            await fetchMarket();
            showTab('market');
        } else {
            alert("UPLOAD FAILED: " + error.message);
        }
    }

    function resetForm() {
        document.getElementById('item-name').value = "";
        document.getElementById('item-price').value = "";
        document.getElementById('item-location').value = "";
        document.getElementById('item-desc').value = "";
        document.getElementById('img-preview').innerHTML = '<span style="color:#444; font-size: 0.8rem;">NO IMAGE SELECTED</span>';
        uploadedImgBase64 = null;
    }

    function processImg(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                uploadedImgBase64 = e.target.result;
                document.getElementById('img-preview').innerHTML = `<img src="${uploadedImgBase64}">`;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function deleteAsset(id) {
        if (confirm("TERMINATE THIS LISTING PERMANENTLY?")) {
            const { error } = await _supabase.from('marketplace_items').delete().eq('id', id);
            if (!error) { fetchMarket(); }
        }
    }

    function showTab(t) {
        currentTab = t;
        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
        
        document.getElementById('market').style.display = (t === 'market' || t === 'my-items') ? 'block' : 'none';
        document.getElementById('sell').style.display = (t === 'sell') ? 'block' : 'none';
        document.getElementById('sidebar-filter').style.display = (t === 'market') ? 'block' : 'none';
        document.getElementById('view-title').style.display = (t === 'my-items') ? 'block' : 'none';

        if (t === 'market') document.getElementById('link-market').classList.add('active');
        if (t === 'sell') document.getElementById('link-sell').classList.add('active');
        if (t === 'my-items') document.getElementById('link-my-items').classList.add('active');
        
        updateView();
        window.scrollTo(0,0);
    }

    function openDetails(item) {
        document.getElementById('m-title').innerText = item.item_name.toUpperCase();
        document.getElementById('m-price').innerText = parseInt(item.price_auec).toLocaleString() + " aUEC";
        document.getElementById('m-img').src = item.image_1 || '';
        document.getElementById('m-loc').innerText = (item.location || 'UNKNOWN').toUpperCase();
        document.getElementById('m-btn').onclick = () => { window.location.href = `item.html?id=${item.id}`; };
        document.getElementById('item-modal').style.display = 'flex';
        document.body.style.overflow = 'hidden'; 
    }

    function closeModal() { document.getElementById('item-modal').style.display = 'none'; document.body.style.overflow = 'auto'; }

    function handleGlobalSearch() {
        const q = document.getElementById('main-search').value.toLowerCase();
        const list = (currentTab === 'my-items') ? allItems.filter(i => i.seller_id === currentUser?.id) : allItems;
        const filtered = list.filter(i => i.item_name.toLowerCase().includes(q));
        
        const grid = document.getElementById('market-grid');
        grid.innerHTML = "";
        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.onclick = () => openDetails(item);
            card.innerHTML = `<img src="${item.image_1 || ''}"><div class="item-card-info"><h3>${item.item_name.toUpperCase()}</h3></div>`;
            grid.appendChild(card);
        });
    }

    async function checkAuth() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (session) {
            currentUser = session.user;
            document.getElementById('link-my-items').style.display = 'inline-block';
        }
    }

    function filterByCategory(cat, el) {
        document.querySelectorAll('.cat-item').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        const list = (currentTab === 'my-items') ? allItems.filter(i => i.seller_id === currentUser?.id) : allItems;
        const filtered = cat === 'all' ? list : list.filter(i => i.category === cat);
        const grid = document.getElementById('market-grid');
        grid.innerHTML = "";
        filtered.forEach(item => {
             const card = document.createElement('div');
             card.className = 'item-card';
             card.onclick = () => openDetails(item);
             card.innerHTML = `<img src="${item.image_1 || ''}"><div class="item-card-info"><h3>${item.item_name.toUpperCase()}</h3></div>`;
             grid.appendChild(card);
        });
    }

    window.onload = () => { fetchMarket(); checkAuth(); };
</script>
</body>
</html>
