<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopySpace | Expediente de Ciudadano</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Inter:wght@300;400;600&family=Rajdhani:wght@500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg: #050a12;
            --bg-soft: #0e1621;
            --primary: #00d2ff;
            --accent: #0056ff;
            --text: #e6f1ff;
            --muted: #5a6b82;
            --border: rgba(0, 210, 255, 0.2);
            --glass: rgba(10, 20, 35, 0.85);
            --danger: #ff4444;
            --success: #00ff88;
        }

        * { box-sizing: border-box; }
        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background-color: var(--bg); color: var(--text); 
            min-height: 100vh; position: relative; overflow-x: hidden; 
        }

        #bg-parallax { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at top right, #001a33 0%, #050a12 60%); z-index: -2; }

        header { position: sticky; top: 0; z-index: 100; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border); }
        .nav { max-width: 1200px; margin: auto; padding: 0.8rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 0.8rem; font-family: 'Orbitron', sans-serif; text-decoration: none; color: var(--primary); }
        .logo-img { height: 90px; filter: drop-shadow(0 0 5px var(--primary)); }

        nav a { margin-left: 1.2rem; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        nav a:hover, nav a.active { color: var(--primary); }

        .main-container { max-width: 1200px; margin: 30px auto; padding: 0 15px; display: grid; grid-template-columns: 320px 1fr; gap: 25px; }

        @media (max-width: 992px) { .main-container { grid-template-columns: 1fr; } }

        .profile-card { background: var(--glass); border: 1px solid var(--border); border-radius: 12px; padding: 35px 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .content-panel { background: var(--glass); border: 1px solid var(--border); border-radius: 12px; padding: 25px; }
        
        .section-title { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; color: var(--primary); margin-bottom: 25px; display: flex; align-items: center; gap: 15px; letter-spacing: 2px; }
        .section-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }

        select { width: 100%; padding: 12px 15px; background: #000; border: 1px solid var(--border); border-radius: 6px; color: white; outline: none; font-family: 'Rajdhani'; font-size: 1rem; }

        .btn-action { background: linear-gradient(90deg, var(--primary), var(--accent)); color: white; border: none; padding: 12px 25px; border-radius: 6px; font-family: 'Orbitron'; font-size: 0.7rem; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-action:hover { filter: brightness(1.2); transform: translateY(-1px); }

        .fleet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .ship-card { background: var(--bg-soft); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 12px; transition: 0.3s; }
        .ship-card:hover { border-color: var(--primary); }
        .ship-img { width: 100%; height: 110px; object-fit: cover; border-radius: 4px; }

        footer { margin-top: 50px; padding: 30px; text-align: center; border-top: 1px solid var(--border); color: var(--muted); font-size: 0.75rem; letter-spacing: 1px; }
    </style>
</head>
<body> 
<div id="bg-parallax"></div>

<header>
    <div class="nav">
        <a href="index.html" class="logo">
            <img src="img/Shopy.png" alt="ShopySpace" class="logo-img"> 
            <span style="font-size: 0.9rem; letter-spacing: 3px;">SHOPYSPACE</span>
        </a>
        <nav>
            <a href="index.html">Market</a>
            <a href="chat.html">Comms</a>
            <a href="#" class="active">Perfil</a>
            <a href="#" onclick="handleLogout()" style="color: var(--danger);">Desconectar</a>
        </nav>
    </div>
</header>

<div class="main-container">
    <aside class="sidebar">
        <div class="profile-card">
            <img src="https://robertsspaceindustries.com/media/7p79ck2sc5r9rr/heap_infocus/Loading_The_Carrack.jpg" id="avatar-img" style="width: 110px; height: 110px; border-radius: 10px; object-fit: cover; border: 1px solid var(--primary); box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);">
            
            <div id="display-name" style="font-family: 'Orbitron'; margin-top: 20px; font-size: 1.1rem; color: var(--primary);">USUARIO</div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 25px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 25px;">
                <div>
                    <small style="font-size: 0.55rem; color: var(--muted); display: block; margin-bottom: 5px;">HANGAR</small>
                    <div id="ship-count" style="font-family: 'JetBrains Mono'; font-size:1.2rem; font-weight:700;">0</div>
                </div>
                <div>
                    <small style="font-size: 0.55rem; color: var(--muted); display: block; margin-bottom: 5px;">ESTADO</small>
                    <div id="display-rank" style="font-family: 'Orbitron'; color:var(--success); font-size:0.6rem;">CIVIL</div>
                </div>
            </div>
        </div>
    </aside>

    <main class="content-area">
        <div class="content-panel">
            <div class="section-title">REGISTRO DE FLOTA CIVIL</div>
            <div style="display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-bottom: 15px;">
                <select id="ship-selector">
                    <option value="" disabled selected>Vincular nueva unidad...</option>
                    <option value="Carrack">Anvil Carrack</option>
                    <option value="Arrow">Anvil Arrow</option>
                    <option value="Cutter">Drake Cutter</option>
                    <option value="Avenger Titan">Aegis Avenger Titan</option>
                    <option value="Constellation">RSI Constellation</option>
                    <option value="Caterpillar">Drake Caterpillar</option>
                </select>
                <button class="btn-action" onclick="addShip()">+ REGISTRAR</button>
            </div>
            <div class="fleet-grid" id="fleet-grid"></div>
        </div>
    </main>
</div>

<footer>SECURE TERMINAL | © 2026 SHOPYSPACE NETWORK</footer>

<script>
const SB_URL = 'https://dfizvgagofsctgwzksgd.supabase.co';
const SB_KEY = 'sb_publishable_3iByg_zBXp4C-SCtfeIiDw_NeyfB3wR'; 
const _supabase = supabase.createClient(SB_URL, SB_KEY);
let currentUser = null;

async function init() {
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) { window.location.href = "login.html"; return; }
    currentUser = user;

    let { data: profile } = await _supabase.from('perfiles').select('*').eq('id', user.id).single();
    
    if (profile) {
        document.getElementById('display-name').innerText = (profile.display_name || user.email.split('@')[0]).toUpperCase();
        // Cambiamos "Cadete" por algo neutral como "Civil" o "Merchant"
        document.getElementById('display-rank').innerText = (profile.rank || "CIVIL").toUpperCase();

        if (profile.ships && profile.ships.length > 0) {
            document.getElementById('fleet-grid').innerHTML = '';
            profile.ships.forEach(s => renderShipCard(s));
        } else {
            document.getElementById('fleet-grid').innerHTML = '<p style="color:var(--muted); font-size:0.8rem; grid-column: 1/-1; text-align:center; padding: 40px;">No se han detectado naves civiles en este registro.</p>';
        }
    }
    updateShipCount();
}

function renderShipCard(name) {
    const grid = document.getElementById('fleet-grid');
    if(grid.querySelector('p')) grid.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'ship-card';
    card.innerHTML = `
        <img src="https://media.robertsspaceindustries.com/v8p0803m4284m/store_slideshow_large.jpg" class="ship-img">
        <div style="font-family:Orbitron; font-size:0.6rem; color:var(--primary); margin: 10px 0; font-weight:700; text-align:center;">${name.toUpperCase()}</div>
        <button onclick="removeShip(this)" style="background:rgba(255,68,68,0.1); border:1px solid var(--danger); color:var(--danger); cursor:pointer; width:100%; padding:6px; border-radius:4px; font-family:Orbitron; font-size:0.5rem; font-weight:700;">DESVINCULAR</button>
    `;
    grid.appendChild(card);
}

async function addShip() {
    const name = document.getElementById('ship-selector').value;
    if (name) { renderShipCard(name); await syncShips(); }
}

async function removeShip(btn) {
    if(confirm("¿Confirmas la eliminación de este registro de hangar?")) { 
        btn.parentElement.remove(); 
        await syncShips(); 
    }
}

async function syncShips() {
    const ships = Array.from(document.querySelectorAll('.ship-card div')).map(el => el.innerText);
    await _supabase.from('perfiles').update({ ships: ships }).eq('id', currentUser.id);
    updateShipCount();
}

function updateShipCount() {
    const count = document.querySelectorAll('.ship-card').length;
    document.getElementById('ship-count').innerText = count;
}

async function handleLogout() {
    await _supabase.auth.signOut();
    window.location.href = "login.html";
}

init();
</script>
</body>
</html>
