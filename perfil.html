<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irathiens | Perfil de Ciudadano</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Inter:wght@300;400;600&family=Rajdhani:wght@500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg: #060b14;
            --bg-soft: #0b1220;
            --primary: #ff9a1f;
            --accent: #ffb347;
            --text: #e6f1ff;
            --muted: #9fb3c8;
            --border: rgba(255, 154, 31, 0.2);
            --glass: rgba(11, 18, 32, 0.8);
            --danger: #ff4444;
            --success: #00ff88;
        }

        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            min-height: 100vh; 
            position: relative; 
            overflow-x: hidden; 
            user-select: none; 
        }

        #bg-parallax { position: fixed; top: -5%; left: -5%; width: 110%; height: 110%; background-image: url('irathsky.jpg'); background-size: cover; background-position: center; opacity: 0.3; z-index: -2; }

        header { position: sticky; top: 0; z-index: 100; background: rgba(6, 11, 20, 0.9); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border); }
        .nav { max-width: 1200px; margin: auto; padding: 0.8rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 0.8rem; font-family: 'Orbitron', sans-serif; text-decoration: none; }
        .logo-text { color: var(--primary); }
        .logo-img { height: 32px; filter: drop-shadow(0 0 5px var(--primary)); }

        nav a { margin-left: 1rem; color: var(--muted); text-decoration: none; font-weight: 500; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        nav a:hover, nav a.active { color: var(--primary); }

        .main-container { 
            max-width: 1200px; 
            margin: 20px auto; 
            padding: 0 15px; 
            display: grid; 
            grid-template-columns: 320px 1fr; 
            gap: 20px; 
        }

        @media (max-width: 992px) {
            .main-container { grid-template-columns: 1fr; }
        }

        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .profile-card { background: var(--glass); border: 1px solid var(--border); border-radius: 15px; padding: 30px 20px; text-align: center; backdrop-filter: blur(10px); }
        
        .content-panel { background: var(--glass); border: 1px solid var(--border); border-radius: 15px; padding: 25px; backdrop-filter: blur(10px); margin-bottom: 20px; }
        .section-title { font-family: 'Orbitron', sans-serif; font-size: 0.9rem; color: var(--primary); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .section-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }

        select { width: 100%; padding: 12px 15px; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border); border-radius: 8px; color: white; outline: none; }

        .btn-action { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #000; border: none; padding: 12px 20px; border-radius: 8px; font-family: 'Orbitron'; font-weight: 700; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn-action:hover { opacity: 0.9; transform: translateY(-2px); }

        .fleet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
        .ship-card { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
        .ship-img { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; }

        footer { margin-top: 40px; padding: 20px; text-align: center; border-top: 1px solid var(--border); color: var(--muted); font-size: 0.8rem; }
    </style>
</head>
<body oncontextmenu="return false;"> 
<div id="bg-parallax"></div>

<header>
    <div class="nav">
        <a href="index.html" class="logo">
            <img src="logo.png" alt="Logo" class="logo-img"> 
            <span class="logo-text">IRATHIENS</span>
        </a>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="wiki.html">Wiki</a>
            <a href="#" class="active">Perfil</a>
            <a href="AdminPanel.html" id="admin-link" style="display:none; color:cyan;">ADMIN</a>
            <a href="#" onclick="handleLogout()" style="color: var(--danger);">Salir</a>
        </nav>
    </div>
</header>

<div class="main-container">
    <aside class="sidebar">
        <div class="profile-card">
            <img src="https://robertsspaceindustries.com/media/7p79ck2sc5r9rr/heap_infocus/Loading_The_Carrack.jpg" id="avatar-img" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary);">
            <div class="user-name" id="display-name" style="font-family: 'Orbitron'; margin-top: 15px; letter-spacing: 1px;">CARGANDO...</div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; border-top: 1px solid var(--border); padding-top: 20px;">
                <div><small style="font-size: 0.6rem; color: var(--muted);">NAVES</small><div id="ship-count" style="font-size:1.1rem; font-weight:700; color: var(--primary);">0</div></div>
                <div><small style="font-size: 0.6rem; color: var(--muted);">RANGO</small><div id="display-rank" style="color:var(--text); font-size:0.7rem; font-weight: 600;">CADETE</div></div>
            </div>
        </div>
    </aside>

    <main class="content-area">
        <div class="content-panel">
            <div class="section-title">GESTIÓN DE HANGAR PERSONAL</div>
            <div style="display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-bottom: 15px;">
                <select id="ship-selector">
                    <option value="" disabled selected>Selecciona una nave para registrar...</option>
                    <option value="Carrack">Anvil Carrack</option>
                    <option value="Arrow">Anvil Arrow</option>
                    <option value="Cutter">Drake Cutter</option>
                    <option value="Avenger Titan">Aegis Avenger Titan</option>
                    <option value="Constellation">RSI Constellation</option>
                    <option value="Mercury Star Runner">Crusader MSR</option>
                </select>
                <button class="btn-action" onclick="addShip()">+ AÑADIR</button>
            </div>
            <div class="fleet-grid" id="fleet-grid">
                </div>
        </div>
    </main>
</div>

<footer>© 2026 Irathiens Command · Comunicaciones Seguras</footer>

<script>
const SB_URL = 'https://dfizvgagofsctgwzksgd.supabase.co';
const SB_KEY = 'sb_publishable_3iByg_zBXp4C-SCtfeIiDw_NeyfB3wR'; 
const _supabase = supabase.createClient(SB_URL, SB_KEY);
let currentUser = null;

async function init() {
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) { window.location.href = "login.html"; return; }
    currentUser = user;

    let { data: profile } = await _supabase.from('perfiles').select('*').eq('id', user.id).single();
    
    if (profile) {
        document.getElementById('display-name').innerText = (profile.display_name || user.email.split('@')[0]).toUpperCase();
        document.getElementById('display-rank').innerText = (profile.rank || "Cadete de Flota").toUpperCase();

        if (profile.ships && profile.ships.length > 0) {
            document.getElementById('fleet-grid').innerHTML = '';
            profile.ships.forEach(s => renderShipCard(s));
        } else {
            document.getElementById('fleet-grid').innerHTML = '<p style="color:var(--muted); font-size:0.8rem; grid-column: 1/-1; text-align:center;">No hay naves registradas en tu hangar.</p>';
        }
        
        if (profile.role === 'admin') document.getElementById('admin-link').style.display = 'inline';
    }
    updateShipCount();
}

function renderShipCard(name) {
    const grid = document.getElementById('fleet-grid');
    // Si es la primera nave, limpiamos el mensaje de "No hay naves"
    if(grid.querySelector('p')) grid.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'ship-card';
    card.innerHTML = `
        <img src="https://media.robertsspaceindustries.com/v8p0803m4284m/store_slideshow_large.jpg" class="ship-img">
        <div style="font-family:Orbitron; font-size:0.65rem; color:var(--primary); margin-top:8px; font-weight:700;">${name.toUpperCase()}</div>
        <button onclick="removeShip(this)" style="background:rgba(255,0,0,0.1); border:1px solid var(--danger); color:var(--danger); cursor:pointer; width:100%; margin-top:8px; padding:6px; border-radius:4px; font-family:Orbitron; font-size:0.5rem; font-weight:700;">ELIMINAR</button>
    `;
    grid.appendChild(card);
}

async function addShip() {
    const selector = document.getElementById('ship-selector');
    const name = selector.value;
    if (name) { 
        renderShipCard(name); 
        await syncShips();
        selector.selectedIndex = 0;
    }
}

async function removeShip(btn) {
    if(confirm("¿Confirmas la eliminación de esta unidad de tu hangar oficial?")) { 
        btn.parentElement.remove(); 
        await syncShips(); 
    }
}

async function syncShips() {
    const ships = Array.from(document.querySelectorAll('.ship-card div')).map(el => el.innerText);
    const { error } = await _supabase.from('perfiles').update({ ships: ships }).eq('id', currentUser.id);
    if(error) console.error("Error sincronizando hangar:", error);
    updateShipCount();
}

function updateShipCount() {
    const count = document.querySelectorAll('.ship-card').length;
    const el = document.getElementById('ship-count');
    if(el) el.innerText = count;
}

async function handleLogout() {
    await _supabase.auth.signOut();
    window.location.href = "login.html";
}

init();
</script>
</body>
</html>
